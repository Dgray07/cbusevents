<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Columbus Communities — CBUSEVENTS</title>
<meta name="description" content="Explore Columbus communities — Black Columbus, Latino Columbus, LGBTQ+, Arts, Tech, Faith and more on CBUSEVENTS.">
<meta name="theme-color" content="#080810">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
:root{
  --bg:#080810;--surface:#0f0f1a;--card:#141420;--border:#1e1e2e;
  --text:#f0f0fa;--sub:#7070a0;--muted:#40405a;
  --orange:#FF6B35;--orange-dim:rgba(255,107,53,0.1);--orange-border:rgba(255,107,53,0.25);
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --r-lg:14px;--r-full:9999px;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
a{text-decoration:none;color:inherit;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(8,8,16,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:62px;}
.nav-logo{font-weight:900;font-size:17px;letter-spacing:-0.05em;text-transform:uppercase;cursor:pointer;}
.nav-logo span{color:var(--orange);}
.nav-back{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sub);transition:color 0.2s;}
.nav-back:hover{color:var(--orange);}
.nav-cta{background:var(--orange);color:#fff;font-weight:700;font-size:13px;padding:8px 20px;border-radius:var(--r-lg);border:none;cursor:pointer;font-family:var(--font);}

/* HERO */
.hero{padding:72px 48px 56px;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(255,107,53,0.07) 0%,transparent 70%);border-bottom:1px solid var(--border);text-align:center;animation:fadeUp 0.5s ease;}
.hero-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--orange);margin-bottom:14px;}
.hero-title{font-size:clamp(36px,6vw,64px);font-weight:900;letter-spacing:-0.04em;line-height:0.95;margin-bottom:16px;}
.hero-desc{font-size:16px;color:var(--sub);max-width:520px;margin:0 auto;line-height:1.7;}

/* GRID */
.grid-wrap{max-width:1100px;margin:0 auto;padding:56px 48px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}

/* COMMUNITY CARD */
.community-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px 24px;cursor:pointer;transition:all 0.2s;display:block;position:relative;overflow:hidden;}
.community-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity 0.2s;}
.community-card:hover{transform:translateY(-3px);}
.community-card-bar{height:3px;border-radius:2px;margin-bottom:16px;transition:width 0.2s;}
.community-card-name{font-size:18px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px;}
.community-card-desc{font-size:13px;color:var(--sub);line-height:1.65;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.community-card-cta{font-family:var(--mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;font-weight:700;}

/* FOOTER */
footer{background:var(--surface);border-top:1px solid var(--border);padding:24px 48px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:40px;}
.f-logo{font-weight:900;font-size:15px;letter-spacing:-0.04em;text-transform:uppercase;cursor:pointer;}
.f-logo span{color:var(--orange);}
.f-copy{font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}

@media(max-width:600px){
  nav{padding:0 20px;}
  .hero{padding:48px 20px 40px;}
  .grid-wrap{padding:32px 16px;}
  footer{padding:20px;}
}
</style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="window.location.href='https://cbusevents.com'">CBUS<span>EVENTS</span></div>
  <a href="https://cbusevents.com" class="nav-back">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Back
  </a>
  <button class="nav-cta" onclick="window.location.href='https://cbusevents.com/signup.html'">Join Free</button>

<div class="grid-wrap">

</div>

<footer>
