<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Portal — CBUSEVENTS</title>
<meta name="theme-color" content="#080810">
<link rel="apple-touch-icon" href="/assets/cbus-shield.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
:root{
  --bg:#080810;--surface:#0f0f1a;--card:#141420;--card-hover:#18182a;
  --border:#1e1e2e;--border-sub:#191928;--text:#f0f0fa;--sub:#7070a0;--muted:#40405a;
  --orange:#FF6B35;--orange-dim:rgba(255,107,53,0.1);--orange-border:rgba(255,107,53,0.25);
  --green:#34d399;--green-dim:rgba(52,211,153,0.1);--green-border:rgba(52,211,153,0.2);
  --red:#f87171;--blue:#818cf8;--blue-dim:rgba(129,140,248,0.1);--blue-border:rgba(129,140,248,0.2);
  --gold:#fbbf24;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --r-sm:8px;--r-md:10px;--r-lg:14px;--r-xl:16px;--r-full:9999px;
  --sidebar-w:230px;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;min-height:100vh;}
a{text-decoration:none;color:inherit;}
button{font-family:var(--font);cursor:pointer;border:none;}
input,select,textarea{font-family:var(--font);background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;color:var(--text);font-size:14px;width:100%;outline:none;transition:border-color 0.18s;}
input:focus,select:focus,textarea:focus{border-color:var(--orange-border);}
input::placeholder,textarea::placeholder{color:var(--muted);}
textarea{resize:vertical;min-height:90px;}
select option{background:var(--card);}
label{display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:10;}
.sidebar::-webkit-scrollbar{width:0;}
.sidebar-logo{padding:28px 22px 22px;border-bottom:1px solid var(--border-sub);position:relative;}
.sidebar-logo::after{content:'';position:absolute;bottom:0;left:22px;right:22px;height:1px;background:linear-gradient(90deg,var(--orange),transparent);opacity:0.4;}
.sidebar-logo-text{font-weight:900;font-size:17px;letter-spacing:-0.05em;text-transform:uppercase;}
.sidebar-logo-text span{color:var(--orange);}
.sidebar-logo-sub{font-family:var(--mono);font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-top:3px;}
.sidebar-vendor{padding:16px 22px;border-bottom:1px solid var(--border-sub);}
.vendor-initials{width:40px;height:40px;background:linear-gradient(135deg,#080818,#181840);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--blue);margin-bottom:8px;border:1px solid var(--blue-border);font-family:var(--mono);}
.vendor-name{font-weight:700;font-size:13px;color:var(--text);margin-bottom:2px;letter-spacing:-0.02em;}
.vendor-tier{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;padding:3px 10px;border-radius:var(--r-full);margin-top:2px;}
.tier-free{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid var(--border);}
.tier-standard{background:var(--orange-dim);color:var(--orange);border:1px solid var(--orange-border);}
.tier-premium{background:rgba(251,191,36,0.1);color:var(--gold);border:1px solid rgba(251,191,36,0.2);}
.sidebar-section{padding:18px 22px 6px;font-size:9px;color:var(--muted);font-weight:700;letter-spacing:0.15em;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 18px;margin:1px 8px;border-radius:var(--r-md);cursor:pointer;font-size:13px;font-weight:500;color:var(--sub);transition:all 0.18s;border-left:2px solid transparent;background:none;width:calc(100% - 16px);text-align:left;}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text);border-left-color:var(--muted);}
.nav-item.active{background:linear-gradient(135deg,rgba(255,107,53,0.1),rgba(255,107,53,0.04));color:var(--text);border-left-color:var(--orange);font-weight:600;}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:0.65;}
.nav-item.active svg{opacity:1;}
.sidebar-bottom{margin-top:auto;padding:18px;border-top:1px solid var(--border-sub);}
.sidebar-plan-badge{background:linear-gradient(135deg,rgba(255,107,53,0.15),rgba(255,107,53,0.06));border:1px solid rgba(255,107,53,0.25);border-radius:8px;padding:6px 10px;font-size:10px;font-weight:700;text-align:center;letter-spacing:0.08em;text-transform:uppercase;color:var(--orange);margin-bottom:10px;}
.btn-signout{width:100%;background:rgba(255,255,255,0.04);color:var(--sub);border:1px solid var(--border);border-radius:var(--r-md);padding:8px;font-size:12px;font-weight:600;transition:all 0.18s;}
.btn-signout:hover{color:var(--text);border-color:var(--muted);}

/* ── MAIN ── */
.main{flex:1;overflow-x:hidden;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:50;background:rgba(8,8,16,0.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 36px;height:60px;}
.topbar-title{font-size:16px;font-weight:700;letter-spacing:-0.03em;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.content{padding:32px 36px;animation:fadeUp 0.3s ease;flex:1;}

/* ── BUTTONS ── */
.btn{border-radius:var(--r-md);font-weight:700;transition:all 0.18s;font-family:var(--font);}
.btn-primary{background:var(--orange);color:#fff;padding:10px 22px;font-size:13px;}
.btn-primary:hover{opacity:0.9;box-shadow:0 4px 20px rgba(255,107,53,0.3);}
.btn-ghost{background:rgba(255,255,255,0.04);color:var(--sub);border:1px solid var(--border);padding:8px 16px;font-size:12px;}
.btn-ghost:hover{color:var(--text);border-color:var(--muted);}
.btn-sm{padding:5px 12px;font-size:11px;}
.btn-danger{background:rgba(248,113,113,0.1);color:var(--red);border:1px solid rgba(248,113,113,0.2);padding:5px 12px;font-size:11px;}
.btn-danger:hover{background:rgba(248,113,113,0.2);}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border-sub);}
.card-title{font-size:15px;font-weight:700;letter-spacing:-0.02em;}
.card-sub{font-size:12px;color:var(--sub);margin-top:2px;}

/* ── STAT CARDS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;}
.stat-num{font-family:var(--mono);font-size:28px;font-weight:500;color:var(--orange);letter-spacing:-0.02em;line-height:1;margin-bottom:4px;}
.stat-label{font-family:var(--mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}

/* ── FORM ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.form-field{margin-bottom:16px;}
.form-msg{font-size:12px;margin-top:8px;min-height:18px;}

/* ── SERVICE CHIPS ── */
.services-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:16px;}
.service-chip{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;transition:all 0.18s;display:flex;align-items:center;gap:10px;}
.service-chip:hover{border-color:rgba(255,107,53,0.3);}
.service-chip.active{background:var(--orange-dim);border-color:var(--orange-border);}
.service-chip-name{font-size:13px;font-weight:600;color:var(--text);}
.service-chip.active .service-chip-name{color:var(--orange);}
.service-chip-desc{font-size:11px;color:var(--muted);margin-top:1px;}

/* ── PROPOSAL ROW ── */
.proposal-row{display:flex;align-items:flex-start;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border-sub);transition:background 0.15s;}
.proposal-row:last-child{border-bottom:none;}
.proposal-row:hover{background:rgba(255,255,255,0.02);}
.proposal-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.proposal-body{flex:1;min-width:0;}
.proposal-title{font-weight:600;font-size:13px;color:var(--text);margin-bottom:3px;}
.proposal-meta{font-size:11px;color:var(--muted);}
.proposal-status{font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:3px 9px;border-radius:var(--r-full);flex-shrink:0;}

/* ── PHOTO GRID ── */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.photo-thumb{aspect-ratio:1;border-radius:var(--r-md);overflow:hidden;position:relative;background:var(--surface);border:1px solid var(--border);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-thumb-remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.75);color:#fff;border:none;border-radius:6px;width:22px;height:22px;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity 0.15s;}
.photo-thumb:hover .photo-thumb-remove{opacity:1;}

/* ── PLAN CARDS ── */
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px;}
.plan-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;position:relative;}
.plan-card.current{border-color:rgba(255,107,53,0.4);}
.plan-card-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:3px 12px;border-radius:var(--r-full);white-space:nowrap;}
.plan-name{font-weight:800;font-size:18px;letter-spacing:-0.02em;margin-bottom:4px;}
.plan-price{font-family:var(--mono);font-size:30px;font-weight:500;color:var(--orange);line-height:1;margin-bottom:16px;}
.plan-price span{font-size:13px;color:var(--muted);}
.plan-perks{display:flex;flex-direction:column;gap:7px;margin-bottom:20px;}
.plan-perk{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:7px;}
.plan-perk::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;}

/* ── SPINNER / EMPTY ── */
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin 0.8s linear infinite;margin:40px auto;display:block;}
.empty-state{text-align:center;padding:48px 20px;color:var(--sub);}
.empty-title{font-weight:700;font-size:15px;color:var(--text);margin-bottom:6px;}

/* ── AUTH GATE ── */
#authGate{display:none;position:fixed;inset:0;background:var(--bg);z-index:9999;align-items:center;justify-content:center;padding:24px;}
.auth-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 32px 80px rgba(0,0,0,0.5);}
.auth-logo{font-weight:900;font-size:22px;letter-spacing:-0.05em;text-transform:uppercase;text-align:center;margin-bottom:6px;}
.auth-logo span{color:var(--orange);}
.auth-sub{color:var(--sub);font-size:13px;text-align:center;margin-bottom:28px;}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--surface);border-radius:10px;padding:4px;margin-bottom:20px;}
.auth-tab{background:none;color:var(--sub);border:none;padding:8px;border-radius:7px;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s;}
.auth-tab.active{background:var(--card);color:var(--text);font-weight:600;}
.auth-field{margin-bottom:14px;}
.auth-err{color:var(--red);font-size:12px;min-height:18px;margin-bottom:8px;}
.auth-btn{width:100%;background:var(--orange);color:#fff;border:none;border-radius:9px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);transition:opacity 0.18s;}
.auth-btn:hover{opacity:0.9;}
.auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--sub);}
.auth-switch-btn{background:none;border:none;color:var(--orange);font-size:13px;font-weight:600;cursor:pointer;margin-left:4px;}

/* ── MOBILE BOTTOM NAV ── */
.mobile-bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:200;padding-bottom:env(safe-area-inset-bottom);}
.mobile-bottom-nav-inner{display:flex;align-items:stretch;height:58px;padding:0 8px;}
.mobile-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--sub);font-size:10px;font-weight:500;transition:color 0.15s;padding:4px 2px;}
.mobile-nav-btn.active{color:var(--orange);}
.mobile-nav-btn svg{width:20px;height:20px;flex-shrink:0;}

/* ── RESPONSIVE ── */
@media(max-width:860px){
  :root{--sidebar-w:0px;}
  .sidebar{display:none;}
  .content{padding:20px;padding-bottom:80px;}
  .topbar{padding:0 20px;}
  .form-grid{grid-template-columns:1fr;}
  .mobile-bottom-nav{display:block;}
}
@media(max-width:600px){
  .stats-grid{grid-template-columns:1fr 1fr;}
  .plan-grid{grid-template-columns:1fr;}
  .photo-grid{grid-template-columns:repeat(3,1fr);}
}

/* ── ADA COMPLIANCE ── */
.skip-link{position:absolute;top:-100px;left:8px;background:#FF6B35;color:#fff;padding:8px 16px;border-radius:0 0 8px 8px;font-weight:700;font-size:14px;z-index:99999;text-decoration:none;transition:top 0.2s;}
.skip-link:focus{top:0;}
*:focus-visible{outline:2px solid #FF6B35;outline-offset:3px;border-radius:4px;}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}}

/* ── MOBILE MORE SHEET ── */
.pmn-more-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:399;}
.pmn-more-overlay.open{display:block;}
.pmn-more-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);border-radius:20px 20px 0 0;z-index:400;padding:12px 16px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(100%);transition:transform 0.25s ease;}
.pmn-more-sheet.open{transform:translateY(0);}
.pmn-more-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
.pmn-more-item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:none;background:none;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;border-radius:12px;font-family:'DM Sans',sans-serif;text-decoration:none;transition:background 0.15s;}
.pmn-more-item:hover,.pmn-more-item:active{background:rgba(255,255,255,0.06);}
.pmn-more-item svg{width:20px;height:20px;flex-shrink:0;color:var(--sub);}
.pmn-more-item.danger{color:#f87171;}
.pmn-more-item.danger svg{color:#f87171;}
.pmn-more-divider{height:1px;background:var(--border);margin:6px 0;}
</style>
</head>
<body>

<!-- AUTH GATE -->
<div id="authGate" style="display:flex">
  <div class="auth-box">
    <div class="auth-logo">CBUS<span>EVENTS</span></div>
    <div class="auth-sub">Vendor Portal</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabSignin" onclick="switchTab('signin')">Sign In</button>
      <button class="auth-tab" id="tabSignup" onclick="switchTab('signup')">Create Account</button>
    </div>
    <div class="auth-field" id="nameField" style="display:none">
      <label>Business Name</label>
      <input id="authName" placeholder="Your business name">
    </div>
    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="you@email.com" onkeydown="if(event.key==='Enter')doAuth()">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="authPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAuth()">
    </div>
    <div class="auth-err" id="authErr"></div>
    <button class="auth-btn" id="authBtn" onclick="doAuth()">Sign In</button>
    <div class="auth-switch">
      <span id="authSwitchText">New vendor?</span>
      <button class="auth-switch-btn" onclick="switchTab(currentTab==='signin'?'signup':'signin')" id="authSwitchBtn">Create a free account</button>
    </div>
    <div style="text-align:center;margin-top:12px">
      <a href="https://cbusevents.com" style="color:var(--muted);font-size:12px">Back to CBUSEVENTS</a>
    </div>
  </div>
</div>

<!-- SIDEBAR -->
<aside class="sidebar" id="portalSidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-text">CBUS<span>EVENTS</span></div>
    <div class="sidebar-logo-sub">Vendor Portal</div>
  </div>
  <div class="sidebar-vendor">
    <div class="vendor-initials" id="sidebarInitials">VD</div>
    <div class="vendor-name" id="sidebarName">Your Business</div>
    <div class="vendor-tier tier-free" id="sidebarTier">Basic</div>
  </div>
  <div class="sidebar-section">Main</div>
  <button class="nav-item active" id="nav-dashboard" onclick="showPage('dashboard')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    Dashboard
  </button>
  <button class="nav-item" id="nav-profile" onclick="showPage('profile')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    My Profile
  </button>
  <button class="nav-item" id="nav-services" onclick="showPage('services')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    Services
  </button>
  <button class="nav-item" id="nav-portfolio" onclick="showPage('portfolio')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    Portfolio
  </button>
  <div class="sidebar-section">Growth</div>
  <button class="nav-item" id="nav-store" onclick="showPage('store')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    My Store
  </button>
  <button class="nav-item" id="nav-payouts" onclick="showPage('payouts')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    Payouts
  </button>
  <button class="nav-item" id="nav-proposals" onclick="showPage('proposals')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Inquiries
    <span id="proposalBadge" style="display:none;margin-left:auto;background:var(--orange);color:#fff;border-radius:var(--r-full);padding:1px 8px;font-size:9px;font-weight:800">0</span>

// ── AUTH ──────────────────────────────────────────────────────
let _initDone=false;

async function init(){
 const params=new URLSearchParams(window.location.search);
 const{data:{session}}=await sb.auth.getSession();
 if(session?.user){currentUser=session.user;await enterPortal();}
 else if(params.get("tab")==="signup"){setTimeout(()=>switchTab("signup"),100);}
 _initDone=true;
 sb.auth.onAuthStateChange(async(event,session)=>{
   if(event==='SIGNED_IN'&&session?.user&&!currentUser&&_initDone){
     currentUser=session.user;await enterPortal();
   } else if(event==='SIGNED_OUT'){
     currentUser=null;exitPortal();
   }
 });
}

function switchTab(tab){
 currentTab=tab;
 document.getElementById('tabSignin').classList.toggle('active',tab==='signin');
 document.getElementById('tabSignup').classList.toggle('active',tab==='signup');
 document.getElementById('nameField').style.display=tab==='signup'?'block':'none';
 document.getElementById('authBtn').textContent=tab==='signin'?'Sign In':'Create Account';
 document.getElementById('authSwitchText').textContent=tab==='signin'?'New vendor?':'Already have an account?';
 document.getElementById('authSwitchBtn').textContent=tab==='signin'?'Create a free account':'Sign in instead';
 document.getElementById('authErr').textContent='';
}

async function doAuth(){
 const email=document.getElementById('authEmail').value.trim();
 const pass=document.getElementById('authPass').value;
 const name=document.getElementById('authName').value.trim();
 const errEl=document.getElementById('authErr');
 const btn=document.getElementById('authBtn');
 if(!email||!pass){errEl.textContent='Email and password required.';return;}
 btn.disabled=true;btn.textContent='Please wait…';errEl.textContent='';
 try{
   if(currentTab==='signin'){
     const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
     if(error){errEl.textContent=error.message;btn.disabled=false;btn.textContent='Sign In';return;}
     currentUser=data.user;
     await enterPortal();
   } else {
     const{data,error}=await sb.auth.signUp({email,password:pass});
     if(error){errEl.textContent=error.message;btn.disabled=false;btn.textContent='Create Account';return;}
     if(!data.session){
       errEl.style.color='#22c55e';
       errEl.textContent=`Check your email — we sent a confirmation link to ${email}.`;
       btn.disabled=false;btn.textContent='Create Account';
       return;
     }
     if(data.user){
       await sb.from('vendors').upsert({user_id:data.user.id,email,business_name:name&&name!==email?name:null,name:name&&name!==email?name:null,subscription_tier:'FREE',subscription_status:'free'},{onConflict:'user_id'});
       await sb.from('user_roles').insert({user_id:data.user.id,role:'vendor'}).select().maybeSingle().catch(()=>{});
       currentUser=data.user;
       await enterPortal();
     }
   }
 }catch(e){
   errEl.textContent='Network error. Check your connection.';
   btn.disabled=false;btn.textContent=currentTab==='signin'?'Sign In':'Create Account';
 }
}

 exitPortal();
}

async function enterPortal(){
 const ADMIN_EMAIL = 'deant90@gmail.com';

 // Admin bypass — skip role check, create synthetic vendor profile
 if(isAdmin){
   vendorProfile = {
     id: 'admin-preview',
     user_id: currentUser.id,
     email: currentUser.email,
     business_name: 'Admin Preview',
     subscription_tier: 'PREMIUM',
     subscription_status: 'active',
     services: [],
     portfolio_photos: [],
   };
   selectedServices = new Set();
   portfolioPhotos = [];
   updatePlanBadge();
   renderPortalSwitcher();
   document.getElementById('authGate').style.display='none';
   document.getElementById('portalSidebar').style.display='';
   document.getElementById('portalMain').style.display='';
   showPage('dashboard');
   return;
 }

 // Check role — support multi-role accounts
 const{data:roleRows}=await sb.from('user_roles').select('role').eq('user_id',currentUser.id);
 const roles=(roleRows||[]).map(r=>r.role);
 window._userRoles=roles;
 if(!roles.includes('vendor')){
   const rolePortals={venue_owner:'cbus-venue-portal.html',planner:'cbus-planner-portal.html',customer:'customer-portal.html'};
   const redirect=Object.entries(rolePortals).find(([r])=>roles.includes(r));
   if(redirect){window.location.href='https://cbusevents.com/'+redirect[1];return;}
   return;
 }

 // Handle return from Stripe — auto-update vendor tier
 const params=new URLSearchParams(window.location.search);
 if(params.get('upgrade')==='success'&&params.get('tier')){
   const newTier=params.get('tier').toUpperCase();
   await sb.from('vendors').update({
     subscription_tier:newTier,
     subscription_status:'active',
   }).eq('user_id',currentUser.id);
   window.history.replaceState({},'',window.location.pathname);
   toast('Plan upgraded to '+newTier.charAt(0)+newTier.slice(1).toLowerCase()+'!');
 }

 // Load vendor profile
 const{data}=await sb.from('vendors').select('*').eq('user_id',currentUser.id).maybeSingle();
 if(!data){
 // Create profile if doesn't exist
 const{data:newVendor}=await sb.from('vendors').insert({user_id:currentUser.id,email:currentUser.email,business_name:null,subscription_tier:'FREE',subscription_status:'free'}).select().single() ?? {data:null};
 vendorProfile=newVendor;
 } else {
 vendorProfile=data;
 }

 // Parse stored data
 selectedServices=new Set(vendorProfile?.services||[]);
 portfolioPhotos=vendorProfile?.portfolio_photos||[];

 // Update nav plan badge
 updatePlanBadge();
 renderPortalSwitcher();

 document.getElementById('authGate').style.display='none';
 renderDashboard();
}

function handleCoverPhoto(e){
 const file=e.target.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=ev=>{
   const img=new Image();
   img.onload=()=>{
     const canvas=document.createElement('canvas');
     const size=Math.min(img.width,img.height);
     canvas.width=400;canvas.height=400;
     const ctx=canvas.getContext('2d');
     const sx=(img.width-size)/2,sy=(img.height-size)/2;
     ctx.drawImage(img,sx,sy,size,size,0,0,400,400);
     const data=canvas.toDataURL('image/jpeg',0.85);
     const prev=document.getElementById('profCoverPreview');
     prev.innerHTML=`<img src="${data}" style="width:100%;height:100%;object-fit:cover">`;
     prev.dataset.imgData=data;
   };
   img.src=ev.target.result;
 };
 reader.readAsDataURL(file);
 e.target.value='';
}

async function saveProfile(){
 const msg=document.getElementById('profMsg');
 msg.style.color='var(--sub)';
 msg.textContent='Saving...';
 try {
   const profCoverUrl=document.getElementById('profCoverUrl')?.value?.trim()||'';
   const profName=document.getElementById('profName').value.trim();
   if(!profName){msg.style.color='var(--red,#ff4444)';msg.textContent='Business name is required';return;}
   
   // Only update fields — never overwrite subscription data
   const updates={
     business_name: profName,
     name: profName,
     email: document.getElementById('profEmail').value.trim()||currentUser.email,
     phone: document.getElementById('profPhone').value.trim()||null,
     website: document.getElementById('profWebsite').value.trim()||null,
     description: document.getElementById('profBio').value.trim()||null,
     instagram: document.getElementById('profInsta').value.trim()||null,
     tiktok: document.getElementById('profTiktok').value.trim()||null,
     facebook: document.getElementById('profFacebook').value.trim()||null,
     twitter: document.getElementById('profTwitter').value.trim()||null,
     years_in_business: document.getElementById('profYears').value?parseInt(document.getElementById('profYears').value):null,
     cover_image_url: (()=>{const p=document.getElementById('profCoverPreview');return p&&p.dataset.imgData?p.dataset.imgData:(vendorProfile?.cover_image_url||null);})(),
     updated_at: new Date().toISOString(),
   };

   // Try UPDATE first (most common case)
   const{data:updated, error:updateErr}=await sb.from('vendors')
     .update(updates)
     .eq('user_id', currentUser.id)
     .select().single();

   if(updateErr){
     // If update failed, try upsert as fallback
     const{data:upserted, error:upsertErr}=await sb.from('vendors')
       .upsert({...updates, user_id:currentUser.id, subscription_tier:'FREE', subscription_status:'free'},{onConflict:'user_id'})
       .select().single();
     if(upsertErr){
       msg.style.color='var(--red,#ff4444)';
       msg.textContent='Save failed: '+upsertErr.message;
       console.error('Upsert error:',upsertErr);
       return;
     }
     if(upserted) vendorProfile=upserted;
   } else {
     if(updated) vendorProfile=updated;
     else Object.assign(vendorProfile||{},updates);
   }

   msg.style.color='var(--green)';
   msg.textContent='✓ Profile saved!';
   setTimeout(()=>msg.textContent='',3000);
   renderDashboard();
 } catch(e){
   msg.style.color='var(--red,#ff4444)';
   msg.textContent='Error: '+e.message;
   console.error('saveProfile exception:',e);
 }
}

async function handlePhotoUpload(event){
 const files=[...event.target.files];
 if(!files.length) return;
 if(!vendorProfile){toast('Profile not loaded — try refreshing','error');return;}

 const progress=document.getElementById('uploadProgress');
 const bar=document.getElementById('uploadBar');
 const status=document.getElementById('uploadStatus');
 progress.style.display='block';

 let uploaded=0;

 for(let i=0;i<files.length;i++){
   const file=files[i];
   status.textContent=`Processing ${i+1} of ${files.length}...`;
   bar.style.width=`${Math.round(((i+0.5)/files.length)*100)}%`;

   try {
     // Compress to reasonable size then store as data URL
     // This works without any storage bucket setup
     const dataUrl = await compressImage(file, 1000, 0.78);
     portfolioPhotos=[...portfolioPhotos, dataUrl];
     uploaded++;
   } catch(e){
     console.error('Photo error:',e);
   }
 }

 bar.style.width='100%';
 status.textContent='Saving...';
 
 await savePortfolio();
 
 setTimeout(()=>{progress.style.display='none';bar.style.width='0%';},1200);
 event.target.value='';

 toast(`${uploaded} photo${uploaded>1?'s':''} added!`);
}

function compressImage(file, maxWidth, quality){
 return new Promise((resolve, reject)=>{
   const reader=new FileReader();
   reader.onload=(e)=>{
     const img=new Image();
     img.onload=()=>{
       try {
         const canvas=document.createElement('canvas');
         let w=img.width, h=img.height;
         if(w>maxWidth){h=Math.round(h*(maxWidth/w));w=maxWidth;}
         canvas.width=w; canvas.height=h;
         canvas.getContext('2d').drawImage(img,0,0,w,h);
         resolve(canvas.toDataURL('image/jpeg', quality));
       } catch(e){ reject(e); }
     };
     img.onerror=reject;
     img.src=e.target.result;
   };
   reader.onerror=reject;
   reader.readAsDataURL(file);
 });
}

function fileToDataUrl(file){
 return new Promise((resolve)=>{
   const reader=new FileReader();
   reader.onload=(e)=>resolve(e.target.result);
   reader.readAsDataURL(file);
 });
}

async function startConversation(recipientId, recipientRole, subject, openingMessage){
  if(!currentUser){ toast('Sign in to send messages','error'); return; }
  const uid = currentUser.id;
  const myRole = 'vendor';

  const {data:asA} = await sb.from('conversations')
    .select('id').eq('participant_a', uid).eq('participant_b', recipientId).neq('status','archived').maybeSingle();
  const {data:asB} = await sb.from('conversations')
    .select('id').eq('participant_a', recipientId).eq('participant_b', uid).neq('status','archived').maybeSingle();

  let convoId = asA?.id || asB?.id;

  if(!convoId){
    const {data:convo, error:convoErr} = await sb.from('conversations').insert({
      participant_a:      uid,
      participant_b:      recipientId,
      participant_a_role: myRole,
      participant_b_role: recipientRole,
      status:             'active',
      last_message_at:    new Date().toISOString(),
    }).select().single();
    if(convoErr){ toast('Could not start conversation','error'); return; }
    convoId = convo.id;
    await sb.from('message_requests').insert({
      conversation_id: convoId,
      recipient_id:    recipientId,
      status:          'pending',
    });
  }

  if(openingMessage){
    await sb.from('messages').insert({
      conversation_id: convoId,
      sender_id:       uid,
      sender_role:     myRole,
      body:            openingMessage,
    });
  }

  showPage('inbox');
  setTimeout(async ()=>{
    await loadInboxConversations(uid);
    openInboxConvo(convoId);
  }, 400);
  toast('Message sent');
}

async function submitMessageModal(recipientId, recipientRole, recipientName){
  const subject = document.getElementById('msgSubject')?.value.trim();

let _inboxTab='messages', _inboxConvos=[], _inboxRequests=[], _activeConvo=null, _inboxChannel=null;

function switchInboxTab(tab){
  _inboxTab=tab;
  document.getElementById('inboxTabMsg').style.background=tab==='messages'?'#FF6B35':'transparent';
  document.getElementById('inboxTabMsg').style.color=tab==='messages'?'#fff':'var(--sub)';
  document.getElementById('inboxTabReq').style.background=tab==='requests'?'#FF6B35':'transparent';
  document.getElementById('inboxTabReq').style.color=tab==='requests'?'#fff':'var(--sub)';
  renderInboxList();
}

async function loadInboxConversations(uid){
  const {data:convos}=await sb.from('conversations').select('*')
    .or('participant_a.eq.'+uid+',participant_b.eq.'+uid)
    .eq('status','active').order('last_message_at',{ascending:false});
  _inboxConvos=convos||[];
  const {data:reqs}=await sb.from('message_requests').select('*,conversations(*)')
    .eq('recipient_id',uid).eq('status','pending');
  _inboxRequests=reqs||[];
  let unread=0;
  for(const c of _inboxConvos){
    const {count}=await sb.from('messages').select('id',{count:'exact',head:true})
      .eq('conversation_id',c.id).neq('sender_id',uid).is('read_at',null);
    unread+=count||0;
  }
  const badge=document.getElementById('inboxUnreadBadge');
  const navBadge=document.getElementById('inboxBadge');
  if(badge){badge.textContent=unread;badge.style.display=unread>0?'inline':'none';}
  if(navBadge){navBadge.textContent=unread;navBadge.style.display=unread>0?'':'none';}
  const mnavBadge=document.getElementById('mnavInboxBadge');
  if(mnavBadge){mnavBadge.textContent=unread;mnavBadge.style.display=unread>0?'':'none';}
  renderInboxList();
}

function renderInboxList(){
  const el=document.getElementById('inboxList'); if(!el)return;
  if(_inboxTab==='messages'){
    if(_inboxConvos.length===0){el.innerHTML='<div style="padding:24px;color:var(--sub);font-size:13px;text-align:center">No active conversations yet.</div>';return;}
    el.innerHTML=_inboxConvos.map(c=>{
      const uid=currentUser?.id;
      const role=c.participant_a===uid?c.participant_b_role:c.participant_a_role;
      const active=_activeConvo?.id===c.id;
      return `<div onclick="openInboxConvo('${c.id}')" style="padding:14px 16px;border-bottom:1px solid var(--border-sub);cursor:pointer;background:${active?'rgba(255,107,53,0.06)':'transparent'};border-left:${active?'2px solid #FF6B35':'2px solid transparent'}">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px">
          <span style="font-weight:700;font-size:13px;text-transform:capitalize">${role}</span>
          <span style="font-size:10px;color:var(--muted);font-family:var(--mono)">${new Date(c.last_message_at).toLocaleDateString()}</span>
        </div>
        <div style="font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--mono)">Active thread</div>
      </div>`;
    }).join('');
  } else {
    if(_inboxRequests.length===0){el.innerHTML='<div style="padding:24px;color:var(--sub);font-size:13px;text-align:center">No pending requests.</div>';return;}
    el.innerHTML=_inboxRequests.map(r=>`
      <div style="padding:16px;border-bottom:1px solid var(--border-sub)">
        <div style="font-weight:700;font-size:13px;margin-bottom:4px;text-transform:capitalize">${r.conversations?.participant_a_role||'Someone'} wants to connect</div>
        <div style="font-size:12px;color:var(--sub);margin-bottom:12px">${new Date(r.created_at).toLocaleDateString()}</div>
        <div style="display:flex;gap:8px">
          <button onclick="acceptInboxRequest('${r.id}','${r.conversation_id}')" style="flex:1;padding:7px 0;border-radius:8px;background:#FF6B35;color:#fff;border:none;font-weight:700;font-size:12px;cursor:pointer;font-family:var(--font)">Accept</button>
          <button onclick="declineInboxRequest('${r.id}','${r.conversation_id}')" style="flex:1;padding:7px 0;border-radius:8px;background:transparent;color:var(--sub);border:1px solid var(--border);font-weight:700;font-size:12px;cursor:pointer;font-family:var(--font)">Decline</button>
        </div>
      </div>`).join('');
  }
}

async function openInboxConvo(convoId){
  const uid=currentUser?.id;
  _activeConvo=_inboxConvos.find(c=>c.id===convoId);
  renderInboxList();
  const {data:msgs}=await sb.from('messages').select('*').eq('conversation_id',convoId).order('created_at',{ascending:true});
  await sb.from('messages').update({read_at:new Date().toISOString()}).eq('conversation_id',convoId).neq('sender_id',uid).is('read_at',null);
  loadInboxConversations(uid);
  const role=_activeConvo.participant_a===uid?_activeConvo.participant_b_role:_activeConvo.participant_a_role;
  const thread=document.getElementById('inboxThread');
  thread.innerHTML=`
    <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;width:100%;flex-shrink:0">
      <div style="width:34px;height:34px;border-radius:50%;background:rgba(255,107,53,0.15);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#FF6B35;flex-shrink:0">${role[0].toUpperCase()}</div>
      <div><div style="font-weight:700;font-size:14px;text-transform:capitalize">${role}</div><div style="font-size:10px;color:var(--sub);font-family:var(--mono);letter-spacing:0.08em;text-transform:uppercase">Active</div></div>
    </div>
    <div id="msgFeed" style="flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;width:100%"></div>
    <div style="padding:12px 20px;border-top:1px solid var(--border);width:100%">
      <div id="attachPreview" style="display:none;margin-bottom:8px;padding:6px 12px;background:var(--card);border-radius:8px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between;align-items:center"></div>
      <div style="display:flex;gap:8px;align-items:flex-end">
        <textarea id="msgInput" placeholder="Type a message... (Enter to send)" rows="2" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendInboxMessage();}" style="flex:1;resize:none;border-radius:10px;padding:10px 14px;font-size:14px;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:var(--font)"></textarea>
        <div style="display:flex;flex-direction:column;gap:6px">
          <button onclick="document.getElementById('inboxFileInput').click()" style="width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--sub);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center">📎</button>
          <button onclick="sendInboxMessage()" style="width:38px;height:38px;border-radius:10px;background:#FF6B35;border:none;color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center">↑</button>
        </div>
        <input type="file" id="inboxFileInput" style="display:none" accept="image/*,.pdf,.doc,.docx" onchange="previewInboxAttachment(event)">
      </div>
    </div>`;
  thread.style.display='flex';
  thread.style.flexDirection='column';
  thread.style.alignItems='unset';
  thread.style.justifyContent='unset';
  renderMsgFeed(msgs||[], uid);
  if(_inboxChannel) sb.removeChannel(_inboxChannel);
  _inboxChannel=sb.channel('inbox-vendor-'+convoId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+convoId},
      async payload=>{
        const feed=document.getElementById('msgFeed');
        if(feed) feed.innerHTML+=renderMsgBubble(payload.new,uid);
        document.getElementById('msgFeedBottom')?.scrollIntoView({behavior:'smooth'});
      }).subscribe();
}

function renderMsgBubble(m, uid){
  const mine=m.sender_id===uid;
  const d=new Date(m.created_at);
  const ts=d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  return `<div style="display:flex;flex-direction:column;align-items:${mine?'flex-end':'flex-start'}">
    <div style="max-width:70%;background:${mine?'#FF6B35':'var(--card)'};color:${mine?'#fff':'var(--text)'};border-radius:${mine?'16px 16px 4px 16px':'16px 16px 16px 4px'};padding:10px 14px;font-size:14px;line-height:1.5">
      ${m.body?`<div>${m.body}</div>`:''}
      ${m.attachment_url&&m.attachment_type==='image'?`<img src="${m.attachment_url}" style="max-width:100%;border-radius:8px;margin-top:${m.body?'8px':'0'}">`:''}
      ${m.attachment_url&&m.attachment_type==='file'?`<a href="${m.attachment_url}" target="_blank" style="color:${mine?'rgba(255,255,255,0.85)':'#FF6B35'};font-size:13px;display:block;margin-top:${m.body?'6px':'0'}">Download attachment</a>`:''}
    </div>
    <div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:var(--mono)">${ts}</div>
  </div>`;
}

function renderMsgFeed(msgs, uid){
  const feed=document.getElementById('msgFeed'); if(!feed)return;
  feed.innerHTML=msgs.map(m=>renderMsgBubble(m,uid)).join('')+'<div id="msgFeedBottom"></div>';
  document.getElementById('msgFeedBottom')?.scrollIntoView();
}

let _inboxAttachment=null;
function previewInboxAttachment(e){
  const file=e.target.files[0]; if(!file)return;
  _inboxAttachment=file;
  const prev=document.getElementById('attachPreview');
  if(prev){prev.style.display='flex';prev.innerHTML=`<span>${file.name}</span><button onclick="clearInboxAttachment()" style="background:none;border:none;color:var(--sub);cursor:pointer;font-size:14px">×</button>`;}
}
function clearInboxAttachment(){_inboxAttachment=null;const p=document.getElementById('attachPreview');if(p)p.style.display='none';}

async function sendInboxMessage(){
  const uid=currentUser?.id;
  const input=document.getElementById('msgInput');
  const body=input?.value.trim();
  if(!body&&!_inboxAttachment)return;
  let attachment_url=null,attachment_type=null;
  if(_inboxAttachment){
    const ext=_inboxAttachment.name.split('.').pop();
    const path='inbox/'+_activeConvo.id+'/'+Date.now()+'.'+ext;
    const {error}=await sb.storage.from('attachments').upload(path,_inboxAttachment,{upsert:true});
    if(!error){const {data:u}=sb.storage.from('attachments').getPublicUrl(path);attachment_url=u.publicUrl;attachment_type=_inboxAttachment.type.startsWith('image/')?'image':'file';}
    clearInboxAttachment();
  }
  await sb.from('messages').insert({conversation_id:_activeConvo.id,sender_id:uid,sender_role:'vendor',body:body||null,attachment_url,attachment_type});
  if(input)input.value='';
  const {data:msgs}=await sb.from('messages').select('*').eq('conversation_id',_activeConvo.id).order('created_at',{ascending:true});
  renderMsgFeed(msgs||[],uid);
}

async function acceptInboxRequest(reqId, convoId){
  await sb.from('message_requests').update({status:'accepted'}).eq('id',reqId);
  await sb.from('conversations').update({status:'active'}).eq('id',convoId);
  switchInboxTab('messages');
  loadInboxConversations(currentUser?.id);
}

async function declineInboxRequest(reqId, convoId){
  await sb.from('message_requests').update({status:'declined'}).eq('id',reqId);
  await sb.from('conversations').update({status:'archived'}).eq('id',convoId);
  loadInboxConversations(currentUser?.id);
}

// ── VENDOR BOOKING CALENDAR ───────────────────────────────────
let _vendorAvailability=[], _vendorBookingRequests=[], _vcMonth=new Date(), _vcSelected=null, _vcPanel='calendar';

async function renderVendorBookingCalendar(){
  const vid=vendorProfile?.id;
  document.getElementById('pageContent').innerHTML=`
  <div style="margin-bottom:24px">
    <div style="font-family:var(--mono);font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:4px">Availability</div>
    <div style="font-size:22px;font-weight:800;letter-spacing:-0.03em;margin-bottom:2px">Booking Calendar</div>
    <div style="font-size:13px;color:var(--sub)">Manage your availability and respond to booking requests.</div>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:20px">
    <button id="vcTabCal" onclick="vcSwitchPanel('calendar')" style="padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:#FF6B35;color:#fff;font-weight:700;font-size:12px;cursor:pointer;font-family:var(--font)">Calendar</button>
    <button id="vcTabReq" onclick="vcSwitchPanel('requests')" style="padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--sub);font-weight:700;font-size:12px;cursor:pointer;font-family:var(--font)">Requests <span id="bookingReqBadgeInner" style="display:none;background:#f87171;color:#fff;border-radius:99px;font-size:10px;font-weight:800;padding:1px 6px;margin-left:4px"></span></button>
  </div>
  <div id="vcMain"></div>`;
  if(!vid){document.getElementById('vcMain').innerHTML='<div style="padding:48px;text-align:center;color:var(--sub);font-size:13px">Complete your profile setup first.</div>';return;}
  await vcLoadData(vid);
  vcRender();
}

async function vcLoadData(vid){
  const [avail,reqs]=await Promise.all([
    sb.from('vendor_availability').select('*').eq('vendor_id',vid),
    sb.from('vendor_booking_requests').select('*').eq('vendor_id',vid).order('created_at',{ascending:false})
  ]);
  _vendorAvailability=avail.data||[];
  _vendorBookingRequests=reqs.data||[];
  const pending=_vendorBookingRequests.filter(r=>r.status==='pending').length;
  const badge=document.getElementById('bookingBadge');
  const inner=document.getElementById('bookingReqBadgeInner');
  if(badge){badge.textContent=pending;badge.style.display=pending>0?'':'none';}
  if(inner){inner.textContent=pending;inner.style.display=pending>0?'inline':'none';}
}

function vcSwitchPanel(p){
  _vcPanel=p;
  document.getElementById('vcTabCal').style.background=p==='calendar'?'#FF6B35':'transparent';
  document.getElementById('vcTabCal').style.color=p==='calendar'?'#fff':'var(--sub)';
  document.getElementById('vcTabReq').style.background=p==='requests'?'#FF6B35':'transparent';
  document.getElementById('vcTabReq').style.color=p==='requests'?'#fff':'var(--sub)';
  vcRender();
}

function vcDateKey(year,mon,day){
  return `${year}-${String(mon+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

function vcRender(){
  const el=document.getElementById('vcMain');if(!el)return;
  if(_vcPanel==='calendar') vcRenderCalendar(el);
  else vcRenderRequests(el);
}

function vcRenderCalendar(el){
  const year=_vcMonth.getFullYear(), mon=_vcMonth.getMonth();
  const firstDay=new Date(year,mon,1).getDay();
  const daysInMonth=new Date(year,mon+1,0).getDate();
  const monthName=_vcMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const today=new Date();
  const availByDate={};
  _vendorAvailability.forEach(a=>{availByDate[a.date]=a;});
  const reqsByDate={};
  _vendorBookingRequests.forEach(r=>{
    if(!r.event_date)return;
    const key=r.event_date;
    if(!reqsByDate[key])reqsByDate[key]=[];
    reqsByDate[key].push(r);
  });

  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);

  function getDayBg(day){
    const k=vcDateKey(year,mon,day);
    const a=availByDate[k];
    if(a?.status==='blocked')return'rgba(248,113,113,0.12)';
    if(a?.status==='tentative')return'rgba(251,191,36,0.1)';
    if(a?.status==='available')return'rgba(52,211,153,0.08)';
    return'transparent';
  }

  const selectedAvail=_vcSelected?availByDate[vcDateKey(year,mon,_vcSelected)]:null;
  const selectedReqs=_vcSelected?(reqsByDate[vcDateKey(year,mon,_vcSelected)]||[]):[];

  el.innerHTML=`
  <div style="display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap">
    ${[{color:'#f87171',l:'Blocked'},{color:'#fbbf24',l:'Tentative'},{color:'#34d399',l:'Available'},{color:'#FF6B35',l:'Booking Request'}].map(x=>`
    <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)">
      <div style="width:8px;height:8px;border-radius:50%;background:${x.color}"></div>${x.l}
    </div>`).join('')}
  </div>
  <div style="background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border-sub)">
      <button onclick="vcNavMonth(-1)" style="background:none;border:none;color:var(--sub);cursor:pointer;font-size:20px;padding:2px 8px">‹</button>
      <div style="font-weight:700;font-size:15px">${monthName}</div>
      <button onclick="vcNavMonth(1)" style="background:none;border:none;color:var(--sub);cursor:pointer;font-size:20px;padding:2px 8px">›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border-sub)">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div style="padding:8px 4px;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)">${d}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr)">
      ${cells.map((day,i)=>{
        if(!day)return`<div style="min-height:80px;border-right:1px solid var(--border-sub);border-bottom:1px solid var(--border-sub)"></div>`;
        const key=vcDateKey(year,mon,day);
        const avail=availByDate[key];
        const reqs=reqsByDate[key]||[];
        const isToday=today.getDate()===day&&today.getMonth()===mon&&today.getFullYear()===year;
        const isSelected=_vcSelected===day;
        const isPast=new Date(year,mon,day)<new Date(today.getFullYear(),today.getMonth(),today.getDate());
        return`<div onclick="vcSelectDay(${day})" style="min-height:80px;padding:6px 4px;border-right:1px solid var(--border-sub);border-bottom:1px solid var(--border-sub);cursor:pointer;background:${isSelected?'rgba(255,107,53,0.08)':getDayBg(day)};opacity:${isPast?0.5:1}">
          <div style="font-family:var(--mono);font-size:11px;font-weight:500;color:${isToday?'#FF6B35':'var(--sub)'};background:${isToday?'rgba(255,107,53,0.1)':'transparent'};border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-bottom:4px">${day}</div>
          ${avail?`<div style="font-size:9px;font-weight:700;color:${avail.status==='blocked'?'#f87171':avail.status==='tentative'?'#fbbf24':'#34d399'};background:rgba(255,255,255,0.04);border-radius:3px;padding:1px 4px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${avail.status}</div>`:''}
          ${reqs.slice(0,1).map(r=>`<div style="font-size:9px;font-weight:600;color:#FF6B35;background:rgba(255,107,53,0.08);border-radius:3px;padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">⬤ ${r.planner_name||'Request'}</div>`).join('')}
          ${reqs.length>1?`<div style="font-size:9px;color:var(--muted)">+${reqs.length-1} more</div>`:''}
        </div>`;
      }).join('')}
    </div>
  </div>
  ${_vcSelected?`
  <div style="background:var(--card);border-radius:14px;border:1px solid var(--border);padding:20px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <div style="font-weight:700;font-size:15px">
        ${_vcMonth.toLocaleDateString('en-US',{month:'long'})} ${_vcSelected}
        ${selectedAvail?`<span style="margin-left:10px;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.1em;padding:3px 8px;border-radius:20px;background:${selectedAvail.status==='blocked'?'rgba(248,113,113,0.15)':selectedAvail.status==='tentative'?'rgba(251,191,36,0.15)':'rgba(52,211,153,0.15)'};color:${selectedAvail.status==='blocked'?'#f87171':selectedAvail.status==='tentative'?'#fbbf24':'#34d399'}">${selectedAvail.status}</span>`:''}
      </div>
      <button onclick="vcOpenAvailModal()" style="padding:7px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-weight:600;font-size:12px;cursor:pointer;font-family:var(--font)">${selectedAvail?'Edit Availability':'Set Availability'}</button>
    </div>
    ${selectedAvail?.note?`<p style="font-size:12px;color:var(--sub);margin-bottom:12px;font-style:italic">Note: ${selectedAvail.note}</p>`:''}
    ${selectedReqs.length===0?`<p style="color:var(--sub);font-size:13px">No booking requests on this date.</p>`
    :selectedReqs.map(r=>`
    <div style="display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--surface);border-radius:10px;border:1px solid var(--border-sub);margin-bottom:10px;flex-wrap:wrap">
      <div style="flex:1;min-width:160px">
        <div style="font-weight:700;font-size:13px;margin-bottom:4px">${r.planner_name||r.planner_email||'Planner'}</div>
        <div style="font-size:11px;color:var(--sub);display:flex;flex-wrap:wrap;gap:8px">
          ${r.event_type?`<span>🎉 ${r.event_type}</span>`:''}
          ${r.guest_count?`<span>👥 ${r.guest_count} guests</span>`:''}
          ${r.location?`<span>📍 ${r.location}</span>`:''}
          ${r.budget_range?`<span>💰 ${r.budget_range}</span>`:''}
        </div>
        ${r.message?`<div style="font-size:12px;color:var(--text);margin-top:8px;line-height:1.5">${r.message}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">
        <span style="font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.1em;padding:3px 8px;border-radius:20px;background:${r.status==='pending'?'rgba(255,107,53,0.12)':r.status==='approved'?'rgba(52,211,153,0.12)':'rgba(248,113,113,0.12)'};color:${r.status==='pending'?'#FF6B35':r.status==='approved'?'#34d399':'#f87171'}">${r.status}</span>
        ${r.status==='pending'?`<button onclick="vcOpenResponseModal('${r.id}')" style="padding:6px 12px;border-radius:8px;background:#FF6B35;color:#fff;border:none;font-weight:700;font-size:11px;cursor:pointer;font-family:var(--font)">Respond</button>`:''}
      </div>
    </div>`).join('')}
  </div>`:''}
  <div id="vcModal"></div>`;
}

function vcNavMonth(dir){
  const y=_vcMonth.getFullYear(),m=_vcMonth.getMonth();
  _vcMonth=new Date(y,m+dir,1);
  _vcSelected=null;
  vcRender();
}

function vcSelectDay(day){
  _vcSelected=_vcSelected===day?null:day;
  vcRender();
}

function vcOpenAvailModal(){
  const year=_vcMonth.getFullYear(),mon=_vcMonth.getMonth();
  const key=vcDateKey(year,mon,_vcSelected);
  const existing=_vendorAvailability.find(a=>a.date===key);
  document.getElementById('vcModal').innerHTML=`
  <div id="vcModalBg" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)vcCloseModal()">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:380px;max-width:90vw">
      <div style="font-weight:800;font-size:17px;margin-bottom:4px">Set Availability</div>
      <div style="font-size:12px;color:var(--sub);margin-bottom:20px;font-family:var(--mono)">${key}</div>
      <div style="margin-bottom:16px">
        <label style="font-size:12px;color:var(--sub);display:block;margin-bottom:8px;font-weight:600">Status</label>
        <div style="display:flex;gap:8px">
          ${[{v:'blocked',l:'Blocked',c:'#f87171'},{v:'tentative',l:'Tentative',c:'#fbbf24'},{v:'available',l:'Available',c:'#34d399'}].map(s=>`
          <button id="vcStatus_${s.v}" onclick="vcSetStatus('${s.v}')" style="flex:1;padding:8px 0;border-radius:8px;border:1px solid ${existing?.status===s.v?s.c:'var(--border)'};background:${existing?.status===s.v?s.c+'22':'transparent'};color:${existing?.status===s.v?s.c:'var(--sub)'};font-weight:700;font-size:12px;cursor:pointer;font-family:var(--font)">${s.l}</button>`).join('')}
        </div>
      </div>
      <div style="margin-bottom:20px">
        <label style="font-size:12px;color:var(--sub);display:block;margin-bottom:6px;font-weight:600">Note (optional)</label>
        <input id="vcAvailNote" value="${existing?.note||''}" placeholder="e.g. Already booked, holding for client..." style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:var(--font)">
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="vcSaveAvailability('${key}','${existing?.id||''}')" style="flex:1;padding:10px 0;border-radius:8px;background:#FF6B35;color:#fff;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font)">Save</button>
        ${existing?`<button onclick="vcClearAvailability('${existing.id}')" style="padding:10px 14px;border-radius:8px;background:transparent;color:#f87171;border:1px solid rgba(248,113,113,0.3);font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font)">Clear</button>`:''}
        <button onclick="vcCloseModal()" style="padding:10px 14px;border-radius:8px;background:transparent;color:var(--sub);border:1px solid var(--border);font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font)">Cancel</button>
      </div>
    </div>
  </div>`;
  window._vcCurrentStatus=existing?.status||'blocked';
  vcHighlightStatus(window._vcCurrentStatus);
}

function vcSetStatus(s){
  window._vcCurrentStatus=s;
  vcHighlightStatus(s);
}

function vcHighlightStatus(s){
  const colors={blocked:'#f87171',tentative:'#fbbf24',available:'#34d399'};
  ['blocked','tentative','available'].forEach(v=>{
    const btn=document.getElementById('vcStatus_'+v);
    if(!btn)return;
    const c=colors[v];
    btn.style.border=`1px solid ${v===s?c:'var(--border)'}`;
    btn.style.background=v===s?c+'22':'transparent';
    btn.style.color=v===s?c:'var(--sub)';
  });
}

async function vcSaveAvailability(key, existingId){
  const note=document.getElementById('vcAvailNote')?.value||'';
  const status=window._vcCurrentStatus||'blocked';
  if(existingId){
    await sb.from('vendor_availability').update({status,note}).eq('id',existingId);
  } else {
    await sb.from('vendor_availability').insert({vendor_id:vendorProfile.id,date:key,status,note});
  }
  vcCloseModal();
  await vcLoadData(vendorProfile.id);
  vcRender();
}

async function vcClearAvailability(id){
  await sb.from('vendor_availability').delete().eq('id',id);
  vcCloseModal();
  await vcLoadData(vendorProfile.id);
  vcRender();
}

function vcOpenResponseModal(reqId){
  const req=_vendorBookingRequests.find(r=>r.id===reqId);
  if(!req)return;
  document.getElementById('vcModal').innerHTML=`
  <div id="vcModalBg" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)vcCloseModal()">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:420px;max-width:90vw">
      <div style="font-weight:800;font-size:17px;margin-bottom:12px">Respond to Request</div>
      <div style="background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:20px">
        <div style="font-weight:700;font-size:13px;margin-bottom:6px">${req.planner_name||req.planner_email||'Planner'}</div>
        <div style="font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:10px;margin-bottom:${req.message?'8px':'0'}">
          <span>📅 ${new Date(req.event_date+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</span>
          ${req.event_type?`<span>🎉 ${req.event_type}</span>`:''}
          ${req.guest_count?`<span>👥 ${req.guest_count} guests</span>`:''}
          ${req.location?`<span>📍 ${req.location}</span>`:''}
          ${req.budget_range?`<span>💰 ${req.budget_range}</span>`:''}
        </div>
        ${req.message?`<div style="font-size:12px;color:var(--text);line-height:1.5">${req.message}</div>`:''}
      </div>
      <div style="margin-bottom:20px">
        <label style="font-size:12px;color:var(--sub);display:block;margin-bottom:6px;font-weight:600">Response note (optional)</label>
        <textarea id="vcResponseNote" placeholder="Add a note to your response..." rows="3" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:var(--font);resize:none"></textarea>
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="vcRespondToRequest('${req.id}','approved')" style="flex:1;padding:10px 0;border-radius:8px;background:#34d399;color:#080810;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font)">✓ Approve</button>
        <button onclick="vcRespondToRequest('${req.id}','declined')" style="flex:1;padding:10px 0;border-radius:8px;background:transparent;color:#f87171;border:1px solid rgba(248,113,113,0.35);font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font)">✕ Decline</button>
        <button onclick="vcCloseModal()" style="padding:10px 14px;border-radius:8px;background:transparent;color:var(--sub);border:1px solid var(--border);font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font)">Cancel</button>
      </div>
    </div>
  </div>`;
}

async function vcRespondToRequest(reqId, status){
  const note=document.getElementById('vcResponseNote')?.value||'';
  await sb.from('vendor_booking_requests').update({status,response_note:note,responded_at:new Date().toISOString()}).eq('id',reqId);
  vcCloseModal();
  await vcLoadData(vendorProfile.id);
  vcRender();
}

function vcCloseModal(){document.getElementById('vcModal').innerHTML='';}

          <span style="font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.1em;padding:2px 8px;border-radius:20px;background:${r.status==='pending'?'rgba(255,107,53,0.12)':r.status==='approved'?'rgba(52,211,153,0.12)':'rgba(248,113,113,0.12)'};color:${r.status==='pending'?'#FF6B35':r.status==='approved'?'#34d399':'#f87171'}">${r.status}</span>
        </div>
        <div style="font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:10px;margin-bottom:${r.message?'8px':'0'}">
          <span>📅 ${new Date(r.event_date+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</span>
          ${r.event_type?`<span>🎉 ${r.event_type}</span>`:''}
          ${r.guest_count?`<span>👥 ${r.guest_count} guests</span>`:''}
          ${r.location?`<span>📍 ${r.location}</span>`:''}
          ${r.budget_range?`<span>💰 ${r.budget_range}</span>`:''}

async function uploadVendorProductImage(file){
  let blob=file;
  try{
    const bitmap=await createImageBitmap(file);
    const canvas=document.createElement('canvas');
    let w=bitmap.width,h=bitmap.height;
    const maxW=1200;
    if(w>maxW){h=Math.round(h*(maxW/w));w=maxW;}
    canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(bitmap,0,0,w,h);
    blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.85));
    bitmap.close();
  }catch(e){console.warn('createImageBitmap failed, using original',e);}
  const userId=vendorProfile?.user_id||'unknown';
  const path=`vendor-products/${userId}/product_${Date.now()}.jpg`;
  const {error}=await sb.storage.from('vendor-products').upload(path,blob,{upsert:true,contentType:'image/jpeg'});
  if(error)throw error;
  const {data:urlData}=sb.storage.from('vendor-products').getPublicUrl(path);
  // Update the hidden input with the final URL
  const hiddenInput=document.getElementById('pImage');
  if(hiddenInput)hiddenInput.value=urlData.publicUrl;
  return urlData.publicUrl;
}

function previewVendorProductImage(input){
  const file=input.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const previewImg=document.getElementById('pImagePreviewImg');
    if(previewImg)previewImg.src=e.target.result;
    const previewWrap=document.getElementById('pImagePreviewWrap');
    if(previewWrap)previewWrap.style.display='';
    const label=document.getElementById('pImageLabel');
    if(label)label.textContent=file.name;
  };
  reader.readAsDataURL(file);
}

async function saveProduct(productId){
 const msg=document.getElementById('productMsg');
 const name=document.getElementById('pName').value.trim();
 const price=parseFloat(document.getElementById('pPrice').value);
 if(!name){msg.style.color='var(--red)';msg.textContent='Product name is required';return;}
 if(isNaN(price)||price<0){msg.style.color='var(--red)';msg.textContent='Valid price is required';return;}
 // Upload product image if file selected
 let imageUrl=document.getElementById('pImage').value.trim();
 const imgFile=document.getElementById('pImageFile')?.files?.[0];
 if(imgFile){
   try{
     const uploaded=await uploadVendorProductImage(imgFile);
     if(uploaded)imageUrl=uploaded;
   }catch(e){msg.style.color='var(--red)';msg.textContent='Image upload failed: '+e.message;return;}
 }
 const inventoryVal=document.getElementById('pInventory').value.trim();
 const payload={
   vendor_id:vendorProfile.id,
   name,price,
   category:document.getElementById('pCategory').value||null,
   product_type:document.getElementById('pType').value,
   description:document.getElementById('pDesc').value.trim()||null,
   images:imageUrl?[imageUrl]:[],
   digital_file_url:document.getElementById('pDigitalUrl').value.trim()||null,
   inventory_count:inventoryVal!==''?parseInt(inventoryVal):null,
   status:document.getElementById('pStatus').value,
   updated_at:new Date().toISOString(),
 };
 msg.style.color='var(--sub)';msg.textContent='Saving...';
 let error;
 if(productId){
   ({error}=await sb.from('vendor_products').update(payload).eq('id',productId));
 } else {
   ({error}=await sb.from('vendor_products').insert({...payload,created_at:new Date().toISOString()}));
 }
 if(error){msg.style.color='var(--red)';msg.textContent='Error: '+error.message;return;}
 closeModal();
 toast(productId?'Product updated!':'Product listed on marketplace!');
 await loadStoreProducts();
}

       <div style="font-family:var(--mono);font-size:13px">${fmtMoney(o.subtotal)}</div>
       <div style="font-family:var(--mono);font-size:13px;color:var(--muted)">-${fmtMoney(o.platformFee)}</div>
       <div style="font-family:var(--mono);font-size:14px;font-weight:500;color:var(--green)">${fmtMoney(o.net)}</div>
     </div>`).join('')}
   </div>`}
 </div>`;
}

// ── HELPERS ───────────────────────────────────────────────────
function fmt(iso){
 if(!iso)return'TBD';
 return new Date(iso).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

function toast(msg,type='success'){
 const el=document.getElementById('toast');
 el.textContent=msg;el.className='toast '+type;el.style.display='block';
 setTimeout(()=>el.style.display='none',3000);
}

function closeModal(){document.getElementById('modalContainer').innerHTML='';}

// ── INIT ──────────────────────────────────────────────────────
init();
