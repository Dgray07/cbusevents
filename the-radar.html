<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Radar — CBUSEVENTS</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<style>
  :root {
    --dark: #080810;
    --surface: #0f0f1a;
    --surface2: #13131f;
    --border: #1e1e2e;
    --orange: #FF6B35;
    --cream: #f5f0e8;
    --muted: #6b6b8a;
    --muted2: #9999b8;
    --blue: #5a9fd4;
    --green: #7ec8a0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  .radar-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .radar-brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .radar-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .radar-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 900;
    color: var(--cream);
    line-height: 1;
  }

  .radar-title span {
    color: var(--orange);
  }

  .powered-by {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .powered-by img {
    height: 14px;
    opacity: 0.7;
  }

  /* SEARCH BAR */
  .search-section {
    padding: 20px 28px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-input-wrap {
    flex: 1;
    min-width: 220px;
    position: relative;
  }

  .search-input-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px 11px 38px;
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input:focus { border-color: var(--orange); }
  .search-input::placeholder { color: var(--muted); }

  .filter-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    cursor: pointer;
  }

  .search-btn {
    background: var(--orange);
    color: var(--dark);
    border: none;
    border-radius: 8px;
    padding: 11px 22px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .search-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* MAIN LAYOUT */
  .radar-body {
    display: grid;
    grid-template-columns: 380px 1fr;
    height: calc(100vh - 130px);
  }

  @media (max-width: 768px) {
    .radar-body { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; }
  }

  /* EVENT LIST PANEL */
  .events-panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .events-panel::-webkit-scrollbar { width: 4px; }
  .events-panel::-webkit-scrollbar-track { background: var(--surface); }
  .events-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .panel-meta {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-count {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--orange);
    font-weight: 500;
  }

  .panel-hint {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  .events-list {
    flex: 1;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* EVENT CARD */
  .event-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--orange);
    border-radius: 8px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.2s;
    animation: fadeUp 0.35s ease both;
  }

  .event-card:hover, .event-card.active {
    border-color: var(--orange);
    background: #1a1a2e;
  }

  .event-card.locked {
    position: relative;
    border-left-color: var(--muted);
    opacity: 0.6;
    pointer-events: none;
  }

  .event-card-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .tag {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 2px 7px;
    border-radius: 3px;
  }

  .tag-date { background: rgba(255,107,53,0.15); color: var(--orange); }
  .tag-cat { background: var(--border); color: var(--muted2); }
  .tag-source { background: var(--border); color: var(--blue); }

  .event-name {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--cream);
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .event-venue {
    font-size: 12px;
    color: var(--muted2);
    margin-bottom: 3px;
  }

  .event-price {
    font-size: 12px;
    color: var(--green);
    font-family: 'DM Mono', monospace;
  }

  /* LOCK GATE */
  .lock-gate {
    background: linear-gradient(to bottom, transparent, var(--dark) 60%);
    position: absolute;
    inset: 0;
    border-radius: 8px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 20px;
    pointer-events: all;
    cursor: default;
  }

  .gate-overlay {
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 24px;
    text-align: center;
    max-width: 280px;
  }

  .gate-overlay h3 {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    color: var(--cream);
    margin-bottom: 6px;
  }

  .gate-overlay p {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .gate-btn {
    background: var(--orange);
    color: var(--dark);
    border: none;
    border-radius: 6px;
    padding: 9px 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    width: 100%;
  }

  /* MAP */
  #map {
    width: 100%;
    height: 100%;
  }

  /* EMPTY / LOADING STATES */
  .state-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    gap: 10px;
  }

  .state-icon { font-size: 36px; }

  .state-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    color: var(--cream);
  }

  .state-sub { font-size: 13px; color: var(--muted); line-height: 1.5; }

  /* SPINNER */
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--dark);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* POPUP */
  .mapboxgl-popup-content {
    background: var(--surface) !important;
    border: 1px solid var(--border) !important;
    border-left: 3px solid var(--orange) !important;
    color: var(--cream) !important;
    padding: 12px 16px !important;
    border-radius: 8px !important;
    font-family: 'DM Sans', sans-serif !important;
    max-width: 240px !important;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
  }

  .mapboxgl-popup-close-button {
    color: var(--muted) !important;
    font-size: 16px !important;
  }

  .popup-name {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--cream);
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .popup-date { font-size: 11px; color: var(--orange); font-family: 'DM Mono', monospace; margin-bottom: 3px; }
  .popup-venue { font-size: 11px; color: var(--muted2); margin-bottom: 6px; }

  .popup-link {
    font-size: 11px;
    color: var(--orange);
    text-decoration: none;
    font-family: 'DM Mono', monospace;
  }

  /* ERROR */
  .error-bar {
    background: #2a1010;
    border: 1px solid #5a2020;
    border-radius: 6px;
    padding: 10px 14px;
    margin: 12px;
    font-size: 13px;
    color: #e87c7c;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="radar-header">
  <div class="radar-brand">
    <span class="radar-eyebrow">CBUSEVENTS — Attendee Portal</span>
    <h1 class="radar-title">The <span>Radar</span></h1>
  </div>
  <div class="powered-by">
    Powered by

      <path d="M209.75 26.34v39.82c0 16.38-9.66 23.07-21.08 23.07-10.75 0-17.22-7.19-19.66-13.07l8.48-3.53c1.51 3.61 5.21 7.87 11.17 7.87 7.31 0 11.84-4.51 11.84-13v-3.19h-.34c-2.18 2.69-6.38 5.04-11.68 5.04-11.09 0-21.25-9.66-21.25-22.09 0-12.52 10.16-22.26 21.25-22.26 5.29 0 9.49 2.35 11.68 4.96h.34v-3.61h9.25zm-8.56 20.92c0-7.81-5.21-13.52-11.84-13.52-6.72 0-12.35 5.71-12.35 13.52 0 7.73 5.63 13.36 12.35 13.36 6.63 0 11.84-5.63 11.84-13.36z" fill="#fff"/>

<!-- SEARCH BAR -->
<div class="search-section">
  <div class="search-input-wrap">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" class="search-input" id="searchInput" placeholder="Search Columbus events, venues, artists..." />
  </div>
  <select class="filter-select" id="categoryFilter">
    <option value="all">All Events</option>
    <option value="music">Music & Live Shows</option>
    <option value="food">Food & Drink</option>
    <option value="arts">Arts & Culture</option>
    <option value="markets">Markets & Festivals</option>
    <option value="nightlife">Nightlife</option>
    <option value="community">Community</option>
    <option value="sports">Sports & Fitness</option>
  </select>
  <select class="filter-select" id="dateFilter">
    <option value="this weekend">This Weekend</option>
    <option value="this week" selected>This Week</option>
    <option value="next 2 weeks">Next 2 Weeks</option>
    <option value="this month">This Month</option>
  </select>
  <button class="search-btn" id="searchBtn" onclick="runSearch()">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    Search
  </button>
</div>

<!-- BODY -->
<div class="radar-body">

  <!-- LEFT: EVENTS PANEL -->
  <div class="events-panel" id="eventsPanel">
    <div class="state-center" id="emptyState">
      <div class="state-icon">📡</div>
      <div class="state-title">The Radar is ready</div>
      <div class="state-sub">Search for Columbus events above.<br>Results appear here and drop as pins on the map.</div>
    </div>
  </div>

  <!-- RIGHT: MAP -->
  <div id="map"></div>

</div>

<script>
// ============================================================
// CONFIG - Replace with your actual values
// ============================================================
const SUPABASE_URL = 'https://toblgvatvsjljbqogzsv.supabase.co';
const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/radar-search`;
const MAPBOX_TOKEN = 'pk.eyJ1IjoiY2J1c2V2ZW50cyIsImEiOiJjbW1oNWJhaDYwYnVrMnJxN3hxdGJlZmhkIn0.RtF51b0qghUlJAjHgNRdFQ';
const FREE_PREVIEW_COUNT = 3;

// Simulate auth state - replace with your actual Supabase auth check
const isLoggedIn = () => {
  return !!localStorage.getItem('sb-toblgvatvsjljbqogzsv-auth-token');
};

// ============================================================
// MAP INIT
// ============================================================
mapboxgl.accessToken = MAPBOX_TOKEN;

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/dark-v11',
  center: [-82.9988, 39.9612], // Columbus, OH
  zoom: 12,
});

map.addControl(new mapboxgl.NavigationControl(), 'top-right');

const markers = [];

function clearMarkers() {
  markers.forEach(m => m.remove());
  markers.length = 0;
}

function addMarker(event, index, locked) {
  if (!event.coords) return;

  const el = document.createElement('div');
  el.style.cssText = `
    width: 28px; height: 28px;
    background: ${locked ? '#6b6b8a' : '#FF6B35'};
    border: 2px solid ${locked ? '#9999b8' : '#fff'};
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 11px; font-weight: 700;
    color: ${locked ? '#1e1e2e' : '#080810'};
    cursor: ${locked ? 'default' : 'pointer'};
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: transform 0.15s;
  `;
  el.textContent = index + 1;

  if (!locked) {
    el.addEventListener('mouseenter', () => el.style.transform = 'scale(1.15)');
    el.addEventListener('mouseleave', () => el.style.transform = 'scale(1)');
  }

  const popup = new mapboxgl.Popup({ offset: 16, closeButton: true })
    .setHTML(`
      <div class="popup-name">${event.name}</div>
      ${event.date ? `<div class="popup-date">${event.date}</div>` : ''}
      ${event.venue ? `<div class="popup-venue">📍 ${event.venue}</div>` : ''}
      ${locked 
        ? `<div style="font-size:11px;color:#6b6b8a;font-family:'DM Mono',monospace;">Sign in to view details</div>`
        : (event.url ? `<a href="${event.url}" target="_blank" class="popup-link">View event →</a>` : '')
      }
    `);

  const marker = new mapboxgl.Marker(el)
    .setLngLat([event.coords.lng, event.coords.lat])
    .setPopup(popup)
    .addTo(map);

  markers.push(marker);
}

// ============================================================
// SEARCH
// ============================================================
let currentEvents = [];

async function runSearch() {
  const query = document.getElementById('searchInput').value.trim();
  const category = document.getElementById('categoryFilter').value;
  const dateRange = document.getElementById('dateFilter').value;
  const btn = document.getElementById('searchBtn');
  const panel = document.getElementById('eventsPanel');

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Scanning...';
  clearMarkers();

  panel.innerHTML = `
    <div class="state-center">
      <div class="state-icon" style="animation: pulse 1.5s ease infinite">📡</div>
      <div class="state-title">Scanning Columbus...</div>
      <div class="state-sub">Searching local sources, venues,<br>and event pages across the city.</div>
    </div>
    <style>@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }</style>
  `;

  try {
    const res = await fetch(EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, category, dateRange }),
    });

    const data = await res.json();

    if (!res.ok) throw new Error(data.error || 'Search failed');

    currentEvents = data.events || [];
    renderResults(currentEvents);

  } catch (err) {
    panel.innerHTML = `
      <div class="error-bar">⚠️ ${err.message}</div>
      <div class="state-center">
        <div class="state-sub">Try adjusting your search or check back shortly.</div>
      </div>
    `;
  } finally {
    btn.disabled = false;
    btn.innerHTML = `
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      Search
    `;
  }
}

function renderResults(events) {
  const panel = document.getElementById('eventsPanel');
  const loggedIn = isLoggedIn();

  if (!events.length) {
    panel.innerHTML = `
      <div class="state-center">
        <div class="state-icon">🔍</div>
        <div class="state-title">No events found</div>
        <div class="state-sub">Try broader search terms or a different date range.</div>
      </div>
    `;
    return;
  }

  const visibleCount = loggedIn ? events.length : FREE_PREVIEW_COUNT;
  const lockedCount = loggedIn ? 0 : Math.max(0, events.length - FREE_PREVIEW_COUNT);

  let html = `
    <div class="panel-meta">
      <span class="panel-count">${events.length} events found</span>
      <span class="panel-hint">${loggedIn ? 'All results' : `${FREE_PREVIEW_COUNT} of ${events.length} shown`}</span>
    </div>
    <div class="events-list">
  `;

  events.forEach((event, i) => {
    const locked = !loggedIn && i >= FREE_PREVIEW_COUNT;
    html += renderCard(event, i, locked);

    // Add pins for events with coords
    addMarker(event, i, locked);
  });

  // Gate overlay after locked cards
  if (lockedCount > 0) {
    html += `
      <div style="position:relative; padding: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; border-left: 3px solid var(--muted);">
        <div style="filter: blur(4px); pointer-events: none; opacity: 0.4;">
          <div style="height: 14px; background: var(--border); border-radius: 3px; margin-bottom: 8px; width: 60%;"></div>
          <div style="height: 10px; background: var(--border); border-radius: 3px; margin-bottom: 6px; width: 80%;"></div>
          <div style="height: 10px; background: var(--border); border-radius: 3px; width: 50%;"></div>
        </div>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,8,16,0.85); border-radius: 8px;">
          <div style="text-align: center; padding: 16px;">
            <div style="font-family: 'Playfair Display', serif; font-size: 15px; color: var(--cream); margin-bottom: 6px;">
              ${lockedCount} more event${lockedCount > 1 ? 's' : ''} nearby
            </div>
            <div style="font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.5;">
              Create a free account to unlock<br>all results and save events.
            </div>
            <button onclick="window.location.href='/signup.html'" style="background: var(--orange); color: var(--dark); border: none; border-radius: 6px; padding: 9px 20px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; width: 100%; margin-bottom: 6px;">
              Create Free Account
            </button>
            <button onclick="window.location.href='/login.html'" style="background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 7px 20px; font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; width: 100%;">
              Sign In
            </button>
          </div>
        </div>
      </div>
    `;
  }

  html += `</div>`;
  panel.innerHTML = html;

  // Fit map to visible markers
  if (markers.length > 0) {
    const bounds = new mapboxgl.LngLatBounds();
    events.forEach(e => {
      if (e.coords) bounds.extend([e.coords.lng, e.coords.lat]);
    });
    if (!bounds.isEmpty()) {
      map.fitBounds(bounds, { padding: 60, maxZoom: 14 });
    }
  }

  // Card click = open popup on map
  document.querySelectorAll('.event-card:not(.locked)').forEach((card, i) => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.event-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      if (markers[i] && events[i]?.coords) {
        map.flyTo({ center: [events[i].coords.lng, events[i].coords.lat], zoom: 14, duration: 800 });
        markers[i].togglePopup();
      }
    });
  });
}

function renderCard(event, index, locked) {
  return `
    <div class="event-card ${locked ? 'locked' : ''}" data-index="${index}" style="animation-delay: ${index * 50}ms">
      <div class="event-card-tags">
        ${event.date ? `<span class="tag tag-date">${event.date}</span>` : ''}
        ${event.category ? `<span class="tag tag-cat">${event.category}</span>` : ''}
        ${event.source ? `<span class="tag tag-source">${event.source}</span>` : ''}
      </div>
      <div class="event-name">${event.name}</div>
      ${event.venue ? `<div class="event-venue">📍 ${event.venue}</div>` : ''}
      ${event.price ? `<div class="event-price">${event.price}</div>` : ''}
    </div>
  `;
}

// Enter key to search
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') runSearch();
});
</script>
</body>
</html>
