<!DOCTYPE html>
<html lang="en" data-default="dark">
<head>
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CBUSEVENTS — Organizer Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
:root{
  --bg:#050508;
  --surface:#0f0f1c;
  --card:#1c1c30;
  --card-hover:#222238;
  --border:rgba(255,255,255,0.09);
  --border-mid:rgba(255,255,255,0.15);
  --text:#f4f4ff;
  --sub:#8888b0;
  --muted:#44445a;
  --orange:#FF6B35;
  --orange-dim:rgba(255,107,53,0.12);
  --orange-glow:rgba(255,107,53,0.28);
  --green:#30d693;
  --red:#f47171;
  --blue:#7c8cf8;
  --gold:#f5bc30;
  --font:'DM Sans',sans-serif;
  --mono:'DM Mono',monospace;
  --shadow-sm:0 4px 20px rgba(0,0,0,0.8),0 0 0 1px rgba(255,255,255,0.08);
  --shadow-md:0 8px 32px rgba(0,0,0,0.85),0 0 0 1px rgba(255,255,255,0.1);
  --shadow-lg:0 20px 60px rgba(0,0,0,0.9),0 0 0 1px rgba(255,255,255,0.11);
  --shadow-orange:0 4px 20px rgba(255,107,53,0.4);
  --radius-sm:10px;
  --radius-md:14px;
  --radius-lg:18px;
  --radius-xl:24px;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;font-family:var(--font);border:none;}
input,textarea,select{font-family:var(--font);}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* ── NAV ──────────────────────────────────────────────────── */
nav{
  position:sticky;top:0;z-index:200;
  background:rgba(20,20,36,0.96);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;height:58px;
}
.nav-logo{font-weight:800;font-size:17px;cursor:pointer;letter-spacing:-0.04em;text-transform:uppercase;}
.nav-logo span{color:var(--orange);}
.nav-logo-sub{font-size:9px;color:var(--muted);font-weight:500;margin-left:5px;letter-spacing:0.08em;text-transform:uppercase;vertical-align:middle;}
.nav-links{display:flex;align-items:center;gap:2px;}
.nav-btn{
  background:none;border:none;color:var(--sub);
  font-size:13px;padding:6px 13px;border-radius:8px;
  font-weight:500;transition:all 0.14s;white-space:nowrap;
}
.nav-btn:hover{background:rgba(255,255,255,0.05);color:var(--text);}
.nav-btn.active{background:rgba(255,107,53,0.1);color:var(--orange);font-weight:600;}
.nav-right{display:flex;align-items:center;gap:8px;}

/* More button */
.nav-more-btn{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,0.05);border:1px solid var(--border);
  color:var(--sub);font-size:12px;padding:5px 12px;
  border-radius:8px;font-weight:500;transition:all 0.14s;
}
.nav-more-btn:hover{color:var(--text);border-color:var(--border-mid);}

/* More dropdown */
.nav-more-drop{
  position:absolute;top:calc(100% + 8px);right:0;
  background:var(--card);
  border:1px solid var(--border-mid);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-lg);
  min-width:200px;overflow:hidden;
  animation:fadeIn 0.15s ease;
  z-index:300;
}
.nav-more-item{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:11px 16px;
  background:none;color:var(--text);
  font-size:13px;font-weight:500;
  transition:background 0.12s;text-align:left;
  font-family:var(--font);
}
.nav-more-item:hover{background:rgba(255,255,255,0.05);}
.nav-more-item.active{color:var(--orange);}
.nav-more-divider{height:1px;background:var(--border);margin:4px 0;}
.nav-more-wrap{position:relative;}

/* User chip */
.nav-user-chip{
  display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:99px;padding:4px 12px 4px 6px;cursor:pointer;
  transition:all 0.14s;
}
.nav-user-chip:hover{border-color:var(--border-mid);}
.nav-avatar{
  width:26px;height:26px;border-radius:50%;
  background:var(--orange-dim);border:1px solid var(--orange-glow);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--orange);flex-shrink:0;
}
.nav-user-name{font-size:12px;font-weight:500;color:var(--text);}

/* ── LAYOUT ───────────────────────────────────────────────── */
.page{padding:32px 40px;animation:fadeUp 0.25s ease;max-width:1040px;margin:0 auto;}

/* ── INNER CARD SURFACE (third layer) ─────────────────────── */
.card-inner-surface{
  background:#242440;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.5);
}

/* ── SURFACE CARDS ────────────────────────────────────────── */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
  margin-bottom:14px;
}
.card-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:15px 20px;border-bottom:1px solid var(--border);
}
.card-title{font-size:14px;font-weight:700;letter-spacing:-0.01em;}
.card-body{padding:20px;}

/* ── STAT CARDS ───────────────────────────────────────────── */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.stat-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);
  padding:18px 20px;
  transition:box-shadow 0.2s,transform 0.2s;
}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.stat-num{font-size:28px;font-weight:800;line-height:1;margin-bottom:4px;letter-spacing:-0.02em;}
.stat-label{font-size:12px;color:var(--sub);font-weight:500;}

/* ── VENUE GRID ───────────────────────────────────────────── */
.venue-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.venue-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
  overflow:hidden;cursor:pointer;
  transition:box-shadow 0.2s,transform 0.2s;
}
.venue-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.venue-card-img{width:100%;height:140px;object-fit:cover;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:32px;}
.venue-card-img img{width:100%;height:100%;object-fit:cover;}
.venue-card-body{padding:14px 16px;}
.venue-card-type{font-size:10px;color:var(--orange);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;}
.venue-card-name{font-weight:700;font-size:15px;margin-bottom:5px;letter-spacing:-0.01em;}
.venue-card-desc{color:var(--sub);font-size:12px;line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.venue-card-footer{display:flex;justify-content:space-between;align-items:center;}
.venue-card-loc{font-size:11px;color:var(--muted);}

/* ── INQUIRY / EVENT ITEMS ────────────────────────────────── */
.inquiry-item,.event-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);
  padding:14px 18px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  transition:box-shadow 0.18s;
}
.inquiry-item{cursor:pointer;}
.inquiry-item:hover,.event-item:hover{box-shadow:var(--shadow-md);}
.inq-venue,.event-title{font-weight:600;font-size:14px;margin-bottom:3px;letter-spacing:-0.01em;}
.inq-meta,.event-meta{font-size:12px;color:var(--sub);}

/* ── BADGES ───────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;border-radius:99px;padding:3px 9px;font-size:10px;font-weight:700;letter-spacing:0.04em;}
.badge-green{background:rgba(48,214,147,0.1);color:var(--green);border:1px solid rgba(48,214,147,0.2);}
.badge-orange{background:var(--orange-dim);color:var(--orange);border:1px solid var(--orange-glow);}
.badge-blue{background:rgba(124,140,248,0.1);color:var(--blue);border:1px solid rgba(124,140,248,0.2);}
.badge-muted{background:rgba(255,255,255,0.04);color:var(--sub);border:1px solid var(--border);}
.badge-red{background:rgba(244,113,113,0.1);color:var(--red);border:1px solid rgba(244,113,113,0.2);}

/* ── BUTTONS ──────────────────────────────────────────────── */
.btn{
  border:none;border-radius:var(--radius-sm);
  padding:9px 18px;font-size:13px;font-weight:600;
  cursor:pointer;transition:all 0.16s;font-family:var(--font);
  letter-spacing:0.01em;
}
.btn-primary{
  background:var(--orange);color:#fff;
  box-shadow:0 2px 8px rgba(255,107,53,0.3);
}
.btn-primary:hover{opacity:0.9;box-shadow:var(--shadow-orange);}
.btn-outline{background:transparent;border:1px solid var(--border-mid);color:var(--text);}
.btn-outline:hover{border-color:rgba(255,255,255,0.2);}
.btn-ghost{background:rgba(255,255,255,0.04);color:var(--sub);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);background:rgba(255,255,255,0.07);}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:8px;}
.btn-danger{background:rgba(244,113,113,0.1);color:var(--red);border:1px solid rgba(244,113,113,0.2);}
.btn-danger:hover{background:rgba(244,113,113,0.18);}

/* ── FORM ─────────────────────────────────────────────────── */
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;color:var(--sub);font-weight:600;margin-bottom:6px;letter-spacing:0.04em;text-transform:uppercase;}
.field input,.field select,.field textarea{
  width:100%;background:rgba(255,255,255,0.04);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 13px;color:var(--text);font-size:14px;outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(255,107,53,0.1);
}
.field textarea{min-height:90px;resize:vertical;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* ── SEARCH ───────────────────────────────────────────────── */
.search-bar{display:flex;gap:10px;margin-bottom:20px;}
.search-wrap{flex:1;position:relative;}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);}
.search-input{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);
  padding:11px 14px 11px 40px;color:var(--text);font-size:14px;outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
}
.search-input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,53,0.08);}
.filter-select{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);
  padding:11px 14px;color:var(--text);font-size:13px;outline:none;min-width:140px;
}

/* ── FILTER CHIPS ─────────────────────────────────────────── */
.filter-chips{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.filter-chip{
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:99px;padding:5px 14px;font-size:12px;font-weight:500;
  color:var(--sub);cursor:pointer;transition:all 0.14s;
}
.filter-chip:hover{color:var(--text);border-color:var(--border-mid);}
.filter-chip.active{background:var(--orange-dim);border-color:var(--orange-glow);color:var(--orange);font-weight:600;}

/* ── MODAL ────────────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:500;
  display:flex;align-items:flex-start;justify-content:center;
  padding:40px 20px;overflow-y:auto;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.modal{
  background:var(--card);border:1px solid var(--border-mid);
  border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);
  width:100%;max-width:560px;animation:fadeUp 0.22s ease;
}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:20px 24px;border-bottom:1px solid var(--border);
}
.modal-title{font-size:17px;font-weight:700;letter-spacing:-0.02em;}
.modal-body{padding:24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

/* ── AUTH ─────────────────────────────────────────────────── */
.auth-wrap{min-height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.auth-card{
  background:var(--card);border:1px solid var(--border-mid);
  border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);
  padding:40px;width:100%;max-width:400px;
}
.auth-logo{font-size:20px;font-weight:800;margin-bottom:4px;letter-spacing:-0.04em;text-transform:uppercase;}
.auth-logo span{color:var(--orange);}
.auth-tabs{display:flex;gap:4px;background:var(--surface);border-radius:10px;padding:4px;margin-bottom:24px;}
.auth-tab{flex:1;padding:8px;border-radius:7px;font-size:13px;font-weight:600;color:var(--sub);background:none;border:none;cursor:pointer;transition:all 0.15s;}
.auth-tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow-sm);}

/* ── SECTION HEADERS ──────────────────────────────────────── */
.section-title{font-size:22px;font-weight:800;margin-bottom:5px;letter-spacing:-0.03em;}
.section-sub{color:var(--sub);font-size:13px;margin-bottom:22px;line-height:1.5;}

/* ── EMPTY STATE ──────────────────────────────────────────── */
.empty{text-align:center;padding:52px 20px;color:var(--sub);}
.empty-icon{font-size:36px;margin-bottom:12px;}
.empty h3{font-size:17px;font-weight:700;margin-bottom:6px;color:var(--text);letter-spacing:-0.02em;}

/* ── TOAST ────────────────────────────────────────────────── */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:999;
  background:var(--card);border:1px solid var(--border-mid);
  border-radius:var(--radius-sm);box-shadow:var(--shadow-md);
  padding:12px 18px;font-size:13px;font-weight:500;
  animation:fadeUp 0.25s ease;display:none;
}
.toast.success{border-color:rgba(48,214,147,0.3);color:var(--green);}
.toast.error{border-color:rgba(244,113,113,0.3);color:var(--red);}

/* ── INBOX ────────────────────────────────────────────────── */
.inbox-thread{
  display:flex;align-items:center;gap:12px;
  padding:13px 18px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background 0.12s;
}
.inbox-thread:hover{background:rgba(255,255,255,0.03);}
.inbox-thread.active{background:var(--orange-dim);}
.inbox-avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
}
.inbox-thread-name{font-size:13px;font-weight:600;margin-bottom:2px;}
.inbox-thread-preview{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.inbox-thread-time{font-size:10px;color:var(--muted);margin-left:auto;flex-shrink:0;}

/* ── MOBILE BOTTOM NAV ────────────────────────────────────── */
.portal-mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(13,13,24,0.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--border);z-index:300;padding-bottom:env(safe-area-inset-bottom);}
.portal-mobile-nav-inner{display:flex;align-items:stretch;height:60px;padding:0 4px;}
.pmn-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:9px;font-weight:600;transition:color 0.15s;padding:6px 2px;font-family:var(--font);letter-spacing:0.04em;text-transform:uppercase;}
.pmn-btn.active{color:var(--orange);}
.pmn-btn svg{width:21px;height:21px;flex-shrink:0;}
.pmn-icon{position:relative;display:inline-flex;}
.pmn-badge{position:absolute;top:-3px;right:-6px;background:var(--orange);color:#fff;border-radius:99px;font-size:8px;font-weight:800;padding:1px 4px;min-width:14px;text-align:center;line-height:1.4;}
.pmn-more-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:399;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.pmn-more-overlay.open{display:block;}
.pmn-more-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border:1px solid var(--border-mid);border-radius:20px 20px 0 0;z-index:400;padding:12px 16px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(100%);transition:transform 0.28s cubic-bezier(0.4,0,0.2,1);}
.pmn-more-sheet.open{transform:translateY(0);}
.pmn-more-handle{width:36px;height:4px;background:var(--border-mid);border-radius:2px;margin:0 auto 20px;}
.pmn-more-item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:none;background:none;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;border-radius:12px;font-family:var(--font);transition:background 0.12s;}
.pmn-more-item:hover,.pmn-more-item:active{background:rgba(255,255,255,0.05);}
.pmn-more-item.active{color:var(--orange);}
.pmn-more-item svg{width:20px;height:20px;flex-shrink:0;color:var(--sub);}
.pmn-more-divider{height:1px;background:var(--border);margin:6px 0;}

@media(max-width:700px){
  nav{padding:0 16px;}
  .nav-links{display:none !important;}
  .page{padding:20px 16px;}
  .stat-row{grid-template-columns:1fr 1fr;}
  .venue-grid{grid-template-columns:1fr;}
  .field-row{grid-template-columns:1fr;}
  .portal-mobile-nav{display:block;}
  #app,.page{padding-bottom:80px !important;}
  nav#topNav{display:block !important;}
}
@media(min-width:701px){
  .portal-mobile-nav{display:none !important;}
}

/* ADA */
.skip-link{position:absolute;top:-100px;left:8px;background:var(--orange);color:#fff;padding:8px 16px;border-radius:0 0 8px 8px;font-weight:700;font-size:14px;z-index:99999;text-decoration:none;transition:top 0.2s;}
.skip-link:focus{top:0;}
*:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:4px;}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}}

/* si-pulse animation for smart import */
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
.si-pulse{animation:pulse 1.2s ease infinite;}
</style>
</head>
<body> <nav id="topNav">
  <div class="nav-logo" onclick="currentUser?nav('dashboard'):showAuth('login')">CBUS<span>EVENTS</span><span class="nav-logo-sub">Organizer</span></div>
  <div class="nav-links" id="navLinks" style="display:none">
    <button class="nav-btn" id="nav-dashboard" onclick="nav('dashboard')">Dashboard</button>
    <button class="nav-btn" id="nav-venues" onclick="nav('venues')">Find Venues</button>
    <button class="nav-btn" id="nav-vendors" onclick="nav('vendors')">Find Vendors</button>
    <button class="nav-btn" id="nav-events" onclick="nav('events')">My Events</button>
    <button class="nav-btn" id="nav-collaborate" onclick="nav('collaborate')">Collaborate</button>
    <button class="nav-btn" id="nav-inbox" onclick="nav('inbox')">Inbox<span id="inboxNavBadge" style="display:none;background:#FF6B35;color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 7px;margin-left:5px;vertical-align:middle"></span></button>
    <div class="nav-more-wrap" id="navMoreWrap">

async function loadFollowersList(){

  let follows=[],err=null;
  try{

  const ids=[...new Set(follows.map(f=>f.follower_id).filter(Boolean))];

      sb.from('customer_profiles').select('user_id,display_name,full_name,avatar_url').in('user_id',ids).then(r=>r.data||[]).catch(()=>[])
    ]);
    [...cp,...op].forEach(p=>{ if(p&&p.user_id) profMap[p.user_id]={...(profMap[p.user_id]||{}),...p}; });
  }

  body.innerHTML=`<div style="font-size:12px;color:var(--sub);margin-bottom:12px">${follows.length} ${follows.length===1?'person follows':'people follow'} you</div>`+
    follows.map(f=>{
      const p=profMap[f.follower_id]||{};
      const name=esc(p.display_name||p.full_name||'Columbus member');
      const initial=(name[0]||'?').toUpperCase();
      const av=p.avatar_url
        ? `<img src="${esc(p.avatar_url)}" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0">`
        : `<div style="width:40px;height:40px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0">${initial}</div>`;
      const since=f.created_at?new Date(f.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
      return `<div style="display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--border-sub)">
        ${av}
        <div style="flex:1;min-width:0">

          ${since?`<div style="font-size:11px;color:var(--muted)">Followed ${since}</div>`:''}
        </div>
      </div>`;
    }).join('');
}

async function handleBoostReturn(){
 const p=new URLSearchParams(window.location.search);
 const ref=p.get('client_reference_id')||'';
 if(!ref.startsWith('boost_'))return;
 window.history.replaceState({},'',window.location.pathname);
 const parts=ref.split('_'); // boost_EVENTID_TIER
 const eventId=parts[1];
 const tier=parts[2]; // '7' or '30'
 if(!eventId||!tier)return;
 const days=parseInt(tier);
 const until=new Date();
 until.setDate(until.getDate()+days);
 const{error}=await sb.from('events').update({
 promoted_until:until.toISOString(),
 boost_tier:tier
 }).eq('id',eventId);
 if(!error) toast(` Event boosted for ${days} days!`);
}

async function submitPendingVenueBooking(venueId){
  const date=document.getElementById('pbDate')?.value;
  const status=document.getElementById('pbStatus');
  if(!date){if(status){status.textContent='Please select a date.';status.style.color='var(--red)';}return;}
  const btn=document.querySelector('.card .btn-primary');
  if(btn){btn.textContent='Sending...';btn.disabled=true;}
  const {error}=await sb.from('booking_requests').insert({
    venue_id:venueId,
    organizer_id:currentUser.id,
    organizer_name:currentUser.user_metadata?.full_name||currentUser.email.split('@')[0],
    organizer_email:currentUser.email,
    event_date:date,
    event_type:document.getElementById('pbType')?.value||null,
    guest_count:parseInt(document.getElementById('pbGuests')?.value)||null,
    message:document.getElementById('pbMsg')?.value||null,
  });
  if(error){
    if(status){status.textContent='Error sending. Please try again.';status.style.color='var(--red)';}
    if(btn){btn.textContent='Send Booking Request →';btn.disabled=false;}
    return;
  }
  if(status){status.textContent='Request sent! The venue will respond soon.';status.style.color='var(--green)';}
  setTimeout(()=>nav('dashboard'),2000);
}

async function loadEventVendorTables(eventId){
 const el=document.getElementById('edtVtList');
 if(!el)return;
 let listings=[],err=null;
 try{
   const r=await sb.from('vendor_table_listings')
     .select('*, vendor_table_applications(id,status)')
     .eq('event_id',eventId).eq('organizer_id',currentUser.id)
     .order('created_at',{ascending:false});
   listings=r.data||[];err=r.error;
 }catch(ex){err=ex;}

 if(err){
   const needsMigration=/event_id/.test(err.message||'');
   el.innerHTML=`<div style="font-size:12px;color:var(--muted);padding:12px 0">Could not load vendor table listings.${needsMigration?' Add the <code>event_id</code> column to <code>vendor_table_listings</code> in Supabase to enable this.':''}</div>`;
   return;
 }

 if(!listings.length){
   el.innerHTML=`<div style="border:1px dashed var(--border);border-radius:12px;padding:22px;text-align:center;color:var(--muted);font-size:13px">No vendor table spots posted for this event yet.<br><button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="postEventVendorTable()">+ Post your first vendor spots</button></div>`;
   return;
 }

 el.innerHTML=listings.map(l=>{
   const apps=l.vendor_table_applications||[];
   const pending=apps.filter(a=>a.status==='pending').length;
   const approved=apps.filter(a=>a.status==='approved').length;
   const isActive=l.is_active;
   const deadline=l.deadline?new Date(l.deadline+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'No deadline';
   const fee=l.spot_fee!=null?parseFloat(l.spot_fee).toFixed(2):'0.00';
   const safeName=(l.event_name||'').replace(/'/g,"\\'");
   return `
   <div style="border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--surface)">
     <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
       <div style="min-width:0">
         <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px">

         </div>
         <div style="font-family:var(--mono);font-size:10px;letter-spacing:0.08em;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap">

           <span>$${fee} per spot</span>
           <span>Deadline: ${deadline}</span>
           ${pending?`<span style="color:var(--orange)">${pending} pending</span>`:''}
           ${approved?`<span style="color:var(--green)">${approved} approved</span>`:''}
         </div>
       </div>
       <div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap">

async function saveBudgetItem(eventId){
 const item=document.getElementById('bItem').value.trim();
 if(!item){document.getElementById('bErr').textContent='Item name required';document.getElementById('bErr').style.display='block';return;}
 const{error}=await sb.from('event_budget').insert({
   event_id:eventId,
   planner_id:currentUser.id,
   item,
   category:document.getElementById('bCat').value,
   estimated:parseFloat(document.getElementById('bEst').value)||0,
   actual:parseFloat(document.getElementById('bActual').value)||0,
   notes:document.getElementById('bNotes').value.trim()||null,
 });
 if(error){document.getElementById('bErr').textContent='Error saving. Try again.';document.getElementById('bErr').style.display='block';return;}
 closeModal();
 toast('Budget item added!');
 renderEventDetail();
}

async function saveAlert(eventId){
 const title=document.getElementById('altTitle').value.trim();

// ── START CONVERSATION ─────────────────────────────────────────
// Core function used across all portals to initiate a new message thread
async function startConversation(recipientId, recipientRole, subject, openingMessage){
  if(!currentUser){ toast('Sign in to send messages','error'); return; }
  const uid = currentUser.id;
  const myRole = 'organizer';

  // Find existing conversation between these two users
  // Fetch both sides separately to avoid PostgREST nested and() syntax issues
  const {data:asA} = await sb.from('conversations')
    .select('id').eq('participant_a', uid).eq('participant_b', recipientId).neq('status','archived').maybeSingle();
  const {data:asB} = await sb.from('conversations')
    .select('id').eq('participant_a', recipientId).eq('participant_b', uid).neq('status','archived').maybeSingle();

  let convoId = asA?.id || asB?.id;

  if(!convoId){
    // Create new conversation
    const {data:convo, error:convoErr} = await sb.from('conversations').insert({
      participant_a:      uid,
      participant_b:      recipientId,
      participant_a_role: myRole,
      participant_b_role: recipientRole,
      status:             'active',
      last_message_at:    new Date().toISOString(),
    }).select().single();

    if(convoErr){ toast('Could not start conversation','error'); return; }
    convoId = convo.id;

    // Create message request so recipient sees it in their Requests tab
    await sb.from('message_requests').insert({
      conversation_id: convoId,
      recipient_id:    recipientId,
      status:          'pending',
    });
  }

  // Send the opening message
  if(openingMessage){
    await sb.from('messages').insert({
      conversation_id: convoId,
      sender_id:       uid,
      sender_role:     myRole,
      body:            openingMessage,
    });
  }

  // Navigate to inbox and open the thread
  nav('inbox');
  setTimeout(async ()=>{
    await loadInboxConversations(uid);
    openInboxConvo(convoId);
  }, 400);

  toast('Message sent');
}

          <button id="inboxTabReq" onclick="switchInboxTab('requests')" style="flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--sub);font-weight:700;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif">Requests</button>
        </div>
        <div id="inboxList" style="flex:1;overflow-y:auto"><div style="padding:24px;color:var(--sub);font-size:13px;text-align:center">Loading...</div></div>
      </div>
      <div id="inboxThread" style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px">
        Select a conversation to start messaging
      </div>
    </div>
  </div>`;
  loadInboxConversations(uid);
}

let _inboxTab='messages',_inboxConvos=[],_inboxRequests=[],_activeConvo=null,_inboxChannel=null,_inboxAttachment=null;

function switchInboxTab(tab){
  _inboxTab=tab;
  document.getElementById('inboxTabMsg').style.background=tab==='messages'?'#FF6B35':'transparent';
  document.getElementById('inboxTabMsg').style.color=tab==='messages'?'#fff':'var(--sub)';
  document.getElementById('inboxTabReq').style.background=tab==='requests'?'#FF6B35':'transparent';
  document.getElementById('inboxTabReq').style.color=tab==='requests'?'#fff':'var(--sub)';
  renderInboxList();
}

async function loadInboxConversations(uid){
  const {data:convos}=await sb.from('conversations').select('*')
    .or('participant_a.eq.'+uid+',participant_b.eq.'+uid)
    .eq('status','active').order('last_message_at',{ascending:false});
  _inboxConvos=convos||[];
  const {data:reqs}=await sb.from('message_requests').select('*,conversations(*)')
    .eq('recipient_id',uid).eq('status','pending');
  _inboxRequests=reqs||[];
  let unread=0;
  for(const c of _inboxConvos){
    const {count}=await sb.from('messages').select('id',{count:'exact',head:true})
      .eq('conversation_id',c.id).neq('sender_id',uid).is('read_at',null);
    unread+=count||0;
  }
  ['inboxUnreadBadge','inboxNavBadge'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.textContent=unread;el.style.display=unread>0?'inline':'none';}
  });
  renderInboxList();
}

function renderInboxList(){
  const el=document.getElementById('inboxList');if(!el)return;
  const uid=currentUser?.id;
  if(_inboxTab==='messages'){
    if(_inboxConvos.length===0){el.innerHTML='<div style="padding:24px;color:var(--sub);font-size:13px;text-align:center">No active conversations yet.</div>';return;}
    el.innerHTML=_inboxConvos.map(c=>{
      const role=c.participant_a===uid?c.participant_b_role:c.participant_a_role;
      const active=_activeConvo?.id===c.id;
      return `<div onclick="openInboxConvo('${c.id}')" style="padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;background:${active?'rgba(255,107,53,0.06)':'transparent'};border-left:${active?'2px solid #FF6B35':'2px solid transparent'}">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px">
          <span style="font-weight:700;font-size:13px;text-transform:capitalize">${role}</span>
          <span style="font-size:10px;color:var(--muted)">${new Date(c.last_message_at).toLocaleDateString()}</span>
        </div>
        <div style="font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:0.08em">Active thread</div>
      </div>`;
    }).join('');
  } else {
    if(_inboxRequests.length===0){el.innerHTML='<div style="padding:24px;color:var(--sub);font-size:13px;text-align:center">No pending requests.</div>';return;}
    el.innerHTML=_inboxRequests.map(r=>`
      <div style="padding:16px;border-bottom:1px solid var(--border)">
        <div style="font-weight:700;font-size:13px;margin-bottom:4px;text-transform:capitalize">${r.conversations?.participant_a_role||'Someone'} wants to connect</div>
        <div style="font-size:12px;color:var(--sub);margin-bottom:12px">${new Date(r.created_at).toLocaleDateString()}</div>
        <div style="display:flex;gap:8px">
          <button onclick="acceptInboxRequest('${r.id}','${r.conversation_id}')" style="flex:1;padding:7px 0;border-radius:8px;background:#FF6B35;color:#fff;border:none;font-weight:700;font-size:12px;cursor:pointer">Accept</button>
          <button onclick="declineInboxRequest('${r.id}','${r.conversation_id}')" style="flex:1;padding:7px 0;border-radius:8px;background:transparent;color:var(--sub);border:1px solid var(--border);font-weight:700;font-size:12px;cursor:pointer">Decline</button>
        </div>
      </div>`).join('');
  }
}

async function openInboxConvo(convoId){
  const uid=currentUser?.id;
  _activeConvo=_inboxConvos.find(c=>c.id===convoId);
  renderInboxList();
  const {data:msgs}=await sb.from('messages').select('*').eq('conversation_id',convoId).order('created_at',{ascending:true});
  await sb.from('messages').update({read_at:new Date().toISOString()}).eq('conversation_id',convoId).neq('sender_id',uid).is('read_at',null);
  loadInboxConversations(uid);
  const role=_activeConvo.participant_a===uid?_activeConvo.participant_b_role:_activeConvo.participant_a_role;
  const thread=document.getElementById('inboxThread');
  thread.style.cssText='flex:1;display:flex;flex-direction:column;align-items:unset;justify-content:unset';
  thread.innerHTML=`
    <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0">
      <div style="width:34px;height:34px;border-radius:50%;background:rgba(255,107,53,0.15);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#FF6B35;flex-shrink:0">${role[0].toUpperCase()}</div>
      <div><div style="font-weight:700;font-size:14px;text-transform:capitalize">${role}</div><div style="font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:0.08em">Active</div></div>
    </div>
    <div id="msgFeed" style="flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px"></div>
    <div style="padding:12px 20px;border-top:1px solid var(--border)">
      <div id="attachPreview" style="display:none;margin-bottom:8px;padding:6px 12px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between;align-items:center"></div>
      <div style="display:flex;gap:8px;align-items:flex-end">
        <textarea id="msgInput" placeholder="Type a message... (Enter to send)" rows="2" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendInboxMessage();}" style="flex:1;resize:none;border-radius:10px;padding:10px 14px;font-size:14px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif"></textarea>
        <div style="display:flex;flex-direction:column;gap:6px">
          <button onclick="document.getElementById('inboxFileInput').click()" style="width:38px;height:38px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--sub);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center">📎</button>
          <button onclick="sendInboxMessage()" style="width:38px;height:38px;border-radius:10px;background:#FF6B35;border:none;color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center">↑</button>
        </div>
        <input type="file" id="inboxFileInput" style="display:none" accept="image/*,.pdf,.doc,.docx" onchange="previewInboxAttachment(event)">
      </div>
    </div>`;
  renderMsgFeed(msgs||[],uid);
  if(_inboxChannel)sb.removeChannel(_inboxChannel);
  _inboxChannel=sb.channel('inbox-organizer-'+convoId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+convoId},
      payload=>{
        const feed=document.getElementById('msgFeed');
        if(feed){feed.innerHTML+=renderMsgBubble(payload.new,uid);document.getElementById('msgFeedBottom')?.scrollIntoView({behavior:'smooth'});}
      }).subscribe();
}

function renderMsgBubble(m,uid){
  const mine=m.sender_id===uid;
  const d=new Date(m.created_at);
  const ts=d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  return `<div style="display:flex;flex-direction:column;align-items:${mine?'flex-end':'flex-start'}">
    <div style="max-width:70%;background:${mine?'#FF6B35':'var(--bg)'};color:${mine?'#fff':'var(--text)'};border-radius:${mine?'16px 16px 4px 16px':'16px 16px 16px 4px'};padding:10px 14px;font-size:14px;line-height:1.5">
      ${m.body?`<div>${m.body}</div>`:''}
      ${m.attachment_url&&m.attachment_type==='image'?`<img src="${m.attachment_url}" style="max-width:100%;border-radius:8px;margin-top:${m.body?'8px':'0'}">`:''}
      ${m.attachment_url&&m.attachment_type==='file'?`<a href="${m.attachment_url}" target="_blank" style="color:${mine?'rgba(255,255,255,0.85)':'#FF6B35'};font-size:13px;display:block">Download attachment</a>`:''}
    </div>
    <div style="font-size:10px;color:var(--muted);margin-top:4px">${ts}</div>
  </div>`;
}

function renderMsgFeed(msgs,uid){
  const feed=document.getElementById('msgFeed');if(!feed)return;
  feed.innerHTML=msgs.map(m=>renderMsgBubble(m,uid)).join('')+'<div id="msgFeedBottom"></div>';
  document.getElementById('msgFeedBottom')?.scrollIntoView();
}

function previewInboxAttachment(e){
  const file=e.target.files[0];if(!file)return;
  _inboxAttachment=file;
  const prev=document.getElementById('attachPreview');
  if(prev){prev.style.display='flex';prev.innerHTML=`<span>${file.name}</span><button onclick="clearInboxAttachment()" style="background:none;border:none;color:var(--sub);cursor:pointer;font-size:14px">×</button>`;}
}
function clearInboxAttachment(){_inboxAttachment=null;const p=document.getElementById('attachPreview');if(p)p.style.display='none';}

async function sendInboxMessage(){
  const uid=currentUser?.id;
  const input=document.getElementById('msgInput');
  const body=input?.value.trim();
  if(!body&&!_inboxAttachment)return;
  let attachment_url=null,attachment_type=null;
  if(_inboxAttachment){
    const ext=_inboxAttachment.name.split('.').pop();
    const path='inbox/'+_activeConvo.id+'/'+Date.now()+'.'+ext;
    const {error}=await sb.storage.from('attachments').upload(path,_inboxAttachment,{upsert:true});
    if(!error){const {data:u}=sb.storage.from('attachments').getPublicUrl(path);attachment_url=u.publicUrl;attachment_type=_inboxAttachment.type.startsWith('image/')?'image':'file';}
    clearInboxAttachment();
  }
  await sb.from('messages').insert({conversation_id:_activeConvo.id,sender_id:uid,sender_role:'organizer',body:body||null,attachment_url,attachment_type});
  if(input)input.value='';
  const {data:msgs}=await sb.from('messages').select('*').eq('conversation_id',_activeConvo.id).order('created_at',{ascending:true});
  renderMsgFeed(msgs||[],uid);
}

async function acceptInboxRequest(reqId,convoId){
  await sb.from('message_requests').update({status:'accepted'}).eq('id',reqId);
  await sb.from('conversations').update({status:'active'}).eq('id',convoId);
  switchInboxTab('messages');
  loadInboxConversations(currentUser?.id);
}

async function declineInboxRequest(reqId,convoId){
  await sb.from('message_requests').update({status:'declined'}).eq('id',reqId);
  await sb.from('conversations').update({status:'archived'}).eq('id',convoId);
  loadInboxConversations(currentUser?.id);
}

// ── DASHBOARD ─────────────────────────────────────────────────
function renderDashboard(){
 const name=currentUser.user_metadata?.full_name||currentUser.email.split('@')[0];
 const firstName=name.split(' ')[0];

 if(!myEvents.length){

           ${s.done?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/><\/svg>':`${i+1}`}
         </div>

 }

 const activeEvent=myEvents[0];

 // festival_applications uses: business_name, first_name, last_name, email, fee, status, applicant_type, category
 // Normalize to a common shape regardless of which table we pull from
 function normalizeApp(a, source){
   if(source==='festival'){
     return {
       id: a.id,
       business_name: a.business_name || (a.first_name+' '+(a.last_name||'')).trim(),
       vendor_type: a.category || a.applicant_type || 'Vendor',
       spot_type: a.applicant_type==='food_truck'||a.applicant_type==='food_professional'?'food_truck':'table',
       email: a.email,
       status: a.status || 'pending',
       payment_status: a.fee>0&&a.status==='approved'?'paid':'unpaid',
       spot_fee: a.fee || 0,
       created_at: a.created_at,
     };
   }
   return a;
 }

 // Try festival_applications first (event_id column), fall back to fetching by event name
 const festivalQuery = activeEvent.id
   ? sb.from('festival_applications').select('*').eq('event_id', activeEvent.id).order('created_at',{ascending:false})
   : sb.from('festival_applications').select('*').order('created_at',{ascending:false});

 festivalQuery
   .then(({data:apps, error})=>{
     // If event_id not set yet on rows, pull all festival apps as fallback
     let raw = apps||[];
     if(!raw.length && !error){
       return sb.from('festival_applications').select('*').order('created_at',{ascending:false})
         .then(({data:all})=>{ raw=all||[]; return raw; });
     }
     return raw;
   })
   .then((raw)=>{
     const applications=(raw||[]).map(a=>normalizeApp(a,'festival'));
     const confirmed=applications.filter(a=>a.status==='approved'||a.status==='confirmed').length;
     const pending=applications.filter(a=>a.status==='pending').length;
     const feesCollected=applications.filter(a=>a.status==='approved'||a.status==='confirmed').reduce((s,a)=>s+(a.spot_fee||0),0);
     const feesPending=applications.filter(a=>a.status==='pending').reduce((s,a)=>s+(a.spot_fee||0),0);

     function statusBadge(status){
       if(status==='approved'||status==='confirmed') return '<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(52,211,153,0.1);color:var(--green);border:1px solid rgba(52,211,153,0.25)">Approved</span>';
       if(status==='pending') return '<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(251,191,36,0.1);color:var(--gold);border:1px solid rgba(251,191,36,0.25)">Pending</span>';
       if(status==='rejected') return '<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(248,113,113,0.1);color:var(--red);border:1px solid rgba(248,113,113,0.25)">Rejected</span>';
       return '<span style="font-size:10px;padding:2px 8px;border-radius:99px;background:var(--surface);color:var(--muted)">'+status+'</span>';
     }

     function appCard(a){
       const isPaid=a.payment_status==='paid';
       const isApproved=a.status==='approved'||a.status==='confirmed';
       const isRejected=a.status==='rejected';

       return `<div style="background:#242440;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px 16px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,0.5)">
         <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px">
           <div>
             <div style="font-size:13px;font-weight:700">${a.business_name||a.applicant_name||'Applicant'}</div>
             <div style="font-size:11px;color:var(--sub);margin-top:2px">${a.vendor_type||'Vendor'} &middot; ${a.spot_type==='food_truck'?'Food truck':'Table spot'}</div>
           </div>
           ${statusBadge(a.status)}
         </div>
         <div style="font-size:11px;color:var(--sub);margin-bottom:10px">
           Spot fee: <span style="color:var(--orange);font-weight:600">$${fee}</span>
           &nbsp;&middot;&nbsp;
           Payment: <span style="color:${isPaid?'var(--green)':'var(--muted)'};font-weight:600">${isPaid?'Confirmed':'Unpaid'}</span>
         </div>
         <div style="display:flex;gap:6px;flex-wrap:wrap">
           ${!isApproved&&!isRejected?`<button onclick="approveVendorApp('${a.id}')" style="font-size:11px;padding:5px 10px;border-radius:6px;background:rgba(52,211,153,0.1);color:var(--green);border:1px solid rgba(52,211,153,0.25);cursor:pointer;font-family:var(--font);font-weight:600">&#10003; Approve</button>`:''}
           ${!isRejected&&!isApproved?`<button onclick="rejectVendorApp('${a.id}')" style="font-size:11px;padding:5px 10px;border-radius:6px;background:rgba(248,113,113,0.1);color:var(--red);border:1px solid rgba(248,113,113,0.25);cursor:pointer;font-family:var(--font);font-weight:600">&#10007; Reject</button>`:''}

           ${isApproved&&!isPaid?`<button onclick="sendPaymentLink('${a.id}','${a.email||''}')" style="font-size:11px;padding:5px 10px;border-radius:6px;background:rgba(255,107,53,0.1);color:var(--orange);border:1px solid rgba(255,107,53,0.25);cursor:pointer;font-family:var(--font);font-weight:600">&#8594; Send payment link</button>`:''}

         </div>
       </div>`;
     }

     window.filterOrgApps=function(filter){
       document.querySelectorAll('.app-ftab').forEach(el=>{
         const active=el.dataset.filter===filter;
         el.style.background=active?'rgba(255,107,53,0.12)':'transparent';
         el.style.color=active?'var(--orange)':'var(--sub)';
         el.style.borderColor=active?'rgba(255,107,53,0.3)':'var(--border)';
       });
       const filtered=filter==='all'?applications:

       toast('Application approved');nav('dashboard');
     };

function timeAgoCollab(dt){
  if(!dt)return'';
  const s=Math.floor((Date.now()-new Date(dt))/1000);
  if(s<60)return'just now';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<604800)return Math.floor(s/86400)+'d ago';
  return new Date(dt).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

// Upload an event cover image to Supabase Storage, then put the public URL
// into the evCover field (which saveEvent already reads). Replaces the old
// paste-a-link-only flow so organizers can upload a photo directly.
async function uploadEventCover(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const msg = document.getElementById('evCoverMsg');
  if(file.size > 5 * 1024 * 1024){
    msg.style.color = '#ef4444';
    msg.textContent = 'Image must be under 5MB';
    input.value = '';
    return;
  }
  msg.style.color = 'var(--muted)';
  msg.textContent = 'Uploading...';

  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const uid = (currentUser && currentUser.id) ? currentUser.id : 'anon';
  const path = `${uid}/${Date.now()}.${ext}`;

  const { error: upErr } = await sb.storage
    .from('event-covers')
    .upload(path, file, { upsert: true, contentType: file.type });

  if(upErr){
    msg.style.color = '#ef4444';
    msg.textContent = 'Upload failed: ' + upErr.message;
    return;
  }

  const { data: urlData } = sb.storage.from('event-covers').getPublicUrl(path);
  const publicUrl = urlData.publicUrl;

  document.getElementById('evCover').value = publicUrl;
  const prev = document.getElementById('evCoverPreview');
  prev.src = publicUrl;
  prev.style.display = 'block';
  msg.style.color = '#22c55e';
  msg.textContent = 'Uploaded';
}

}

function initVenuePlaces(){
  const input=document.getElementById('evVenueAddress');
  if(!input||input._placesInited)return;
  input._placesInited=true;

  // Dropdown container
  let dropdown=document.getElementById('evVenueDropdown');
  if(!dropdown){
    dropdown=document.createElement('div');
    dropdown.id='evVenueDropdown';
    dropdown.style.cssText='position:absolute;z-index:999;background:var(--card);border:1px solid var(--border);border-radius:8px;width:100%;max-height:220px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.4);display:none;top:100%;left:0;margin-top:2px';
    input.parentElement.style.position='relative';
    input.parentElement.appendChild(dropdown);
  }

  let debounceTimer;
  input.addEventListener('input',()=>{
    clearTimeout(debounceTimer);
    const q=input.value.trim();
    if(q.length<3){dropdown.style.display='none';return;}
    debounceTimer=setTimeout(()=>nominatimSearch(q,dropdown,input),400);
  });

  // Close dropdown on outside click
  document.addEventListener('click',(e)=>{
    if(!input.contains(e.target)&&!dropdown.contains(e.target)){
      dropdown.style.display='none';
    }
  });
}

async function nominatimSearch(q,dropdown,input){
  try{
    // Mapbox Geocoding - biased toward Columbus, Ohio
    const url='https://api.mapbox.com/geocoding/v5/mapbox.places/'+encodeURIComponent(q)+'.json?access_token='+MAPBOX_GEOCODE_TOKEN+'&country=US&types=address,poi&proximity=-82.9988,39.9612&limit=5';
    const res=await fetch(url);
    const data=await res.json();
    const features=data.features||[];
    if(!features.length){dropdown.style.display='none';return;}
    dropdown.innerHTML=features.map((f,i)=>`
      <div data-idx="${i}" style="padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border-sub);transition:background 0.12s"
        onmouseover="this.style.background='var(--card-hover,#18182a)'"
        onmouseout="this.style.background=''"
        onclick="selectVenueResult('${f.place_name.replace(/'/g,"\\'")}',${f.geometry.coordinates[1]},${f.geometry.coordinates[0]})">
        <div style="font-weight:600;color:var(--text)">${f.text||f.place_name.split(',')[0]}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${f.place_name}</div>
      </div>`).join('');
    dropdown.style.display='block';
  }catch(e){
    console.warn('Mapbox geocode failed:',e);
  }
}

  const latEl=document.getElementById('evVenueLat');
  const lngEl=document.getElementById('evVenueLng');
  const dropdown=document.getElementById('evVenueDropdown');
  if(input)input.value=displayName;
  if(latEl)latEl.value=lat;
  if(lngEl)lngEl.value=lng;
  if(dropdown)dropdown.style.display='none';
}

async function submitEvent(editId){
 const title=document.getElementById('evTitle')?.value.trim();
 const date=document.getElementById('evDate')?.value;
 const time=document.getElementById('evTime')?.value||'19:00';
 const errEl=document.getElementById('evErr');
 if(!title||!date){if(errEl){errEl.textContent='Please fill in event title and date.';errEl.style.display='block';}return;}
 const startTime=new Date(date+'T'+time+':00');
 const endDate=document.getElementById('evEndDate')?.value;
 const endTime=document.getElementById('evEndTime')?.value;
 const endDateTime=(endDate&&endTime)?new Date(endDate+'T'+endTime+':00').toISOString():null;
 const venueId=document.getElementById('evVenue')?.value||null;
 const venueAddress=document.getElementById('evVenueAddress')?.value?.trim()||null;
 const venueLat=document.getElementById('evVenueLat')?.value||null;
 const venueLng=document.getElementById('evVenueLng')?.value||null;
 // Use listed venue ID if selected, otherwise store address as venue_name_override
 const isOtherVenue=document.getElementById('venuePanelOther')?.style.display!=='none';
 const cover=document.getElementById('evCover')?.value||null;

 // Collect tiers
 const tierRows=document.querySelectorAll('.tier-row');
 const tiers=[];
 tierRows.forEach(function(row){
   const name=row.querySelector('.tier-name')?.value.trim();
   const price=row.querySelector('.tier-price')?.value;
   const qty=row.querySelector('.tier-qty')?.value;
   const desc=row.querySelector('.tier-desc')?.value.trim();
   const link=row.querySelector('.tier-link')?.value.trim();
   if(name)tiers.push({name,price:parseFloat(price)||0,quantity:qty?parseInt(qty):null,quantity_remaining:qty?parseInt(qty):null,description:desc||null,payment_link:link||null});
 });

 const priceVals=tiers.map(function(t){return t.price;}).filter(function(p){return p>0;});
 const isFree=priceVals.length===0;

 const payload={
   title,
   start_time:startTime.toISOString(),
   end_time:endDateTime,
   category:document.getElementById('evCat')?.value||'Other',
   venue_id:isOtherVenue?null:(venueId||null),
   venue_name_override:isOtherVenue?(venueAddress||null):null,
   latitude:venueLat?parseFloat(venueLat):null,
   longitude:venueLng?parseFloat(venueLng):null,
   description:document.getElementById('evDesc')?.value||null,
   cover_image_url:cover,
   price_min:isFree?null:(priceVals.length?Math.min.apply(null,priceVals):null),
   price_max:isFree?null:(priceVals.length?Math.max.apply(null,priceVals):null),
   is_free:isFree,
   status:window._eventSaveStatus||'draft',
   owner_id:currentUser.id,
   organizer_email:currentUser.email,
 };

 let eventId=editId||null;
 let error;
 if(editId){
   const res=await sb.from('events').update(payload).eq('id',editId);
   error=res.error;
 } else {
   const res=await sb.from('events').insert(payload).select().single();
   error=res.error;
   if(!error)eventId=res.data.id;
 }
 if(error){if(errEl){errEl.textContent=error.message;errEl.style.display='block';}return;}

 // Save ticket tiers
 if(eventId&&tiers.length>0){
   await sb.from('ticket_tiers').delete().eq('event_id',eventId);
   const tierRows=tiers.map(function(t){return Object.assign({},t,{event_id:eventId});});
   await sb.from('ticket_tiers').insert(tierRows);
 }

 closeModal();
 await loadData();
 const savedEvent=myEvents.find(x=>x.id===eventId)||myEvents[myEvents.length-1];
 if(savedEvent){
   toast(window._eventSaveStatus==='published'?'\uD83C\uDF89 Event published!':'Draft saved!');
   navEventDetail(savedEvent.id);
 } else {
   toast('Event saved!');
   nav('events');
 }
 window._eventSaveStatus=null;
}

});

<style>
@keyframes siPulse{0%,100%{border-color:var(--border);box-shadow:none;}50%{border-color:#FF6B35;box-shadow:0 0 0 3px rgba(255,107,53,0.12);}}
.si-pulse{animation:siPulse 1.4s ease-in-out infinite!important;}
</style>
<script>
async function runOrganizerSmartImport(){
  const urlInput=document.getElementById('smart-import-url');
  const btn=document.getElementById('smart-import-btn');
  const targetUrl=urlInput?urlInput.value.trim():'';
  if(!targetUrl){if(urlInput){urlInput.style.borderColor='#e24b4a';setTimeout(()=>urlInput.style.borderColor='',1800);}return;}
  const FIELDS=['evTitle','evDesc','evDate','evTime','evCover'];
  btn.textContent='Analyzing...';btn.disabled=true;btn.style.opacity='0.6';
  FIELDS.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add('si-pulse');});
  try{
    const {data:{session}}=await sb.auth.getSession();
    const res=await fetch('https://toblgvatvsjljbqogzsv.supabase.co/functions/v1/smart-import',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+(session?.access_token||'')},
      body:JSON.stringify({url:targetUrl})
    });
    if(!res.ok)throw new Error('API '+res.status);
    const data=await res.json();
    organizerPopulateEvent({
      event_name: data.event_name||data.name||data.title||'',
      event_date: data.event_date||data.date||data.start_date||'',
      description: data.description||data.summary||'',
      cover_image: data.image_url||data.cover_image||data.image||''
    });
    urlInput.style.borderColor='#1d9e75';
    setTimeout(()=>{urlInput.style.borderColor='';},2500);
    btn.textContent='Filled!';
    setTimeout(()=>{btn.textContent='Magic Fill';},2500);
  }catch(e){
    console.error('[Smart Import]',e);
    btn.textContent='Try Again';
    urlInput.style.borderColor='#e24b4a';
    setTimeout(()=>{btn.textContent='Magic Fill';urlInput.style.borderColor='';},2500);
  }finally{
    btn.disabled=false;btn.style.opacity='1';
    FIELDS.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('si-pulse');});
  }
}
function organizerPopulateEvent({event_name,event_date,description,cover_image}){
  const set=(id,val)=>{if(!val)return;const el=document.getElementById(id);if(!el)return;el.value=val;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));};
  set('evTitle',event_name);
  set('evDesc',description);
  set('evCover',cover_image);
  if(event_date){
    const p=new Date(event_date);
    if(!isNaN(p)){
      set('evDate',p.toISOString().split('T')[0]);
      set('evTime',p.toTimeString().slice(0,5));
    }
  }
}

        <div style="display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" onclick="openVendorTableModal('${l.id}')">Edit</button>
          <button class="btn btn-ghost btn-sm" onclick="viewVendorTableApps('${l.id}','${l.event_name}')">Applications ${apps.length?`<span style="background:var(--orange);color:white;border-radius:99px;font-size:10px;font-weight:700;padding:1px 7px;margin-left:4px">${apps.length}</span>`:''}

  }else if(prefill){
    listing={event_name:prefill.event_name,event_date:prefill.event_date,event_location:prefill.event_location};
  }
  const prefillEventId=(!listingId&&prefill)?prefill.event_id:'';

  const vendorTypes=['Food Vendor','Food Truck','Artisan / Craft','Apparel / Merchandise','Beauty / Wellness','Nonprofit / Community','Pop-up Retail','Art / Photography','Other'];
  const selectedTypes=listing?.vendor_types_wanted||[];

  wrap.innerHTML=`
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="field">
      <label>Event Name *</label>
      <input id="vt-event-name" value="${listing?.event_name||''}" placeholder="e.g. 1313 Festival" />
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field">
        <label>Event Date *</label>
        <input id="vt-event-date" type="date" value="${listing?.event_date||''}" />
      </div>
      <div class="field">
        <label>Application Deadline</label>
        <input id="vt-deadline" type="date" value="${listing?.deadline||''}" />
      </div>
    </div>
    <div class="field">
      <label>Event Location *</label>
      <input id="vt-location" value="${listing?.event_location||''}" placeholder="e.g. 1313 E. Broad St., Columbus" />
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
      <div class="field">
        <label>Total Spots *</label>
        <input id="vt-total" type="number" min="1" value="${listing?.total_spots||1}" />
      </div>
      <div class="field">
        <label>Spots Remaining *</label>
        <input id="vt-remaining" type="number" min="0" value="${listing?.spots_remaining??listing?.total_spots??1}" />
      </div>
      <div class="field">
        <label>Spot Fee ($) *</label>
        <input id="vt-fee" type="number" min="0" step="0.01" value="${listing?.spot_fee||75}" />
      </div>
    </div>
    <div class="field">
      <label>Vendor Types Wanted</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px">
        ${vendorTypes.map(t=>`
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 12px;transition:all 0.15s" id="vttype-wrap-${t.replace(/\W/g,'')}">
            <input type="checkbox" id="vttype-${t.replace(/\W/g,'')}" value="${t}" ${selectedTypes.includes(t)?'checked':''} onchange="vtTypeToggle(this)" style="accent-color:var(--orange)">
            ${t}
          </label>`).join('')}
      </div>
    </div>
    <div class="field">
      <label>Description / Requirements</label>
      <textarea id="vt-desc" style="height:80px;resize:none" placeholder="What types of vendors are you looking for? Any requirements?">${listing?.requirements||listing?.description||''}</textarea>
    </div>
    <input type="hidden" id="vt-event-id" value="${prefillEventId||listing?.event_id||''}" />

function vtTypeToggle(el){
  const wrap=el.closest('label');
  if(el.checked){wrap.style.background='rgba(255,107,53,0.1)';wrap.style.borderColor='rgba(255,107,53,0.4)';}
  else{wrap.style.background='var(--surface)';wrap.style.borderColor='var(--border)';}
}

async function saveVendorTableListing(listingId){
  const eventName=document.getElementById('vt-event-name').value.trim();
  const eventDate=document.getElementById('vt-event-date').value;
  const deadline=document.getElementById('vt-deadline').value;
  const location=document.getElementById('vt-location').value.trim();
  const total=parseInt(document.getElementById('vt-total').value)||1;
  const remaining=parseInt(document.getElementById('vt-remaining').value)??total;
  const fee=parseFloat(document.getElementById('vt-fee').value)||0;
  const desc=document.getElementById('vt-desc').value.trim();
  const types=[...document.querySelectorAll('[id^="vttype-"]:checked')].map(el=>el.value);
  const eventIdEl=document.getElementById('vt-event-id');
  const eventId=eventIdEl&&eventIdEl.value?eventIdEl.value:null;

  if(!eventName)return toast('Event name is required','error');
  if(!eventDate)return toast('Event date is required','error');
  if(!location)return toast('Event location is required','error');
  if(fee<0)return toast('Spot fee cannot be negative','error');

  const payload={
    organizer_id:currentUser.id,
    event_name:eventName,
    event_date:eventDate,
    deadline:deadline||null,
    event_location:location,
    total_spots:total,
    spots_remaining:remaining,
    spot_fee:fee,
    requirements:desc||null,
    vendor_types_wanted:types.length?types:null,
    is_active:true,
  };
  if(eventId)payload.event_id=eventId;

  async function persist(p){
    if(listingId)return sb.from('vendor_table_listings').update(p).eq('id',listingId);
    return sb.from('vendor_table_listings').insert(p);
  }
  let{error}=await persist(payload);
  // If the event_id column hasn't been added in Supabase yet, save without it so posting still works.
  if(error&&/event_id/.test(error.message||'')){
    const {event_id,...rest}=payload;
    ({error}=await persist(rest));
  }

  if(error){toast('Error saving listing: '+error.message,'error');return;}
  toast(listingId?'Listing updated!':'Listing posted! Vendors can now apply.','success');
  closeModal();
  refreshVendorTableViews();
}

async function deleteVendorTableListing(id){
  if(!confirm('Delete this listing? All applications will also be removed.'))return;
  const{error}=await sb.from('vendor_table_listings').delete().eq('id',id);
  if(error){toast('Error deleting listing','error');return;}
  toast('Listing deleted');
  refreshVendorTableViews();
}

async function toggleListingActive(id,active){
  const{error}=await sb.from('vendor_table_listings').update({is_active:active}).eq('id',id);
  if(error){toast('Error updating listing','error');return;}
  toast(active?'Listing reopened':'Listing closed');
  refreshVendorTableViews();
}

  document.getElementById('modalContainer').innerHTML=`

        <button onclick="closeModal()" style="background:none;border:none;color:var(--sub);font-size:22px;cursor:pointer;line-height:1">&#215;</button>
      </div>
      <div class="modal-body" id="vtAppsWrap"><div class="spinner"></div></div>
    </div>
  </div>`;

  const{data:apps,error}=await sb
    .from('vendor_table_applications')
    .select('*, vendors(business_name,category,email,instagram,description)')
    .eq('listing_id',listingId)
    .order('created_at',{ascending:false});

  const wrap=document.getElementById('vtAppsWrap');
  if(error){wrap.innerHTML=`<div style="color:var(--red);font-size:13px">Error loading applications</div>`;return;}
  if(!apps?.length){wrap.innerHTML=`<div style="text-align:center;padding:40px;color:var(--muted)"><div style="font-size:36px;margin-bottom:12px">&#128203;</div><div style="font-weight:600;margin-bottom:6px">No applications yet</div><div style="font-size:13px">Share your listing to attract vendors.</div></div>`;return;}

  const statusColor={pending:'color:var(--orange);background:rgba(255,107,53,0.08);border:1px solid rgba(255,107,53,0.25)',approved:'color:var(--green);background:var(--green-dim);border:1px solid var(--green-border)',rejected:'color:var(--red);background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2)',withdrawn:'color:var(--muted);background:rgba(255,255,255,0.04);border:1px solid var(--border)'};

  wrap.innerHTML=apps.map(a=>`
  <div style="padding:16px 0;border-bottom:1px solid var(--border)">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:14px;margin-bottom:3px">${a.vendors?.business_name||'Unknown Vendor'}</div>
        <div style="font-family:var(--mono);font-size:10px;letter-spacing:0.1em;color:var(--muted);margin-bottom:6px">${a.vendors?.category||'Vendor'}${a.vendors?.email?' · '+a.vendors.email:''}</div>
        ${a.vendors?.description?`<div style="font-size:12px;color:var(--sub);line-height:1.5;margin-bottom:8px;max-width:360px">${a.vendors.description.substring(0,120)}${a.vendors.description.length>120?'...':''}</div>`:''}
        ${a.message?`<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--sub);font-style:italic;line-height:1.55">"${a.message}"</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0">
        <span style="font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 12px;border-radius:99px;${statusColor[a.status]||statusColor.pending}">${a.status}</span>
        ${a.status==='pending'?`
        <div style="display:flex;gap:6px">
          <button class="btn btn-primary btn-sm" onclick="updateVTApp('${a.id}','approved','${listingId}','${eventName}')">Approve</button>
          <button class="btn btn-danger btn-sm" onclick="updateVTApp('${a.id}','rejected','${listingId}','${eventName}')">Decline</button>
        </div>`:''}
        ${a.vendors?.instagram?`<a href="https://instagram.com/${a.vendors.instagram.replace('@','')}" target="_blank" style="font-family:var(--mono);font-size:9px;letter-spacing:0.1em;color:var(--muted);text-decoration:none">&#128247; @${a.vendors.instagram.replace('@','')}</a>`:''}
      </div>
    </div>
  </div>`).join('');
}

async function updateVTApp(appId,status,listingId,eventName){
  const{error}=await sb.from('vendor_table_applications').update({status,reviewed_at:new Date().toISOString()}).eq('id',appId);
  if(error){toast('Error updating application','error');return;}

  if(status==='approved'){
    // Send vendor a payment link via the checkout Edge Function
    // First get vendor details from the application
    const{data:app}=await sb
      .from('vendor_table_applications')
      .select('vendor_id, vendors(email,contact_email,business_name)')
      .eq('id',appId)
      .maybeSingle();

    const vendorEmail=app?.vendors?.contact_email||app?.vendors?.email||null;
    const vendorName=app?.vendors?.business_name||'Vendor';

    if(vendorEmail){
      try{
        const res=await fetch(`${SB_URL}/functions/v1/vendor-table-checkout`,{
          method:'POST',
          headers:{'Content-Type':'application/json','apikey':SB_KEY},
          body:JSON.stringify({
            application_id:appId,
            listing_id:listingId,
            vendor_id:app.vendor_id,
            vendor_email:vendorEmail,
            vendor_name:vendorName,
          })
        });
        const data=await res.json();
        if(data.url){
          // Email the payment link to the vendor via send-email function
          await fetch(`${SB_URL}/functions/v1/send-email`,{
            method:'POST',
            headers:{'Content-Type':'application/json','apikey':SB_KEY},
            body:JSON.stringify({
              to:vendorEmail,
              subject:`You've been approved — Pay to confirm your spot at ${eventName}`,
              html:`
                <div style="font-family:sans-serif;max-width:480px;margin:0 auto">
                  <h2 style="color:#FF6B35">You've been approved!</h2>
                  <p>Hi ${vendorName},</p>
                  <p>Your application for a vendor spot at <strong>${eventName}</strong> has been approved.</p>
                  <p>To confirm your spot, complete your payment using the link below. Spots are held on a first-paid basis.</p>
                  <a href="${data.url}" style="display:inline-block;background:#FF6B35;color:white;padding:14px 28px;text-decoration:none;font-weight:700;margin:16px 0;font-size:15px">Pay Now to Confirm Your Spot &rarr;</a>
                  <p style="font-size:13px;color:#666">This link expires in 24 hours. If you have questions, reply through your CBUSEVENTS vendor portal inbox.</p>
                  <p style="font-size:12px;color:#999;margin-top:24px">Powered by CBUSEVENTS &mdash; United by Events</p>
                </div>
              `
            })
          });
          toast('Vendor approved and payment link sent to '+vendorEmail);
        } else {
          // Checkout failed but approval saved - notify organizer
          toast('Vendor approved. Payment link could not be sent automatically — share manually.','error');
          console.error('Checkout error:',data.error);
        }
      }catch(err){
        toast('Vendor approved but payment email failed. Share link manually.','error');
        console.error('Payment link error:',err);
      }
    } else {
      // No email on file - just approve
      toast('Vendor approved. No email on file — notify them directly.');
    }
  } else {
    toast('Application declined');
  }

  await viewVendorTableApps(listingId,eventName);
}


// ── AVATAR UPLOAD ─────────────────────────────────────────────
async function uploadAvatar(input){
  const file = input.files[0];
  if(!file) return;
  if(file.size > 2 * 1024 * 1024){
    document.getElementById('avatarMsg').style.color='var(--red)';
    document.getElementById('avatarMsg').textContent='Image must be under 2MB';
    return;
  }
  const msg = document.getElementById('avatarMsg');
  msg.style.color='var(--sub)';
  msg.textContent='Uploading...';

  const ext = file.name.split('.').pop();
  const path = `${currentUser.id}/avatar.${ext}`;

  const { error: upErr } = await sb.storage
    .from('profile-photos')
    .upload(path, file, { upsert: true, contentType: file.type });

  if(upErr){
    msg.style.color='var(--red)';
    msg.textContent='Upload failed: ' + upErr.message;
    return;
  }

  const { data: urlData } = sb.storage.from('profile-photos').getPublicUrl(path);
  const publicUrl = urlData.publicUrl + '?t=' + Date.now(); // cache bust

  // Write to organizer_profiles (primary) and customer_profiles (fallback)
  await sb.from('organizer_profiles')
    .upsert({ user_id: currentUser.id, avatar_url: urlData.publicUrl, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
  await sb.from('customer_profiles')
    .upsert({ user_id: currentUser.id, avatar_url: urlData.publicUrl, updated_at: new Date().toISOString() }, { onConflict: 'user_id' }).catch(()=>{});

  organizerProfile.avatar_url = urlData.publicUrl;

  // Update preview
  const preview = document.getElementById('avatarPreview');
  if(preview) preview.innerHTML = `<img src="${publicUrl}" style="width:100%;height:100%;object-fit:cover">`;

  // Update nav avatar chip
  const navAv = document.getElementById('navAvatarInitial');
  if(navAv) navAv.innerHTML = `<img src="${publicUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;

  msg.style.color='var(--green)';
  msg.textContent='✓ Photo updated!';
  setTimeout(()=>{ if(document.getElementById('avatarMsg')) document.getElementById('avatarMsg').textContent=''; }, 3000);
}

async function removeAvatar(){
  if(!confirm('Remove your profile photo?')) return;
  await sb.from('organizer_profiles')
    .update({ avatar_url: null, updated_at: new Date().toISOString() })
    .eq('user_id', currentUser.id);
  await sb.from('customer_profiles')
    .update({ avatar_url: null, updated_at: new Date().toISOString() })
    .eq('user_id', currentUser.id).catch(()=>{});
  organizerProfile.avatar_url = null;
  // Reset nav avatar
  const name = currentUser.user_metadata?.full_name||currentUser.email.split('@')[0];
  const navAv = document.getElementById('navAvatarInitial');
  if(navAv) navAv.textContent = name[0].toUpperCase();
  renderProfile();
  toast('Profile photo removed');
}
