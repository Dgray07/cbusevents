<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — CBUSEVENTS</title>
<meta name="theme-color" content="#080810">
<link rel="apple-touch-icon" href="/assets/cbus-shield.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
:root{
  --bg:#080810;--surface:#0f0f1a;--card:#141420;--border:#1e1e2e;
  --text:#f0f0fa;--sub:#7070a0;--muted:#40405a;
  --orange:#FF6B35;--orange-dim:rgba(255,107,53,0.1);--orange-border:rgba(255,107,53,0.25);
  --green:#34d399;--red:#f87171;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --r-md:10px;--r-lg:14px;--r-full:9999px;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;}

/* Background effect */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(255,107,53,0.06) 0%,transparent 70%);pointer-events:none;}

.auth-wrap{width:100%;max-width:440px;animation:fadeUp 0.5s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* Logo */
.auth-logo{text-align:center;margin-bottom:32px;}
.auth-logo-text{font-weight:900;font-size:24px;letter-spacing:-0.05em;text-transform:uppercase;cursor:pointer;}
.auth-logo-text span{color:var(--orange);}
.auth-logo-sub{font-family:var(--mono);font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-top:4px;}

/* Card */
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px;box-shadow:0 24px 80px rgba(0,0,0,0.4);}

/* Role selector */
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px;}
.role-btn{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;cursor:pointer;transition:all 0.18s;text-align:left;}
.role-btn:hover{border-color:rgba(255,107,53,0.3);background:var(--orange-dim);}
.role-btn.active{border-color:var(--orange);background:var(--orange-dim);}
.role-btn-name{font-weight:700;font-size:13px;color:var(--text);margin-bottom:2px;}
.role-btn.active .role-btn-name{color:var(--orange);}
.role-btn-sub{font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}

/* Divider */
.auth-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-family:var(--mono);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}

/* Form */
.auth-field{margin-bottom:14px;}
label{display:block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border-color 0.18s;}
input:focus{border-color:var(--orange-border);}
input::placeholder{color:var(--muted);}

/* Buttons */
.btn-primary{width:100%;background:var(--orange);color:#fff;border:none;border-radius:var(--r-md);padding:13px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;transition:all 0.18s;margin-top:4px;}
.btn-primary:hover{opacity:0.9;box-shadow:0 4px 20px rgba(255,107,53,0.3);}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;}

/* Error / success */
.auth-err{font-size:12px;min-height:18px;margin-bottom:6px;line-height:1.5;}
.auth-err.error{color:var(--red);}
.auth-err.success{color:var(--green);}

/* Links */
.auth-link{background:none;border:none;color:var(--orange);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);}
.auth-footer{text-align:center;margin-top:20px;font-size:13px;color:var(--sub);}

/* Back link */
.back-link{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;justify-content:center;margin-top:20px;transition:color 0.18s;}
.back-link:hover{color:var(--orange);}
.back-link svg{width:12px;height:12px;}

/* Spinner */
.spinner-sm{width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin 0.7s linear infinite;margin-right:8px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:480px){
  .auth-card{padding:24px;}
  .role-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-logo">
    <div class="auth-logo-text" onclick="window.location.href='https://cbusevents.com'">CBUS<span>EVENTS</span></div>
    <div class="auth-logo-sub">Columbus Event Ecosystem</div>
  </div>

  <!-- SIGN IN VIEW -->
  <div id="signinView" class="auth-card">
    <div style="font-size:20px;font-weight:800;letter-spacing:-0.03em;margin-bottom:6px">Welcome back</div>
    <div style="font-size:13px;color:var(--sub);margin-bottom:24px">Sign in to your CBUSEVENTS account</div>

    <div style="font-family:var(--mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px">I am a</div>
    <div class="role-grid" id="roleGrid">
      <button class="role-btn active" data-role="venue_owner" onclick="selectRole('venue_owner',this)">
        <div class="role-btn-name">Venue Owner</div>
        <div class="role-btn-sub">Venue Portal</div>
      </button>
      <button class="role-btn" data-role="vendor" onclick="selectRole('vendor',this)">
        <div class="role-btn-name">Vendor</div>
        <div class="role-btn-sub">Vendor Portal</div>
      </button>
      <button class="role-btn" data-role="planner" onclick="selectRole('planner',this)">
        <div class="role-btn-name">Event Planner</div>
        <div class="role-btn-sub">Planner Portal</div>
      </button>
      <button class="role-btn" data-role="customer" onclick="selectRole('customer',this)">
        <div class="role-btn-name">Customer</div>
        <div class="role-btn-sub">My Account</div>
      </button>
    </div>

    <div class="auth-divider">or sign in with email</div>

    <div class="auth-field"><label>Email</label><input type="email" id="siEmail" placeholder="you@email.com" onkeydown="if(event.key==='Enter')doSignIn()"></div>
    <div class="auth-field"><label>Password</label><input type="password" id="siPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doSignIn()"></div>
    <div class="auth-err" id="siErr"></div>
    <button class="btn-primary" id="siBtn" onclick="doSignIn()">Sign In</button>
    <div class="auth-footer">
      <button class="auth-link" onclick="showReset()">Forgot password?</button>
      &nbsp;·&nbsp;
      <button class="auth-link" onclick="window.location.href='signup.html'">Create account</button>
    </div>
  </div>

  <!-- RESET VIEW -->
  <div id="resetView" class="auth-card" style="display:none">
    <div style="font-size:20px;font-weight:800;letter-spacing:-0.03em;margin-bottom:6px">Reset password</div>
    <div style="font-size:13px;color:var(--sub);margin-bottom:24px">We'll send a reset link to your inbox</div>
    <div class="auth-field"><label>Email</label><input type="email" id="rstEmail" placeholder="you@email.com" onkeydown="if(event.key==='Enter')doReset()"></div>
    <div class="auth-err" id="rstErr"></div>
    <button class="btn-primary" id="rstBtn" onclick="doReset()">Send Reset Email</button>
    <div class="auth-footer"><button class="auth-link" onclick="showSignin()">Back to sign in</button></div>
  </div>

  <a href="https://cbusevents.com" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Back to CBUSEVENTS
  </a>
</div>

<script>
const SB_URL = "https://toblgvatvsjljbqogzsv.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvYmxndmF0dnNqbGpicW9nenN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMDgwNTAsImV4cCI6MjA4NzY4NDA1MH0._WJEQPizNDiQfDXQB_DHPaQhixPGpMdmYQSmyWmm_FQ";
const sb = supabase.createClient(SB_URL, SB_KEY);

const PORTAL_URLS = {
  venue_owner: 'https://cbusevents.com/cbus-venue-portal.html',
  vendor:      'https://cbusevents.com/cbus-vendor-portal.html',
  planner:     'https://cbusevents.com/cbus-planner-portal.html',
  customer:    'https://cbusevents.com/customer-portal.html',
  admin:       'https://cbusevents.com/cbus-admin.html',
};

let selectedRole = 'venue_owner';

// Pre-select role from URL param
const urlParams = new URLSearchParams(window.location.search);
const roleParam = urlParams.get('role');
if (roleParam && PORTAL_URLS[roleParam]) {
  selectedRole = roleParam;
  document.querySelectorAll('.role-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.role === roleParam);
  });
}

// Already logged in - redirect
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) await redirectByRole(session.user.id);
})();

// Password recovery
sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    const pw = prompt('Enter your new password (min 6 characters):');
    if (!pw || pw.length < 6) return;
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) { alert('Error: ' + error.message); return; }
    if (session?.user) await redirectByRole(session.user.id);
  }
});

function selectRole(role, el) {
  selectedRole = role;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

async function redirectByRole(userId) {
  const { data } = await sb.from('user_roles').select('role').eq('user_id', userId).maybeSingle();
  const role = data?.role || selectedRole || 'customer';
  window.location.href = PORTAL_URLS[role] || PORTAL_URLS.customer;
}

async function doSignIn() {
  const email = document.getElementById('siEmail').value.trim();
  const pass  = document.getElementById('siPass').value;
  const err   = document.getElementById('siErr');
  const btn   = document.getElementById('siBtn');
  err.textContent = ''; err.className = 'auth-err';
  if (!email || !pass) { err.textContent = 'Email and password required.'; err.className='auth-err error'; return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span>Signing in...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) {
    err.textContent = error.message; err.className='auth-err error';
    btn.disabled = false; btn.textContent = 'Sign In';
    return;
  }
  await redirectByRole(data.user.id);
}

async function doReset() {
  const email = document.getElementById('rstEmail').value.trim();
  const err   = document.getElementById('rstErr');
  const btn   = document.getElementById('rstBtn');
  err.textContent = ''; err.className='auth-err';
  if (!email) { err.textContent = 'Enter your email.'; err.className='auth-err error'; return; }
  btn.disabled = true; btn.textContent = 'Sending...';
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: 'https://cbusevents.com/auth.html' });
  if (error) {
    err.textContent = error.message; err.className='auth-err error';
    btn.disabled = false; btn.textContent = 'Send Reset Email';
    return;
  }
  err.textContent = 'Reset link sent — check your inbox.'; err.className='auth-err success';
  btn.textContent = 'Sent!';
}

function showReset()  { document.getElementById('signinView').style.display='none'; document.getElementById('resetView').style.display=''; }
function showSignin() { document.getElementById('resetView').style.display='none'; document.getElementById('signinView').style.display=''; }
</script>
</body>
</html>
