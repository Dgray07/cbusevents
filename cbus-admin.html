<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
:root{
  --bg:#080810;--surface:#0f0f1a;--card:#141420;--card-hover:#18182a;
  --border:#1e1e2e;--border-sub:#191928;
  --text:#f0f0fa;--sub:#7070a0;--muted:#40405a;
  --orange:#FF6B35;--green:#34d399;--red:#f87171;--blue:#818cf8;--gold:#fbbf24;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;min-height:100vh;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* SIDEBAR */
.sidebar{width:210px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:10;}
.sidebar::-webkit-scrollbar{width:0;}
.sidebar-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border);}
.sidebar-logo-text{font-family:var(--font);font-size:15px;font-weight:800;letter-spacing:-0.04em;text-transform:uppercase;}
.sidebar-logo-text span{color:var(--orange);}
.sidebar-logo-sub{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:0.06em;text-transform:uppercase;}
.sidebar-section{padding:14px 16px 4px;font-size:9px;color:var(--muted);font-weight:700;letter-spacing:0.14em;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 16px;font-size:12px;font-weight:500;color:var(--sub);transition:all 0.14s;border-left:2px solid transparent;cursor:pointer;}
.nav-item:hover{background:rgba(255,255,255,0.03);color:var(--text);}
.nav-item.active{background:rgba(255,107,53,0.07);color:var(--orange);border-left-color:var(--orange);font-weight:600;}
.nav-item .nav-icon{font-size:13px;opacity:0.65;flex-shrink:0;}
.nav-item .badge{background:var(--orange);color:#fff;border-radius:20px;padding:1px 7px;font-size:9px;font-weight:800;margin-left:auto;}
.nav-item .badge.green{background:var(--green);color:#000;}
.nav-item .badge.blue{background:var(--blue);color:#fff;}
.nav-item .badge.live{background:rgba(255,107,53,0.15);color:var(--orange);border:1px solid rgba(255,107,53,0.35);}
.sidebar-bottom{margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);}
.admin-tag{background:rgba(255,107,53,0.1);color:var(--orange);border:1px solid rgba(255,107,53,0.25);border-radius:99px;padding:4px 12px;font-size:10px;font-weight:700;text-align:center;letter-spacing:0.06em;text-transform:uppercase;}

/* ── MOBILE ─────────────────────────────────────────────────── */
@media(max-width:768px){
  /* Layout */
  #app{flex-direction:column !important;}
  .sidebar{display:none !important;}
  .main{padding-bottom:0 !important;width:100%;}
  .content{padding:16px !important;}
  .topbar{padding:0 16px !important;height:52px !important;}
  .topbar-title{font-size:15px !important;}
  .topbar-time{display:none !important;}

  /* Hamburger */
  #mobileMenuBtn{display:flex !important;align-items:center;justify-content:center;}

  /* Drawer */
  #mobileMenuDrawer{
    display:none;
    position:fixed;left:0;top:0;bottom:0;
    width:280px !important;
    background:var(--surface);
    border-right:1px solid var(--border);
    z-index:400;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:env(safe-area-inset-bottom);
    transform:translateX(-100%);
    transition:transform 0.28s cubic-bezier(0.4,0,0.2,1);
  }
  #mobileMenuDrawer.open{
    transform:translateX(0) !important;
    display:block !important;
  }
  #mobileMenuOverlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,0.65);
    z-index:399;
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
  }
  #mobileMenuOverlay.open{display:block !important;}

  /* Tables */
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-card{overflow-x:auto;}
  .table-header{flex-direction:column;align-items:flex-start;gap:8px;}

  /* Venue mobile cards */
  .venue-card-mobile{display:flex;}
  .table-card table{display:none;}

  /* Grids */
  .stat-grid,.stats-grid{grid-template-columns:1fr 1fr !important;gap:10px !important;}
  .filter-row{flex-wrap:wrap;gap:6px;}
  .filter-chip{font-size:11px;padding:4px 10px;}
  .search-input{width:100%;margin-left:0 !important;margin-top:4px;}
  .chart-wrap{overflow-x:auto;}

  /* Prevent iOS zoom on inputs */
  input,select,textarea{font-size:16px !important;}
}
@media(max-width:480px){
  .topbar-right .topbar-site-btn:not(:first-child){display:none;}
  .stats-grid{grid-template-columns:1fr !important;}
}

/* MAIN */
.main{flex:1;overflow-x:hidden;position:relative;}
.topbar{position:sticky;top:0;z-index:50;background:rgba(8,8,16,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 36px;height:60px;}
.topbar-title{font-family:var(--font);font-size:16px;font-weight:700;letter-spacing:-0.03em;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-site-btn{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--sub);border-radius:9px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.18s;font-family:var(--font);}
.topbar-site-btn:hover{color:var(--text);border-color:var(--muted);background:rgba(255,255,255,0.07);}
.topbar-time{font-family:var(--mono);font-size:11px;color:var(--muted);background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:6px;padding:4px 10px;}
.content{padding:32px 36px;animation:fadeIn 0.35s ease;}

/* STAT CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 24px 20px;position:relative;overflow:hidden;transition:all 0.2s ease;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--orange),transparent);opacity:0;transition:opacity 0.2s;}
.stat-card:hover{background:var(--card-hover);border-color:rgba(255,255,255,0.08);transform:translateY(-1px);}
.stat-card:hover::before{opacity:1;}
.stat-card[style*="cursor:pointer"]:hover{cursor:pointer;}
.stat-card-icon{font-size:20px;margin-bottom:8px;}
.stat-card-num{font-family:var(--mono);font-size:32px;font-weight:500;margin-bottom:6px;line-height:1;letter-spacing:-0.02em;}
.stat-card-label{font-size:13px;color:var(--sub);font-weight:500;}
.stat-card-sub{font-size:11px;margin-top:10px;color:var(--muted);}

/* TABLE CARDS */
.table-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:20px;}
.table-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border-sub);}
.table-title{font-family:var(--font);font-size:15px;font-weight:700;letter-spacing:-0.02em;}
.table-actions{display:flex;gap:8px;}
table{width:100%;border-collapse:collapse;}
th{padding:10px 20px;text-align:left;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;border-bottom:1px solid var(--border-sub);background:rgba(255,255,255,0.01);}
td{padding:14px 20px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.025);}

/* BADGES */
.badge{display:inline-flex;align-items:center;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;letter-spacing:0.04em;}
.badge-green{background:rgba(52,211,153,0.1);color:var(--green);border:1px solid rgba(52,211,153,0.2);}
.badge-orange{background:rgba(255,107,53,0.12);color:var(--orange);border:1px solid rgba(255,107,53,0.2);}
.badge-red{background:rgba(248,113,113,0.1);color:var(--red);border:1px solid rgba(248,113,113,0.2);}
.badge-blue{background:rgba(129,140,248,0.1);color:var(--blue);border:1px solid rgba(129,140,248,0.2);}
.badge-gold{background:rgba(251,191,36,0.1);color:var(--gold);border:1px solid rgba(251,191,36,0.2);}
.badge-muted{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid var(--border);}

/* BUTTONS */
.btn{border:none;border-radius:9px;padding:7px 15px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.18s;font-family:var(--font);letter-spacing:0.02em;}
.btn-primary{background:var(--orange);color:#fff;}
.btn-primary:hover{opacity:0.9;box-shadow:0 4px 20px rgba(255,107,53,0.3);}
.btn-success{background:var(--green);color:#000;}
.btn-success:hover{opacity:0.85;}
.btn-danger{background:var(--red);color:#fff;}
.btn-danger:hover{opacity:0.85;}
.btn-ghost{background:rgba(255,255,255,0.04);color:var(--sub);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);background:rgba(255,255,255,0.07);}
.btn-sm{padding:4px 11px;font-size:11px;}

/* FILTERS */
.filter-row{display:flex;gap:6px;padding:14px 22px;border-bottom:1px solid var(--border-sub);flex-wrap:wrap;align-items:center;}
.filter-chip{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:11px;font-weight:600;color:var(--sub);cursor:pointer;transition:all 0.15s;}
.filter-chip:hover,.filter-chip.active{background:rgba(255,107,53,0.15);border-color:rgba(255,107,53,0.4);color:var(--orange);}
.search-input{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:9px;padding:7px 13px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;min-width:200px;}
.search-input:focus{border-color:rgba(255,107,53,0.5);background:rgba(255,255,255,0.06);}
.search-input::placeholder{color:var(--muted);}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;width:100%;max-width:520px;animation:fadeIn 0.2s ease;box-shadow:0 24px 80px rgba(0,0,0,0.6);}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:22px 26px;border-bottom:1px solid var(--border-sub);}
.modal-title{font-family:var(--font);font-size:16px;font-weight:700;letter-spacing:-0.02em;}
.modal-body{padding:24px 26px;}
.modal-footer{padding:18px 26px;border-top:1px solid var(--border-sub);display:flex;justify-content:flex-end;gap:8px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;letter-spacing:0.06em;text-transform:uppercase;}
.form-input,.field input,.field select,.field textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:9px;padding:10px 13px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;}
.form-input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(255,107,53,0.5);background:rgba(255,255,255,0.06);box-shadow:0 0 0 3px rgba(255,107,53,0.08);}
.field textarea{min-height:80px;resize:vertical;}
.field select option{background:#141420;color:var(--text);}

/* EMPTY */
.empty-row td{text-align:center;padding:52px;color:var(--muted);font-size:13px;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;width:100%;background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(255,107,53,0.06) 0%,transparent 70%);}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px;width:100%;max-width:400px;box-shadow:0 32px 80px rgba(0,0,0,0.5);animation:fadeIn 0.4s ease;}
.login-logo{font-family:var(--font);font-size:22px;font-weight:900;margin-bottom:4px;letter-spacing:-0.05em;text-transform:uppercase;}
.login-logo span{color:var(--orange);}

/* TOAST */
.toast{position:fixed;bottom:28px;right:28px;z-index:999;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 20px;font-size:13px;font-weight:500;animation:fadeIn 0.3s ease;box-shadow:0 12px 40px rgba(0,0,0,0.5);font-family:var(--font);}
.toast.success{border-color:rgba(52,211,153,0.3);color:var(--green);}
.toast.error{border-color:rgba(248,113,113,0.3);color:var(--red);}

/* REVENUE CHART */
.revenue-bar{display:flex;align-items:flex-end;gap:8px;height:80px;margin-top:16px;}
.rev-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.rev-bar-fill{width:100%;background:linear-gradient(180deg,var(--orange),rgba(255,107,53,0.4));border-radius:4px 4px 0 0;min-height:4px;transition:height 0.6s cubic-bezier(0.34,1.56,0.64,1);}
.rev-bar-label{font-size:10px;color:var(--muted);font-family:var(--mono);}

/* ── ADA COMPLIANCE ── */
.skip-link{position:absolute;top:-100px;left:8px;background:#FF6B35;color:#fff;padding:8px 16px;border-radius:0 0 8px 8px;font-weight:700;font-size:14px;z-index:99999;text-decoration:none;transition:top 0.2s;}
.skip-link:focus{top:0;}
*:focus-visible{outline:2px solid #FF6B35;outline-offset:3px;border-radius:4px;}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}}

/* ── VENUE CARDS ── */
.venue-card-mobile{display:none;flex-direction:column;gap:12px;}
.v-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;transition:border-color 0.2s;}
.v-card:hover{border-color:rgba(255,255,255,0.08);}
.v-card-name{font-weight:700;font-size:14px;margin-bottom:6px;letter-spacing:-0.02em;}
.v-card-meta{font-size:12px;color:var(--sub);margin-bottom:10px;line-height:1.7;}
.v-card-actions{display:flex;gap:6px;flex-wrap:wrap;}
</style>
</head>

function populateMobileMenu(){
  const items = document.getElementById('mobileMenuItems');
  if(!items) return;

function toggleMobileMenu(){
  var drawer = document.getElementById('mobileMenuDrawer');

    drawer.classList.remove('open');
    if(overlay) overlay.classList.remove('open');
    document.body.style.overflow = '';
  } else {
    populateMobileMenu();
    drawer.classList.add('open');
    if(overlay) overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
}

function fmt(dt){
  if(!dt) return '';
  const d=new Date(dt);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function timeAgoAdmin(dt){
  if(!dt) return 'Never';
  const s=Math.floor((Date.now()-new Date(dt))/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

function insertTag(tag){
 const ta=document.getElementById('artBody');

 else ins=`<${tag}>${sel||'Text here'}</${tag}>`;

async function saveArticle(status){
 const title=document.getElementById('artTitle').value.trim();
 const slug=document.getElementById('artSlug').value.trim();

 errEl.textContent='';
 const payload={
   title,slug,body,status,
   subtitle:document.getElementById('artSubtitle').value.trim()||null,
   category:document.getElementById('artCat').value.trim()||'Columbus',
   author:document.getElementById('artAuthor').value.trim()||'CBUSEVENTS',

   seo_description:document.getElementById('artSeoDesc').value.trim()||null,
   ...(status==='published'&&{published_at:new Date().toISOString()}),
 };

   ({error}=await sb.from('articles').update(payload).eq('id',editingArticle.id));
 } else {
   ({error}=await sb.from('articles').insert(payload));
 }
 if(error){errEl.textContent='Error: '+error.message;return;}
 toast(status==='published'?'Article published!':'Draft saved');
 document.getElementById('articleEditor').style.display='none';
 renderBlog();
}

async function loadData(){
 const[vRes,eRes,iRes,dRes,vendRes,fpRes]=await Promise.all([
 sb.from('venues').select('*').order('created_at',{ascending:false}),
 sb.from('events').select('*,venues(name)').order('created_at',{ascending:false}),
 sb.from('inquiries').select('*,venues(name)').order('created_at',{ascending:false}),
 sb.from('design_requests').select('*').order('created_at',{ascending:false}),
 sb.from('vendors').select('*').order('created_at',{ascending:false}).then(r=>r).catch(()=>({data:[]})),
 sb.from('food_professionals').select('*').order('created_at',{ascending:false}).then(r=>r).catch(()=>({data:[]})),
 ]);
 allVenues=vRes.data||[];
 allEvents=eRes.data||[];
 allInquiries=iRes.data||[];
 allDesignRequests=dRes.data||[];
 allVendors=vendRes.data||[];
 allFoodPros=fpRes.data||[];
 // Load order summaries per food pro (total revenue + order count)
 try{
   const{data:orders}=await sb.from('food_professional_orders').select('vendor_id,total,status');
   if(orders){
     const map={};
     orders.forEach(o=>{
       if(!map[o.vendor_id])map[o.vendor_id]={count:0,revenue:0,pending:0};
       map[o.vendor_id].count++;
       map[o.vendor_id].revenue+=(parseFloat(o.total)||0);
       if(o.status==='pending')map[o.vendor_id].pending++;
     });
     allFoodPros=allFoodPros.map(p=>({...p,_orders:map[p.user_id]||{count:0,revenue:0,pending:0}}));
   }
 }catch(e){allFoodPros=allFoodPros.map(p=>({...p,_orders:{count:0,revenue:0,pending:0}}));}
 // Fetch organizer and attendee counts — wrapped so any failure is silent
 try{
   const[pRes,aRes]=await Promise.all([
     sb.from('user_roles').select('*',{count:'exact',head:true}).eq('role','organizer'),
     sb.from('user_roles').select('*',{count:'exact',head:true}).eq('role','attendee'),
   ]);
   organizerCount=pRes.count||0;
   attendeeCount=aRes.count||0;
 }catch(e){organizerCount=0;attendeeCount=0;}
}

let _adminInboxTab='messages',_adminConvos=[],_adminRequests=[],_adminActiveConvo=null,_adminChannel=null,_adminAttachment=null;

function renderAdminInboxPage(){
  const uid=currentUser?.id;
  document.getElementById('pageContent').innerHTML=`

    <div style="font-size:22px;font-weight:800;letter-spacing:-0.03em;margin-bottom:2px">Inbox <span id="adminInboxUnreadBadge" style="display:none;background:#FF6B35;color:#fff;border-radius:99px;font-size:14px;font-weight:700;padding:2px 8px;margin-left:6px;vertical-align:middle"></span></div>
    <div style="font-size:13px;color:var(--sub)">All platform conversations. Admin can message anyone.</div>

        <button id="adminTabMsg" onclick="adminSwitchTab('messages')" style="flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--border);background:#FF6B35;color:#fff;font-weight:700;font-size:12px;cursor:pointer;font-family:var(--font)">All Threads</button>
        <button id="adminTabReq" onclick="adminSwitchTab('requests')" style="flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--sub);font-weight:700;font-size:12px;cursor:pointer;font-family:var(--font)">Requests</button>
      </div>
      <div style="padding:10px 14px;border-bottom:1px solid var(--border)">
        <input id="adminInboxSearch" placeholder="Search conversations..." oninput="adminFilterConvos(this.value)" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-size:12px;font-family:var(--font)">
      </div>
      <div id="adminInboxList" style="flex:1;overflow-y:auto"><div style="padding:24px;color:var(--sub);font-size:13px;text-align:center">Loading...</div></div>
      <div style="padding:14px;border-top:1px solid var(--border)">
        <button onclick="adminStartNewConvo()" style="width:100%;padding:8px;border-radius:8px;background:#FF6B35;color:#fff;border:none;font-weight:700;font-size:12px;cursor:pointer;font-family:var(--font)">+ Start New Conversation</button>

function adminSwitchTab(tab){
  _adminInboxTab=tab;
  document.getElementById('adminTabMsg').style.background=tab==='messages'?'#FF6B35':'transparent';
  document.getElementById('adminTabMsg').style.color=tab==='messages'?'#fff':'var(--sub)';
  document.getElementById('adminTabReq').style.background=tab==='requests'?'#FF6B35':'transparent';
  document.getElementById('adminTabReq').style.color=tab==='requests'?'#fff':'var(--sub)';
  adminRenderList();
}

async function adminLoadConversations(uid){
  const {data:convos}=await sb.from('conversations').select('*').eq('status','active').order('last_message_at',{ascending:false});
  _adminConvos=convos||[];
  const {data:reqs}=await sb.from('message_requests').select('*,conversations(*)').eq('status','pending');
  _adminRequests=reqs||[];
  let unread=0;
  for(const c of _adminConvos){
    const {count}=await sb.from('messages').select('id',{count:'exact',head:true}).eq('conversation_id',c.id).neq('sender_id',uid).is('read_at',null);
    unread+=count||0;
  }
  ['adminInboxUnreadBadge','adminInboxBadge'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.textContent=unread;el.style.display=unread>0?'inline':'none';}
  });
  adminRenderList();
}

function adminFilterConvos(q){
  const els=document.querySelectorAll('.admin-convo-item');
  els.forEach(el=>{el.style.display=el.dataset.roles?.includes(q.toLowerCase())?'':'none';});
}

function adminRenderList(){
  const el=document.getElementById('adminInboxList');if(!el)return;
  const uid=currentUser?.id;
  if(_adminInboxTab==='messages'){
    if(_adminConvos.length===0){el.innerHTML='<div style="padding:24px;color:var(--sub);font-size:13px;text-align:center">No conversations yet.</div>';return;}
    el.innerHTML=_adminConvos.map(c=>{
      const active=_adminActiveConvo?.id===c.id;
      const roles=c.participant_a_role+' + '+c.participant_b_role;
      return `<div class="admin-convo-item" data-roles="${roles.toLowerCase()}" onclick="adminOpenConvo('${c.id}')" style="padding:14px 16px;border-bottom:1px solid var(--border-sub);cursor:pointer;background:${active?'rgba(255,107,53,0.06)':'transparent'};border-left:${active?'2px solid #FF6B35':'2px solid transparent'}">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px">
          <span style="font-weight:700;font-size:12px;text-transform:capitalize;color:var(--text)">${roles}</span>
          <span style="font-size:10px;color:var(--muted);font-family:var(--mono)">${new Date(c.last_message_at).toLocaleDateString()}</span>
        </div>
        <div style="font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--mono)">Active thread</div>
      </div>`;
    }).join('');
  } else {
    if(_adminRequests.length===0){el.innerHTML='<div style="padding:24px;color:var(--sub);font-size:13px;text-align:center">No pending requests.</div>';return;}
    el.innerHTML=_adminRequests.map(r=>`
      <div style="padding:16px;border-bottom:1px solid var(--border-sub)">
        <div style="font-weight:700;font-size:13px;margin-bottom:4px;text-transform:capitalize">${r.conversations?.participant_a_role||'User'} → ${r.conversations?.participant_b_role||'User'}</div>
        <div style="font-size:11px;color:var(--sub);margin-bottom:10px">${new Date(r.created_at).toLocaleDateString()}</div>
        <div style="display:flex;gap:8px">
          <button onclick="adminAcceptRequest('${r.id}','${r.conversation_id}')" style="flex:1;padding:6px 0;border-radius:8px;background:#FF6B35;color:#fff;border:none;font-weight:700;font-size:11px;cursor:pointer;font-family:var(--font)">Approve</button>
          <button onclick="adminDeclineRequest('${r.id}','${r.conversation_id}')" style="flex:1;padding:6px 0;border-radius:8px;background:transparent;color:var(--sub);border:1px solid var(--border);font-weight:700;font-size:11px;cursor:pointer;font-family:var(--font)">Decline</button>
        </div>
      </div>`).join('');
  }
}

async function adminOpenConvo(convoId){
  const uid=currentUser?.id;
  _adminActiveConvo=_adminConvos.find(c=>c.id===convoId);
  adminRenderList();
  const {data:msgs}=await sb.from('messages').select('*').eq('conversation_id',convoId).order('created_at',{ascending:true});
  await sb.from('messages').update({read_at:new Date().toISOString()}).eq('conversation_id',convoId).neq('sender_id',uid).is('read_at',null);
  adminLoadConversations(uid);
  const c=_adminActiveConvo;
  const roles=c.participant_a_role+' + '+c.participant_b_role;
  const thread=document.getElementById('adminInboxThread');
  thread.style.cssText='flex:1;display:flex;flex-direction:column;align-items:unset;justify-content:unset';
  thread.innerHTML=`
    <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:34px;height:34px;border-radius:50%;background:rgba(255,107,53,0.15);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#FF6B35;flex-shrink:0">A</div>
        <div><div style="font-weight:700;font-size:14px;text-transform:capitalize">${roles}</div><div style="font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:0.08em">Admin View</div></div>
      </div>
      <button onclick="adminArchiveConvo('${convoId}')" style="background:transparent;border:1px solid var(--border);color:var(--sub);border-radius:8px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font)">Archive</button>
    </div>
    <div id="adminMsgFeed" style="flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px"></div>
    <div style="padding:12px 20px;border-top:1px solid var(--border)">
      <div id="adminAttachPreview" style="display:none;margin-bottom:8px;padding:6px 12px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between;align-items:center"></div>
      <div style="display:flex;gap:8px;align-items:flex-end">
        <textarea id="adminMsgInput" placeholder="Type a message as admin... (Enter to send)" rows="2" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();adminSendMessage();}" style="flex:1;resize:none;border-radius:10px;padding:10px 14px;font-size:14px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--font)"></textarea>
        <div style="display:flex;flex-direction:column;gap:6px">
          <button onclick="document.getElementById('adminFileInput').click()" style="width:38px;height:38px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--sub);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center">📎</button>
          <button onclick="adminSendMessage()" style="width:38px;height:38px;border-radius:10px;background:#FF6B35;border:none;color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center">↑</button>
        </div>
        <input type="file" id="adminFileInput" style="display:none" accept="image/*,.pdf,.doc,.docx" onchange="adminPreviewAttachment(event)">
      </div>
    </div>`;
  adminRenderMsgFeed(msgs||[],uid);
  if(_adminChannel)sb.removeChannel(_adminChannel);
  _adminChannel=sb.channel('inbox-admin-'+convoId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+convoId},
      payload=>{
        const feed=document.getElementById('adminMsgFeed');
        if(feed){feed.innerHTML+=adminMsgBubble(payload.new,uid);document.getElementById('adminMsgBottom')?.scrollIntoView({behavior:'smooth'});}
      }).subscribe();
}

function adminMsgBubble(m,uid){
  const mine=m.sender_id===uid;
  const d=new Date(m.created_at);
  const ts=d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  const roleTag=`<span style="font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.1em;opacity:0.7;margin-bottom:3px;display:block">${m.sender_role}</span>`;
  return `<div style="display:flex;flex-direction:column;align-items:${mine?'flex-end':'flex-start'}">
    ${!mine?roleTag:''}
    <div style="max-width:70%;background:${mine?'#FF6B35':'var(--card)'};color:${mine?'#fff':'var(--text)'};border-radius:${mine?'16px 16px 4px 16px':'16px 16px 16px 4px'};padding:10px 14px;font-size:14px;line-height:1.5">
      ${m.body?`<div>${m.body}</div>`:''}
      ${m.attachment_url&&m.attachment_type==='image'?`<img src="${m.attachment_url}" style="max-width:100%;border-radius:8px;margin-top:${m.body?'8px':'0'}">`:''}
      ${m.attachment_url&&m.attachment_type==='file'?`<a href="${m.attachment_url}" target="_blank" style="color:${mine?'rgba(255,255,255,0.85)':'#FF6B35'};font-size:13px;display:block">Download attachment</a>`:''}
    </div>
    <div style="font-size:10px;color:var(--muted);margin-top:4px;font-family:var(--mono)">${ts}</div>
  </div>`;
}

function adminRenderMsgFeed(msgs,uid){
  const feed=document.getElementById('adminMsgFeed');if(!feed)return;
  feed.innerHTML=msgs.map(m=>adminMsgBubble(m,uid)).join('')+'<div id="adminMsgBottom"></div>';
  document.getElementById('adminMsgBottom')?.scrollIntoView();
}

function adminPreviewAttachment(e){
  const file=e.target.files[0];if(!file)return;
  _adminAttachment=file;
  const prev=document.getElementById('adminAttachPreview');
  if(prev){prev.style.display='flex';prev.innerHTML=`<span>${file.name}</span><button onclick="adminClearAttachment()" style="background:none;border:none;color:var(--sub);cursor:pointer;font-size:14px">×</button>`;}
}
function adminClearAttachment(){_adminAttachment=null;const p=document.getElementById('adminAttachPreview');if(p)p.style.display='none';}

async function adminSendMessage(){
  const uid=currentUser?.id;
  const input=document.getElementById('adminMsgInput');
  const body=input?.value.trim();
  if(!body&&!_adminAttachment)return;
  let attachment_url=null,attachment_type=null;
  if(_adminAttachment){
    const ext=_adminAttachment.name.split('.').pop();
    const path='inbox/'+_adminActiveConvo.id+'/'+Date.now()+'.'+ext;
    const {error}=await sb.storage.from('attachments').upload(path,_adminAttachment,{upsert:true});
    if(!error){const {data:u}=sb.storage.from('attachments').getPublicUrl(path);attachment_url=u.publicUrl;attachment_type=_adminAttachment.type.startsWith('image/')?'image':'file';}
    adminClearAttachment();
  }
  await sb.from('messages').insert({conversation_id:_adminActiveConvo.id,sender_id:uid,sender_role:'admin',body:body||null,attachment_url,attachment_type});
  if(input)input.value='';
  const {data:msgs}=await sb.from('messages').select('*').eq('conversation_id',_adminActiveConvo.id).order('created_at',{ascending:true});
  adminRenderMsgFeed(msgs||[],uid);
}

async function adminArchiveConvo(convoId){
  if(!confirm('Archive this conversation?'))return;
  await sb.from('conversations').update({status:'archived'}).eq('id',convoId);
  _adminActiveConvo=null;
  document.getElementById('adminInboxThread').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--sub);font-size:14px">Conversation archived.</div>';
  adminLoadConversations(currentUser?.id);
}

async function adminAcceptRequest(reqId,convoId){
  await sb.from('message_requests').update({status:'accepted'}).eq('id',reqId);
  await sb.from('conversations').update({status:'active'}).eq('id',convoId);
  adminSwitchTab('messages');
  adminLoadConversations(currentUser?.id);
}

async function adminDeclineRequest(reqId,convoId){
  await sb.from('message_requests').update({status:'declined'}).eq('id',reqId);
  await sb.from('conversations').update({status:'archived'}).eq('id',convoId);
  adminLoadConversations(currentUser?.id);
}

async function adminStartNewConvo(){
  const {data:users}=await sb.from('user_roles').select('user_id,role').limit(50);
  if(!users||users.length===0){alert('No users found.');return;}
  const uid=currentUser?.id;
  const opts=users.filter(u=>u.user_id!==uid).map(u=>`<option value="${u.user_id}|${u.role}">${u.role} - ${u.user_id.slice(0,8)}...</option>`).join('');
  const modal=document.createElement('div');
  modal.id='adminNewConvoModal';
  modal.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:400px;max-width:90vw">
    <div style="font-weight:800;font-size:18px;margin-bottom:16px">Start New Conversation</div>
    <label style="font-size:12px;color:var(--sub);display:block;margin-bottom:6px">Select recipient</label>
    <select id="adminNewConvoRecipient" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;margin-bottom:16px">${opts}</select>
    <label style="font-size:12px;color:var(--sub);display:block;margin-bottom:6px">First message</label>
    <textarea id="adminNewConvoMsg" placeholder="Type your message..." rows="3" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;resize:none;margin-bottom:16px"></textarea>
    <div style="display:flex;gap:10px">
      <button onclick="adminCreateConvo()" style="flex:1;padding:10px;border-radius:8px;background:#FF6B35;color:#fff;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font)">Send</button>
      <button onclick="document.getElementById('adminNewConvoModal').remove()" style="flex:1;padding:10px;border-radius:8px;background:transparent;color:var(--sub);border:1px solid var(--border);font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font)">Cancel</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

async function adminCreateConvo(){
  const uid=currentUser?.id;
  const sel=document.getElementById('adminNewConvoRecipient')?.value;
  const msg=document.getElementById('adminNewConvoMsg')?.value.trim();
  if(!sel||!msg){alert('Please select a recipient and write a message.');return;}
  const [recipientId,recipientRole]=sel.split('|');
  const {data:convo,error}=await sb.from('conversations').insert({
    initiated_by:uid,participant_a:uid,participant_b:recipientId,
    participant_a_role:'admin',participant_b_role:recipientRole,status:'active'
  }).select().single();
  if(error||!convo){alert('Error creating conversation.');return;}
  await sb.from('messages').insert({conversation_id:convo.id,sender_id:uid,sender_role:'admin',body:msg});
  document.getElementById('adminNewConvoModal')?.remove();
  adminLoadConversations(uid);
  setTimeout(()=>adminOpenConvo(convo.id),500);
}

function renderVenues(){

 document.getElementById('pageContent').innerHTML=`

function renderVenueCards2(venues){
 if(!venues||!venues.length)return'<div style="text-align:center;padding:52px;color:var(--muted);font-size:13px;">No venues found</div>';
 return venues.map(function(v){
   var statusClass=v.status==='approved'?'badge-green':v.status==='pending'?'badge-orange':'badge-red';
   var tierClass=v.tier==='premium'?'badge-gold':v.tier==='standard'?'badge-blue':'badge-muted';
   var borderColor=v.status==='pending'?'rgba(251,191,36,0.2)':v.status==='approved'?'rgba(52,211,153,0.12)':'var(--border)';
   var website=v.website?(' · <a href="'+v.website+'" target="_blank" style="color:var(--orange);text-decoration:none;">'+v.website.replace('https://','').replace('www.','').split('/')[0]+'</a>'):'';
   var featured=v.is_featured?'<span style="color:var(--gold);font-size:11px;"> ⭐</span>':'';
   var approvBtn=v.status==='pending'?('<button class="btn btn-success btn-sm" onclick="approveVenue(\''+v.id+'\')">Approve</button>'):'';
   var safeName=v.name.replace(/'/g,"\\'");
   return '<div style="background:var(--surface);border:1px solid '+borderColor+';border-radius:14px;padding:15px 18px;display:flex;align-items:center;gap:14px;transition:border-color 0.18s;" onmouseover="this.style.borderColor=\'rgba(255,255,255,0.1)\'" onmouseout="this.style.borderColor=\''+borderColor+'\'">'
     +'<div style="width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--sub);flex-shrink:0;">'+v.name.charAt(0).toUpperCase()+'</div>'
     +'<div style="flex:1;min-width:0;">'
       +'<div style="font-weight:700;font-size:14px;letter-spacing:-0.02em;display:flex;align-items:center;gap:6px;">'+v.name+featured+'</div>'
       +'<div style="font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+(v.venue_type||'Venue')+(v.neighborhood?' · '+v.neighborhood:'')+website+'</div>'
     +'</div>'
     +'<div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">'
       +'<span class="badge '+statusClass+'">'+v.status+'</span>'
       +'<span class="badge '+tierClass+'">'+(v.tier||'free')+'</span>'
     +'</div>'
     +'<div style="display:flex;gap:5px;flex-shrink:0;">'
       +approvBtn
       +'<button class="btn btn-ghost btn-sm" onclick="openTierModal(\''+v.id+'\')">Tier</button>'
       +'<button class="btn btn-ghost btn-sm" onclick="toggleVenueFeature(\''+v.id+'\','+(!v.is_featured)+')">'+(v.is_featured?'Unfeature':'⭐ Feature')+'</button>'
       +'<button class="btn btn-ghost btn-sm" onclick="openEditVenue(\''+v.id+'\')">Edit</button>'
       +'<button class="btn btn-danger btn-sm" onclick="deleteVenue(\''+v.id+'\',\''+safeName+'\')">Delete</button>'
     +'</div>'
   +'</div>';
 }).join('');
}

function renderVenueCards(venues){
 if(!venues||!venues.length)return'<div style="text-align:center;padding:32px;color:var(--muted)">No venues found</div>';
 return venues.map(v=>`
 <div class="v-card">
   <div class="v-card-name">${v.name}</div>
   <div class="v-card-meta">
     ${v.venue_type||'—'} &nbsp;·&nbsp; ${v.neighborhood||'—'}<br>
     <span class="badge ${v.status==='approved'?'badge-green':v.status==='pending'?'badge-orange':'badge-red'}" style="margin-right:4px">${v.status}</span>
     <span class="badge ${v.tier==='premium'?'badge-gold':v.tier==='standard'?'badge-blue':'badge-muted'}">${v.tier||'free'}</span>
   </div>
   <div class="v-card-actions">
     ${v.status==='pending'?`<button class="btn btn-success btn-sm" onclick="approveVenue('${v.id}')">Approve</button>`:''}
     ${v.status!=='rejected'?`<button class="btn btn-ghost btn-sm" onclick="openTierModal('${v.id}')">Tier</button>`:''}
     <button class="btn btn-ghost btn-sm" onclick="toggleVenueFeature('${v.id}',${v.is_featured?'false':'true'})">${v.is_featured?'Unfeature':'Feature'}</button>
     <button class="btn btn-danger btn-sm" onclick="deleteVenue('${v.id}','${v.name.replace(/'/g,"\'")}')">Delete</button>
   </div>
 </div>`).join('');
}

function searchVenues(q){
 const f=allVenues.filter(v=>v.name.toLowerCase().includes(q.toLowerCase())||(v.venue_type||'').toLowerCase().includes(q.toLowerCase())||(v.neighborhood||'').toLowerCase().includes(q.toLowerCase()));
 const el=document.getElementById('venueListBody');
 if(el)el.innerHTML=renderVenueCards2(f);
}

function renderEventCards(events){
 if(!events.length)return'<div style="text-align:center;padding:52px;color:var(--muted);font-size:13px;">No events found</div>';
 return events.map(function(e){
   var d=e.start_time?new Date(e.start_time):null;
   var timeStr=d?d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
   var monthStr=d?d.toLocaleString('en-US',{month:'short'}):'-';
   var dayStr=d?String(d.getDate()):'-';
   var isPast=d&&d<new Date();
   var borderColor=e.status==='published'&&!isPast?'rgba(52,211,153,0.12)':e.status==='draft'?'rgba(255,255,255,0.04)':'var(--border)';
   var statusClass=e.status==='published'?'badge-green':'badge-muted';
   var freeTag=e.is_free?'<span style="color:var(--green);font-size:10px;font-weight:700;background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.2);border-radius:20px;padding:1px 7px;margin-left:6px;">FREE</span>':(e.price_min?'<span style="color:var(--sub);font-size:11px;margin-left:6px;">$'+e.price_min+'</span>':'');
   var boostTag=e.is_boosted?'<span style="color:var(--gold);font-size:10px;margin-left:6px;">&#9889; Boosted</span>':'';
   var venueName=(e.venues&&e.venues.name)||'No venue';
   var safeTitle=e.title.replace(/'/g,"\\'");
   var dateInfo=timeStr?venueName+' &middot; '+timeStr:venueName+' &middot; '+monthStr+' '+dayStr;
   return '<div style="background:var(--surface);border:1px solid '+borderColor+';border-radius:14px;padding:15px 18px;display:flex;align-items:center;gap:14px;transition:border-color 0.18s;" onmouseover="this.style.borderColor=\'rgba(255,255,255,0.1)\'" onmouseout="this.style.borderColor=\''+borderColor+'\'">'
     +'<div style="width:44px;height:44px;border-radius:10px;background:rgba(129,140,248,0.1);border:1px solid rgba(129,140,248,0.2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1;">'
       +'<div style="font-size:9px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:0.05em;">'+monthStr+'</div>'
       +'<div style="font-size:17px;font-weight:800;color:var(--blue);font-family:var(--mono);">'+dayStr+'</div>'
     +'</div>'
     +'<div style="flex:1;min-width:0;">'
       +'<div style="font-weight:700;font-size:14px;letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+e.title+freeTag+boostTag+'</div>'
       +'<div style="font-size:11px;color:var(--muted);margin-top:3px;">'+dateInfo+(e.category?' &middot; '+e.category:'')+'</div>'
     +'</div>'
     +'<span class="badge '+statusClass+'">'+e.status+'</span>'
     +'<div style="display:flex;gap:5px;flex-shrink:0;">'
       +'<button class="btn btn-ghost btn-sm" onclick="toggleEventBoost(\''+e.id+'\','+(!e.is_boosted)+')">'+(e.is_boosted?'Unboost':'&#9889; Boost')+'</button>'
       +'<button class="btn btn-ghost btn-sm" onclick="openEditEvent(\''+e.id+'\')">Edit</button>'
       +'<button class="btn btn-danger btn-sm" onclick="deleteEvent(\''+e.id+'\',\''+safeTitle+'\')">Delete</button>'
     +'</div>'
   +'</div>';
 }).join('');
}

function searchEvents(q){
 const f=allEvents.filter(e=>e.title.toLowerCase().includes(q.toLowerCase())||(e.venues?.name||'').toLowerCase().includes(q.toLowerCase()));
 const el=document.getElementById('eventListBody');
 if(el)el.innerHTML=renderEventCards(f);
}

function renderInquiries(){
 var filters={all:allInquiries,new:allInquiries.filter(function(i){return i.status==='new';}),read:allInquiries.filter(function(i){return i.status==='read';})};
 var filtered=filters[inquiryFilter]||allInquiries;
 var filterBtns=['all','new','read'].map(function(f){
   return '<button class="filter-chip'+(inquiryFilter===f?' active':'')+'" onclick="inquiryFilter=\''+f+'\';renderInquiries()">'+f.charAt(0).toUpperCase()+f.slice(1)+' ('+(filters[f]||[]).length+')</button>';
 }).join('');

// ── COMPRESS IMAGE ──────────────────────────────────────────────
function compressAdminImage(file,maxWidth=1200,quality=0.82){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const canvas=document.createElement('canvas');
          let w=img.width,h=img.height;
          if(w>maxWidth){h=Math.round(h*(maxWidth/w));w=maxWidth;}
          canvas.width=w;canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg',quality));
        }catch(e){reject(e);}
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

    category:document.getElementById('ee-category').value,

  if(editingEventId){

  } else {
    ({error}=await sb.from('events').insert(updates));
  }
  if(error){msg.style.color='#ef4444';msg.textContent='Error: '+error.message;return;}

  // Save ticket tiers — read directly from DOM to catch any unfired oninput events
  const savedEventId = editingEventId || (await sb.from('events').select('id').eq('title', title).order('created_at', {ascending:false}).limit(1).maybeSingle()).data?.id;

      const inputs = div.querySelectorAll('input');

      if (inputs[1]) adminTiers[i].price = inputs[1].value;
      if (inputs[2]) adminTiers[i].capacity = inputs[2].value;

    const validTiers = adminTiers.filter(t => t.name && t.price !== '');
    await sb.from('ticket_tiers').delete().eq('event_id', savedEventId);
    if (validTiers.length > 0) {
      const tierRows = validTiers.map(t => ({
        event_id: savedEventId,
        name: t.name,
        price: parseFloat(t.price) || 0,
        capacity: t.capacity ? parseInt(t.capacity) : null,
      }));
      const { error: tierErr } = await sb.from('ticket_tiers').insert(tierRows);
      if (tierErr) { msg.style.color='#ef4444'; msg.textContent='Tiers error: '+tierErr.message; return; }
      // Update event is_free and price_min to match tiers
      const minTierPrice = Math.min(...validTiers.map(t => parseFloat(t.price) || 0));
      await sb.from('events').update({
        is_free: minTierPrice === 0,
        price_min: minTierPrice,
        price_max: Math.max(...validTiers.map(t => parseFloat(t.price) || 0)),
      }).eq('id', savedEventId);
    }
  }

  msg.style.color='var(--green)';msg.textContent='✓ Saved!';
  await loadData();renderEvents();
  setTimeout(()=>closeEventModal(),1200);
}

 return pros.map(function(p){
   var name=p.display_name||p.business_name||'Unnamed';

   var typePill=type?('<span style="display:inline-block;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:20px;padding:3px 11px;font-size:11px;font-weight:500;color:var(--sub);">'+type+'</span>'):'';

     +'<div style="flex:1;min-width:160px;">'
       +'<div style="font-weight:700;font-size:14px;letter-spacing:-0.02em;">'+name+'</div>'
       +'<div style="font-size:11px;color:var(--muted);margin-top:2px;">'+(p.email||'No email')+(joined?' &nbsp;·&nbsp; Joined '+joined:'')+'</div>'

     // stripe badge

     +'<div style="flex-shrink:0;text-align:right;min-width:90px;">'
       +'<div style="font-family:var(--mono);font-size:15px;font-weight:600;color:var(--text);">'+revStr+'</div>'

// Pulls live payment_intents from Stripe Connect via Supabase Edge Function
// Falls back to local stripe_transactions table if edge function unavailable
let _txnAll=[], _txnFilter='all', _txnSearch='';

async function renderTransactions(){
 document.getElementById('pageContent').innerHTML=`<div style="color:var(--muted);padding:32px;text-align:center">Loading transactions from Stripe…</div>`;
 _txnAll=[];

 // Try Stripe via edge function first
 try{
   const{data:session}=await sb.auth.getSession();
   const token=session?.session?.access_token;
   const res=await fetch(`https://toblgvatvsjljbqogzsv.supabase.co/functions/v1/stripe-transactions`,{
     headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}
   });
   if(res.ok){
     const json=await res.json();
     _txnAll=json.transactions||[];
   }
 }catch(e){console.warn('Edge fn unavailable, falling back to local table');}

 // Fallback: pull from local stripe_transactions table
 if(!_txnAll.length){
   const{data:local}=await sb.from('stripe_transactions')
     .select('*').order('created_at',{ascending:false}).limit(200)
     .catch(()=>({data:[]}));
   if(local&&local.length){
     _txnAll=local.map(r=>({
       id:r.stripe_payment_intent_id||r.id,
       amount:r.amount,
       platform_fee:r.platform_fee||0,
       stripe_fee:r.stripe_fee||0,
       status:r.status||'succeeded',
       portal:r.portal||r.source||'platform',
       description:r.description||r.metadata?.description||'Transaction',
       customer_name:r.customer_name||r.metadata?.name||'—',
       created:r.created_at,
       currency:'usd',
     }));
   }
 }

 _txnFilter='all';
 _txnSearch='';
 _renderTxnPage();
}

function _txnPortalLabel(portal){

}
function _txnPortalColor(portal){
 const map={festival:'var(--orange)',ticketing:'var(--green)',marketplace:'var(--blue)',boost:'var(--gold)',design:'#c084fc',platform:'var(--sub)'};
 return map[portal]||'var(--sub)';
}
function _txnStatusBadge(status){
 if(status==='succeeded'||status==='paid')return'<span class="badge badge-green">Paid</span>';
 if(status==='pending'||status==='processing')return'<span class="badge badge-orange">Pending</span>';
 if(status==='refunded'||status==='partially_refunded')return'<span class="badge badge-blue">Refunded</span>';
 if(status==='failed'||status==='canceled')return'<span class="badge badge-red">Failed</span>';
 return`<span class="badge badge-muted">${status||'—'}</span>`;
}

function _txnFiltered(){

function exportTxnCSV(){
 const filtered=_txnFiltered();
 if(!filtered.length){toast('No transactions to export','error');return;}
 const fmt=n=>(n/100).toFixed(2);
 const headers=['ID','Description','Portal','Customer','Date','Amount ($)','Platform Fee ($)','Stripe Fee ($)','Net ($)','Status'];
 const rows=filtered.map(t=>[
   t.id||'',
   (t.description||'').replace(/,/g,' '),
   _txnPortalLabel(t.portal),
   (t.customer_name||'').replace(/,/g,' '),
   t.created?new Date(t.created).toLocaleDateString('en-US'):'',
   fmt(t.amount||0),
   fmt(t.platform_fee||0),
   fmt(t.stripe_fee||0),
   fmt((t.platform_fee||0)-(t.stripe_fee||0)),
   t.status||'',
 ]);
 const csv=[headers,...rows].map(r=>r.join(',')).join('\n');
 const blob=new Blob([csv],{type:'text/csv'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download=`cbusevents-transactions-${new Date().toISOString().slice(0,10)}.csv`;
 document.body.appendChild(a);a.click();document.body.removeChild(a);
 URL.revokeObjectURL(url);
 toast('CSV exported!');
}

async function applyOverride(){
 const entityId=document.getElementById('ov-entity-id').value.trim();
 const entityType=document.getElementById('ov-entity-type').value;
 const key=document.getElementById('ov-key').value;
 const val=document.getElementById('ov-value').value.trim()||null;
 const reason=document.getElementById('ov-reason').value.trim()||null;
 const expires=document.getElementById('ov-expires').value||null;

 if(!entityId){toast('Entity UUID is required','error');return;}

 // Log it
 await sb.from('admin_overrides').insert({
 entity_type:entityType,entity_id:entityId,override_key:key,
 override_value:val,reason,expires_at:expires,set_by:currentUser?.id
 }).catch(()=>{});

 // Apply directly
 if(key==='feature_listing'&&entityType==='venue')
 await sb.from('venues').update({is_featured:val!=='false'}).eq('id',entityId);
 if(key==='admin_boost')
 await sb.from(entityType==='event'?'events':'venues').update({admin_boost:val!=='false'}).eq('id',entityId);
 if(key==='promote_vendor')
 await sb.from('vendors').update({admin_promoted:true}).eq('id',entityId);
 if(key==='event_boost')
 await sb.from('events').update({is_boosted:true,boost_type:'admin',admin_boost:true}).eq('id',entityId);

 toast(' Override applied!');
 await loadData();
 renderOverrides();
}

const OUTREACH_STATUSES=['Not Contacted','Visited — No Answer','Left Info','Spoke to Staff','Decision Maker Reached','Interested','Signed Up','Not Interested'];
const STATUS_COLORS={'Not Contacted':'badge-muted','Visited — No Answer':'badge-gold','Left Info':'badge-blue','Spoke to Staff':'badge-blue','Decision Maker Reached':'badge-orange','Interested':'badge-orange','Signed Up':'badge-green','Not Interested':'badge-red'};

let _outreachCache={};
async function getOutreachData(){
 if(Object.keys(_outreachCache).length>0)return _outreachCache;
 try{
   const{data}=await sb.from('outreach_tracker').select('venue_id,status,notes,updated_at');
   const result={};
   (data||[]).forEach(r=>result[r.venue_id]={status:r.status,notes:r.notes||'',updatedAt:r.updated_at});
   _outreachCache=result;
   try{
     const local=JSON.parse(localStorage.getItem('cbusevents_outreach')||'{}');
     const localKeys=Object.keys(local).filter(k=>!result[k]);
     if(localKeys.length>0){
       await sb.from('outreach_tracker').upsert(
         localKeys.map(k=>({venue_id:k,status:local[k].status||'Not Contacted',notes:local[k].notes||'',updated_at:local[k].updatedAt||new Date().toISOString(),updated_by:'admin'})),
         {onConflict:'venue_id'}
       );
       localKeys.forEach(k=>result[k]=local[k]);
       _outreachCache=result;
     }
   }catch(e){}
   return result;
 }catch(e){
   try{return JSON.parse(localStorage.getItem('cbusevents_outreach')||'{}');}catch(e2){return{};}
 }
}
async function saveOutreachData(venueId,field,value){
 if(!_outreachCache[venueId])_outreachCache[venueId]={};
 _outreachCache[venueId][field]=value;
 _outreachCache[venueId].updatedAt=new Date().toISOString();
 try{
   await sb.from('outreach_tracker').upsert({
     venue_id:venueId,
     status:_outreachCache[venueId].status||'Not Contacted',
     notes:_outreachCache[venueId].notes||'',
     updated_at:new Date().toISOString(),
     updated_by:currentUser?currentUser.email:'admin',
   },{onConflict:'venue_id'});
 }catch(e){
   try{
     const d=JSON.parse(localStorage.getItem('cbusevents_outreach')||'{}');
     if(!d[venueId])d[venueId]={};
     d[venueId][field]=value;
     localStorage.setItem('cbusevents_outreach',JSON.stringify(d));
   }catch(e2){}
 }
}

async function approveEventClaim(claimId, externalEventId){
  if(!confirm('Approve this claim? This will mark the event as claimed and notify the claimant.'))return;
  const [claimErr, eventErr] = await Promise.all([
    sb.from('event_claims').update({status:'approved',reviewed_at:new Date().toISOString()}).eq('id',claimId).then(r=>r.error),
    sb.from('external_events').update({status:'claimed'}).eq('id',externalEventId).then(r=>r.error)
  ]);
  if(claimErr||eventErr){toast('Error approving claim','error');return;}
  toast('Claim approved','success');
  renderClaims();
}

async function rejectEventClaim(claimId){
  const reason=prompt('Reason for rejection (optional):');
  if(reason===null)return;
  const{error}=await sb.from('event_claims').update({status:'rejected',reviewed_at:new Date().toISOString()}).eq('id',claimId);
  if(error){toast('Error: '+error.message,'error');return;}
  toast('Claim rejected','error');
  renderClaims();
}

function copyToClipboard(btn, text){
 const content=(text!==undefined)?text:btn.getAttribute('data-copy');
 navigator.clipboard.writeText(content).then(()=>{
   const orig=btn.textContent;
   btn.textContent='Copied!';
   btn.style.background='var(--green)';
   btn.style.color='#000';
   setTimeout(()=>{btn.textContent=orig;btn.style.background='';btn.style.color='';},2000);
 }).catch(()=>{
   const ta=document.createElement('textarea');
   ta.value=content;ta.style.position='fixed';ta.style.opacity='0';
   document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
   const orig=btn.textContent;
   btn.textContent='Copied!';btn.style.background='var(--green)';btn.style.color='#000';
   setTimeout(()=>{btn.textContent=orig;btn.style.background='';btn.style.color='';},2000);
 });
}

function getFTData(){
  try{ return JSON.parse(localStorage.getItem(FT_STORAGE_KEY)||'{}'); }catch(e){ return {}; }
}
function saveFTData(data){
  localStorage.setItem(FT_STORAGE_KEY, JSON.stringify(data));
}
function getFTProspects(){
  const d = getFTData();
  return Object.values(d);
}
function saveFTProspect(prospect){
  const d = getFTData();
  d[prospect.id] = prospect;
  saveFTData(d);
}
function deleteFTProspect(id){
  const d = getFTData();
  delete d[id];
  saveFTData(d);
}

      method:'POST',

<style>
@keyframes eesiPulse{0%,100%{border-color:#25252f;box-shadow:none;}50%{border-color:#FF6B35;box-shadow:0 0 0 3px rgba(255,107,53,0.12);}}
.ee-si-pulse{animation:eesiPulse 1.4s ease-in-out infinite!important;}
</style>
<script>
async function runAdminSmartImport(){
  const urlInput=document.getElementById('ee-smart-url');
  const btn=document.getElementById('ee-smart-btn');
  const targetUrl=urlInput?urlInput.value.trim():'';
  if(!targetUrl){if(urlInput){urlInput.style.borderColor='#e24b4a';setTimeout(()=>urlInput.style.borderColor='#25252f',1800);}return;}
  const FIELDS=['ee-title','ee-description','ee-start','ee-cover'];
  btn.textContent='Analyzing...';btn.disabled=true;btn.style.opacity='0.6';
  FIELDS.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add('ee-si-pulse');});
  try{
    const res=await fetch('https://toblgvatvsjljbqogzsv.supabase.co/functions/v1/smart-import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:targetUrl})});
    if(!res.ok)throw new Error('API '+res.status);
    const data=await res.json();
    adminPopulateEvent({
      event_name: data.event_name||data.name||data.title||'',
      event_date: data.event_date||data.date||data.start_date||'',
      description: data.description||data.summary||'',
      cover_image: data.image_url||data.cover_image||data.image||''
    });
    urlInput.style.borderColor='#1d9e75';
    setTimeout(()=>{urlInput.style.borderColor='#25252f';},2500);
    btn.textContent='Filled!';
    setTimeout(()=>{btn.textContent='Magic Fill';},2500);
  }catch(e){
    console.error('[Smart Import Admin]',e);
    btn.textContent='Try Again';
    urlInput.style.borderColor='#e24b4a';
    setTimeout(()=>{btn.textContent='Magic Fill';urlInput.style.borderColor='#25252f';},2500);
  }finally{
    btn.disabled=false;btn.style.opacity='1';
    FIELDS.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('ee-si-pulse');});
  }
}
function adminPopulateEvent({event_name,event_date,description,cover_image}){
  const set=(id,val)=>{if(!val)return;const el=document.getElementById(id);if(!el)return;el.value=val;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));};
  set('ee-title',event_name);
  set('ee-description',description);
  if(event_date){
    const p=new Date(event_date);
    if(!isNaN(p))set('ee-start',p.toISOString().slice(0,16));
  }
  if(cover_image){
    set('ee-cover',cover_image);
    const prev=document.getElementById('ee-cover-preview');
    if(prev){prev.src=cover_image;prev.style.display='block';}
  }
}

  if(error){toast('Error creating rep: '+error.message,'error');return;}
  await sb.from('brand_rep_applications').update({status:'approved'}).eq('id',appId);

      <div style="margin-bottom:12px">
        <div style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--sub);margin-bottom:6px">Full Name</div>
        <input id="cr-name" style="width:100%;background:#0c0c18;border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:9px;font-family:var(--font);font-size:14px;outline:none" placeholder="First and last name">
      </div>
      <div style="margin-bottom:12px">
        <div style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--sub);margin-bottom:6px">Email</div>
        <input id="cr-email" type="email" style="width:100%;background:#0c0c18;border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:9px;font-family:var(--font);font-size:14px;outline:none" placeholder="rep@email.com">
      </div>
      <div style="margin-bottom:20px">
        <div style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--sub);margin-bottom:6px">Referral Code</div>
        <input id="cr-ref" style="width:100%;background:#0c0c18;border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:9px;font-family:var(--font);font-size:14px;outline:none;font-family:var(--mono)" placeholder="e.g. marcus-t">
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" style="flex:1" onclick="document.getElementById('modalContainer').innerHTML=''">Cancel</button>
        <button class="btn btn-primary" style="flex:1" onclick="createRepManual()">Create Rep</button>
      </div>
    </div>
  </div>`;
}

async function createRepManual(){
  const name=document.getElementById('cr-name').value.trim();
  const email=document.getElementById('cr-email').value.trim();
  const ref=document.getElementById('cr-ref').value.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
  if(!name||!email||!ref){toast('All fields required.','error');return;}
  const{error}=await sb.from('sales_reps').insert({name,email,referral_code:ref,rank:'brand_rep'});
  if(error){toast('Error: '+error.message,'error');return;}
  document.getElementById('modalContainer').innerHTML='';
  toast(name+' created. Invite them via Supabase Auth > Users > Invite.');
  renderBrandReps();
}
</script>
