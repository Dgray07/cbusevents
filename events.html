<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
html{scroll-behavior:smooth;}
body{background:var(--ink-deep,#080810);color:var(--on-dark,#f3f1ec);font-family:var(--font,'DM Sans',sans-serif);font-weight:300;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{display:block;}

/* ---- page shell ---- */
.ev-page{max-width:1400px;margin:0 auto;padding:0 22px;}
.ev-head{padding:34px 0 18px;}
.ev-eyebrow{font-family:var(--mono,'DM Mono',monospace);font-size:10px;letter-spacing:0.24em;text-transform:uppercase;color:var(--flame,#FF6B35);margin-bottom:12px;}
.ev-h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(30px,5vw,52px);line-height:1.02;letter-spacing:-0.02em;}
.ev-h1 em{font-style:italic;color:var(--flame,#FF6B35);}
.ev-sub{margin-top:10px;color:var(--ash,#9a98a8);font-size:15px;font-weight:300;}

/* ---- search + filters ---- */
.ev-controls{position:sticky;top:0;z-index:50;background:linear-gradient(var(--ink-deep,#080810) 78%,transparent);padding:14px 0 16px;}
.ev-search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:13px 16px;transition:border-color 0.16s;}
.ev-search:focus-within{border-color:var(--flame,#FF6B35);}
.ev-search svg{width:18px;height:18px;color:var(--mist,#6b6b8a);flex-shrink:0;}
.ev-search input{flex:1;background:none;border:none;outline:none;color:var(--on-dark,#f3f1ec);font-size:15px;font-family:inherit;}
.ev-search input::placeholder{color:var(--mist,#6b6b8a);}
.ev-filter-rows{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.ev-filter-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.ev-filter-row::-webkit-scrollbar{display:none;}
.ev-chip{flex-shrink:0;font-family:var(--mono,'DM Mono',monospace);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;padding:8px 15px;border-radius:100px;border:1px solid rgba(255,255,255,0.14);color:var(--ash,#9a98a8);background:rgba(255,255,255,0.03);white-space:nowrap;transition:all 0.15s;}
.ev-chip:hover{border-color:rgba(255,255,255,0.3);color:var(--on-dark,#f3f1ec);}
.ev-chip.on{background:var(--flame,#FF6B35);border-color:var(--flame,#FF6B35);color:#080810;font-weight:600;}
.ev-filter-label{flex-shrink:0;align-self:center;font-family:var(--mono,'DM Mono',monospace);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--mist,#6b6b8a);padding-right:4px;}

/* ---- split layout: list + map ---- */
.ev-split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start;padding-bottom:60px;}
.ev-list-col{min-width:0;}
.ev-map-col{position:sticky;top:188px;height:calc(100vh - 210px);min-height:440px;}
#map{width:100%;height:100%;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);}

/* ---- grouped sections ---- */
.ev-group{margin-bottom:34px;}
.ev-group-hd{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;}
.ev-group-t{font-family:'Playfair Display',serif;font-weight:700;font-size:23px;}
.ev-group-t em{font-style:italic;color:var(--flame,#FF6B35);}
.ev-group-count{font-family:var(--mono,'DM Mono',monospace);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--mist,#6b6b8a);}
.ev-group-rule{flex:1;height:1px;background:rgba(255,255,255,0.08);}

.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}

/* ---- event card (matches homepage poster vibe) ---- */
.ev-card{display:block;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.09);border-radius:14px;overflow:hidden;transition:border-color 0.15s,transform 0.12s,box-shadow 0.15s;position:relative;}
.ev-card:hover,.ev-card.hl{border-color:var(--flame,#FF6B35);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,0.4);}
.ev-card-img{aspect-ratio:16/10;background:linear-gradient(135deg,rgba(255,107,53,0.1),rgba(129,140,248,0.07));background-size:cover;background-position:center;position:relative;}
.ev-card-tag{position:absolute;top:10px;left:10px;font-family:var(--mono,'DM Mono',monospace);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:5px 9px;border-radius:100px;font-weight:600;}
.ev-card-tag.free{background:rgba(48,214,147,0.9);color:#062a1c;}
.ev-card-tag.paid{background:rgba(0,0,0,0.65);color:#fff;backdrop-filter:blur(4px);}
.ev-card-num{position:absolute;top:8px;right:10px;font-family:var(--mono,'DM Mono',monospace);font-size:11px;font-weight:700;width:24px;height:24px;border-radius:50%;background:var(--flame,#FF6B35);color:#080810;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.4);}
.ev-card-body{padding:13px 14px 15px;}
.ev-card-date{font-family:var(--mono,'DM Mono',monospace);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--flame,#FF6B35);margin-bottom:6px;}
.ev-card-title{font-weight:700;font-size:15px;line-height:1.25;margin-bottom:6px;color:var(--on-dark,#f3f1ec);}
.ev-card-meta{font-size:12px;color:var(--ash,#9a98a8);line-height:1.4;}

/* ---- empty / loading ---- */
.ev-empty{text-align:center;padding:70px 20px;color:var(--mist,#6b6b8a);}
.ev-empty-icon{font-size:34px;margin-bottom:12px;}
.ev-empty-t{font-weight:600;font-size:16px;color:var(--ash,#9a98a8);margin-bottom:6px;}
.ev-skel{background:rgba(255,255,255,0.04);border-radius:14px;aspect-ratio:16/10;animation:evpulse 1.4s ease-in-out infinite;}
@keyframes evpulse{0%,100%{opacity:0.4;}50%{opacity:0.75;}}

/* map popup theme */
.mapboxgl-popup-content{background:#15131f;color:#f3f1ec;border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px 14px;font-family:var(--font,'DM Sans',sans-serif);}
.mapboxgl-popup-tip{border-top-color:#15131f!important;border-bottom-color:#15131f!important;}
.mapboxgl-popup-close-button{color:#9a98a8;font-size:16px;}
.popup-name{font-weight:700;font-size:14px;margin-bottom:3px;}
.popup-date{font-family:var(--mono,'DM Mono',monospace);font-size:11px;color:var(--flame,#FF6B35);margin-bottom:3px;}
.popup-venue{font-size:12px;color:#9a98a8;margin-bottom:7px;}
.popup-link{font-family:var(--mono,'DM Mono',monospace);font-size:11px;color:var(--flame,#FF6B35);text-transform:uppercase;letter-spacing:0.08em;}

/* ---- mobile ---- */
.ev-map-toggle{display:none;}
@media(max-width:900px){
  .ev-split{grid-template-columns:1fr;}
  .ev-map-col{position:fixed;inset:0;top:auto;height:72vh;bottom:0;z-index:400;border-radius:18px 18px 0 0;overflow:hidden;transform:translateY(101%);transition:transform 0.3s ease;background:var(--ink-deep,#080810);padding:8px;box-shadow:0 -10px 40px rgba(0,0,0,0.6);}
  .ev-map-col.open{transform:translateY(0);}
  #map{border-radius:14px;}
  .ev-controls{top:0;}
  .ev-map-toggle{display:flex;align-items:center;gap:7px;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:401;background:var(--flame,#FF6B35);color:#080810;font-family:var(--mono,'DM Mono',monospace);font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:13px 22px;border-radius:100px;box-shadow:0 6px 24px rgba(0,0,0,0.5);}
  .ev-map-close{position:absolute;top:14px;right:18px;z-index:402;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;}
}
@media(min-width:901px){.ev-map-close{display:none;}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<script>
const SB_URL='https://toblgvatvsjljbqogzsv.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvYmxndmF0dnNqbGpicW9nenN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMDgwNTAsImV4cCI6MjA4NzY4NDA1MH0._WJEQPizNDiQfDXQB_DHPaQhixPGpMdmYQSmyWmm_FQ';
const sb=supabase.createClient(SB_URL,SB_KEY);
const MAPBOX_TOKEN='pk.eyJ1IjoiY2J1c2V2ZW50cyIsImEiOiJjbW1oNWJhaDYwYnVrMnJxN3hxdGJlZmhkIn0.RtF51b0qghUlJAjHgNRdFQ';

// ---- state ----
let ALL=[];              // all loaded events (normalized)
let hoodName={};         // slug -> display name
let filters={when:'all',cat:'all',hood:'all',price:'all',q:''};
let map=null, markers=[];

// ---- helpers ----
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(iso){if(!iso)return '';try{return new Date(iso).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}catch(e){return '';}}
function fmtTime(iso){if(!iso)return '';try{const d=new Date(iso);if(!d.getHours()&&!d.getMinutes())return '';return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}catch(e){return '';}}
function evUrl(e){return e._external&&e._ticket_url?e._ticket_url:('https://cbusevents.com/event.html?id='+e.id);}

// ---- date bucketing ----
function startOfToday(){const d=new Date();d.setHours(0,0,0,0);return d;}
function endOfToday(){const d=new Date();d.setHours(23,59,59,999);return d;}
function isTonight(iso){const d=new Date(iso);return d<=endOfToday()&&d>=new Date();}
function isTomorrow(iso){const d=new Date(iso);const t0=new Date(startOfToday());t0.setDate(t0.getDate()+1);const t1=new Date(t0);t1.setHours(23,59,59,999);return d>=t0&&d<=t1;}
function isWeekend(iso){const d=new Date(iso);const day=d.getDay();return (day===5||day===6||day===0)&&d>=new Date();}
function isThisWeek(iso){const d=new Date(iso);const wk=new Date();wk.setDate(wk.getDate()+7);return d>=new Date()&&d<=wk;}

// group key + label for an event (used when "when" is "all")
function groupOf(iso){
  if(isTonight(iso))return 'tonight';
  if(isTomorrow(iso))return 'tomorrow';
  if(isWeekend(iso))return 'weekend';
  if(isThisWeek(iso))return 'week';
  return 'later';
}
const GROUP_META={
  tonight:{t:'Happening <em>tonight</em>',k:'tonight'},
  tomorrow:{t:'<em>Tomorrow</em>',k:'tomorrow'},
  weekend:{t:'This <em>weekend</em>',k:'weekend'},
  week:'',
  later:''
};
const GROUP_ORDER=['tonight','tomorrow','weekend','week','later'];
const GROUP_TITLES={tonight:'Happening <em>tonight</em>',tomorrow:'<em>Tomorrow</em>',weekend:'This <em>weekend</em>',week:'Later <em>this week</em>',later:'<em>Upcoming</em>'};

// ---- card render ----
function card(e,num){
  const venue=e.venue_name_override||(e.venues&&e.venues.name)||'Columbus';
  const hood=e.neighborhood_slug?(hoodName[e.neighborhood_slug]||''):'';
  const tag=e.is_free?'<div class="ev-card-tag free">Free</div>':'<div class="ev-card-tag paid">Tickets</div>';
  const img=e.cover_image_url||'';
  const safeImg=String(img).replace(/'/g,'%27').replace(/"/g,'%22');
  const art=img?`style="background-image:url('${safeImg}')"`:'';
  const openAttr=(e._external&&e._ticket_url)?' target="_blank" rel="noopener"':'';
  const date=fmtDate(e.start_time)+(fmtTime(e.start_time)?' · '+fmtTime(e.start_time):'');
  const metaParts=[venue];if(hood)metaParts.push(hood);
  return `<a class="ev-card" href="${evUrl(e)}"${openAttr} data-eid="${esc(e.id)}">
    <div class="ev-card-img" ${art}>${tag}${num?`<div class="ev-card-num">${num}</div>`:''}</div>
    <div class="ev-card-body">
      <div class="ev-card-date">${esc(date)}</div>
      <div class="ev-card-title">${esc(e.title||'Event')}</div>
      <div class="ev-card-meta">${esc(metaParts.join(' · '))}</div>
    </div>
  </a>`;
}

// ---- filtering ----
function passes(e){
  // when
  if(filters.when==='tonight'&&!isTonight(e.start_time))return false;
  if(filters.when==='tomorrow'&&!isTomorrow(e.start_time))return false;
  if(filters.when==='weekend'&&!isWeekend(e.start_time))return false;
  if(filters.when==='week'&&!isThisWeek(e.start_time))return false;
  // category
  if(filters.cat!=='all'&&(e.category||'').toLowerCase()!==filters.cat)return false;
  // neighborhood
  if(filters.hood!=='all'&&e.neighborhood_slug!==filters.hood)return false;
  // price
  if(filters.price==='free'&&!e.is_free)return false;
  if(filters.price==='paid'&&e.is_free)return false;
  // search
  if(filters.q){
    const hay=((e.title||'')+' '+(e.venue_name_override||(e.venues&&e.venues.name)||'')+' '+(hoodName[e.neighborhood_slug]||'')+' '+(e.category||'')).toLowerCase();
    if(!hay.includes(filters.q.toLowerCase()))return false;
  }
  return true;
}

function render(){
  const list=ALL.filter(passes);
  const col=document.getElementById('listCol');
  if(!list.length){
    col.innerHTML=`<div class="ev-empty"><div class="ev-empty-icon">📭</div><div class="ev-empty-t">No events match these filters</div><div>Try widening your search or clearing a filter.</div></div>`;
    syncMap([]);
    return;
  }
  let html='';
  let pinIndex=0;
  const pinned=[];
  if(filters.when==='all'){
    // grouped by time
    const buckets={};
    list.forEach(e=>{const g=groupOf(e.start_time);(buckets[g]=buckets[g]||[]).push(e);});
    GROUP_ORDER.forEach(g=>{
      const items=buckets[g];if(!items||!items.length)return;
      html+=`<section class="ev-group"><div class="ev-group-hd"><div class="ev-group-t">${GROUP_TITLES[g]}</div><div class="ev-group-count">${items.length} event${items.length>1?'s':''}</div><div class="ev-group-rule"></div></div><div class="ev-grid">`;
      items.forEach(e=>{pinIndex++;pinned.push(e);html+=card(e,pinIndex);});
      html+='</div></section>';
    });
  }else{
    // flat list when a specific time filter is active
    html+='<div class="ev-grid">';
    list.forEach(e=>{pinIndex++;pinned.push(e);html+=card(e,pinIndex);});
    html+='</div>';
  }
  col.innerHTML=html;
  // hover card -> highlight pin
  col.querySelectorAll('.ev-card').forEach((c,i)=>{
    c.addEventListener('mouseenter',()=>highlightPin(i));
    c.addEventListener('mouseleave',()=>highlightPin(-1));
  });
  syncMap(pinned);
}

// ---- map ----
function initMap(){
  mapboxgl.accessToken=MAPBOX_TOKEN;
  map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/dark-v11',center:[-82.9988,39.9612],zoom:11.5});
  map.addControl(new mapboxgl.NavigationControl(),'top-right');
}
function clearMarkers(){markers.forEach(m=>m&&m.remove());markers=[];}
function coordsOf(e){
  // event-level lat/lng first, then venue
  let lat=e.latitude??(e.venues&&e.venues.lat);
  let lng=e.longitude??(e.venues&&e.venues.lng);
  lat=Number(lat);lng=Number(lng);
  if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;
  return {lat,lng};
}
function syncMap(list){
  if(!map)return;
  clearMarkers();
  const bounds=new mapboxgl.LngLatBounds();
  let any=false;
  list.forEach((e,i)=>{
    const c=coordsOf(e);if(!c)return;
    const el=document.createElement('div');
    el.style.cssText='width:26px;height:26px;background:#FF6B35;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"DM Mono",monospace;font-size:11px;font-weight:700;color:#080810;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.4);transition:transform 0.15s;';
    el.textContent=i+1;
    el.addEventListener('mouseenter',()=>el.style.transform='scale(1.18)');
    el.addEventListener('mouseleave',()=>el.style.transform='scale(1)');
    const venue=e.venue_name_override||(e.venues&&e.venues.name)||'';
    const popup=new mapboxgl.Popup({offset:16,closeButton:true}).setHTML(
      `<div class="popup-name">${esc(e.title||'Event')}</div>`+
      (e.start_time?`<div class="popup-date">${esc(fmtDate(e.start_time))}</div>`:'')+
      (venue?`<div class="popup-venue">📍 ${esc(venue)}</div>`:'')+
      `<a href="${evUrl(e)}" class="popup-link">View event →</a>`
    );
    const mk=new mapboxgl.Marker(el).setLngLat([c.lng,c.lat]).setPopup(popup).addTo(map);
    markers[i]=mk;
    bounds.extend([c.lng,c.lat]);
    any=true;
  });
  if(any){try{map.fitBounds(bounds,{padding:60,maxZoom:14,duration:500});}catch(e){}}
}
function highlightPin(i){
  markers.forEach((m,idx)=>{if(!m)return;const el=m.getElement();el.style.transform=(idx===i)?'scale(1.35)':'scale(1)';el.style.zIndex=(idx===i)?'10':'';});
}

// ---- build category + neighborhood filter chips from data ----
function buildDynamicFilters(){
  // categories
  const cats=Array.from(new Set(ALL.map(e=>(e.category||'').trim()).filter(Boolean))).sort();
  const catRow=document.getElementById('catFilters');
  cats.forEach(c=>{
    const b=document.createElement('button');b.className='ev-chip';b.dataset.cat=c.toLowerCase();
    b.textContent=c.charAt(0).toUpperCase()+c.slice(1);
    catRow.appendChild(b);
  });
  // neighborhoods (only those with events)
  const hoods=Array.from(new Set(ALL.map(e=>e.neighborhood_slug).filter(Boolean)));
  const hoodRow=document.getElementById('hoodFilters');
  hoods.map(s=>({slug:s,name:hoodName[s]||s})).sort((a,b)=>a.name.localeCompare(b.name)).forEach(h=>{
    const b=document.createElement('button');b.className='ev-chip';b.dataset.hood=h.slug;
    b.textContent=h.name;
    hoodRow.appendChild(b);
  });
  wireChips();
}
function wireChips(){
  document.querySelectorAll('.ev-chip').forEach(chip=>{
    if(chip._wired)return;chip._wired=true;
    chip.addEventListener('click',()=>{
      const row=chip.closest('.ev-filter-row');
      row.querySelectorAll('.ev-chip').forEach(c=>c.classList.remove('on'));
      chip.classList.add('on');
      if(chip.dataset.when!=null)filters.when=chip.dataset.when;
      if(chip.dataset.cat!=null)filters.cat=chip.dataset.cat;
      if(chip.dataset.hood!=null)filters.hood=chip.dataset.hood;
      if(chip.dataset.price!=null)filters.price=chip.dataset.price;
      render();
    });
  });
}

// ---- read URL params (so homepage "See all" links land pre-filtered) ----
function applyUrlParams(){
  const p=new URLSearchParams(location.search);
  const when=p.get('when');const hood=p.get('neighborhood');const cat=p.get('category');const q=p.get('search')||p.get('q');
  if(when){const b=document.querySelector(`[data-when="${when}"]`);if(b){document.querySelectorAll('#dateFilters .ev-chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');filters.when=when;}}
  if(hood){const b=document.querySelector(`[data-hood="${hood}"]`);if(b){document.querySelectorAll('#hoodFilters .ev-chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');filters.hood=hood;}}
  if(cat){const b=document.querySelector(`[data-cat="${cat.toLowerCase()}"]`);if(b){document.querySelectorAll('#catFilters .ev-chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');filters.cat=cat.toLowerCase();}}
  if(q){filters.q=q;const inp=document.getElementById('evSearch');if(inp)inp.value=q;}
}

// ---- load ----
async function load(){
  // neighborhood names
  try{const nh=await sb.from('neighborhoods').select('slug,display_name');(nh.data||[]).forEach(n=>{hoodName[n.slug]=n.display_name;});}catch(e){}
  const nowISO=new Date().toISOString();
  // internal events
  let evSel='id,title,start_time,venue_name_override,is_free,neighborhood_slug,cover_image_url,category,latitude,longitude,venues(name,lat,lng)';
  let ev=await sb.from('events').select(evSel).eq('status','published').gte('start_time',nowISO).order('start_time',{ascending:true}).limit(300);
  if(ev.error){
    // fallback if a column is missing
    ev=await sb.from('events').select('id,title,start_time,venue_name_override,is_free,neighborhood_slug,cover_image_url,venues(name,lat,lng)').eq('status','published').gte('start_time',nowISO).order('start_time',{ascending:true}).limit(300);
  }
  const internal=ev.data||[];
  // external events
  let external=[];
  try{
    const ex=await sb.from('external_events').select('*').eq('status','active').gte('start_time',nowISO).order('start_time',{ascending:true}).limit(300);
    external=(ex.data||[]).map(x=>({id:x.id,title:x.title,start_time:x.start_time,venue_name_override:x.venue_name||null,is_free:x.is_free,neighborhood_slug:x.neighborhood_slug||null,cover_image_url:x.cover_image_url||'',category:x.category||'',latitude:x.latitude,longitude:x.longitude,_external:true,_ticket_url:x.ticket_url||''}));
  }catch(e){}
  ALL=internal.concat(external).sort((a,b)=>new Date(a.start_time)-new Date(b.start_time));
  buildDynamicFilters();
  applyUrlParams();
  render();
}

// ---- search input ----
let searchTimer=null;
document.getElementById('evSearch').addEventListener('input',e=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{filters.q=e.target.value.trim();render();},180);
});

// ---- mobile map toggle ----
document.getElementById('mapToggle').addEventListener('click',()=>{document.getElementById('mapCol').classList.add('open');setTimeout(()=>map&&map.resize(),320);});
document.getElementById('mapClose').addEventListener('click',()=>document.getElementById('mapCol').classList.remove('open'));

// ---- go ----
initMap();
load();
</script>
