<style>
:root {
  --bg: #050508;
  --surface: #0f0f1c;
  --card: #1c1c30;
  --card-hover: #222238;
  --border: rgba(255,255,255,0.09);
  --border-mid: rgba(255,255,255,0.15);
  --orange: #FF6B35;
  --orange-soft: rgba(255,107,53,0.1);
  --orange-glow: rgba(255,107,53,0.22);
  --text: #eeeef8;
  --text-dim: #7878a0;
  --text-faint: #3a3a58;
  --green: #34d399;
  --gold: #fbbf24;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
a{text-decoration:none;color:inherit;}

/* NAV */
nav{position:sticky;top:0;z-index:200;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(8,8,16,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-logo{font-weight:800;font-size:16px;letter-spacing:-0.03em;text-transform:uppercase;}
.nav-logo span{color:var(--orange);}
.nav-center{display:flex;gap:2px;}
.nav-link{font-size:13px;font-weight:500;color:var(--text-dim);padding:6px 14px;border-radius:6px;transition:color 0.15s;}
.nav-link:hover{color:var(--text);}
.nav-link.active{color:var(--orange);}
.nav-right{display:flex;gap:10px;align-items:center;}
.nav-btn-ghost{font-size:12px;font-weight:600;color:var(--text-dim);padding:7px 14px;border-radius:7px;border:1px solid var(--border);background:none;cursor:pointer;font-family:var(--sans);transition:all 0.15s;}
.nav-btn-ghost:hover{color:var(--text);border-color:var(--border-mid);}
.nav-btn-primary{font-size:12px;font-weight:700;color:#fff;padding:7px 16px;border-radius:7px;background:var(--orange);border:none;cursor:pointer;font-family:var(--sans);transition:opacity 0.15s;}
.nav-btn-primary:hover{opacity:0.88;}

/* PAGE HEADER */
.page-head{padding:48px 32px 0;max-width:1280px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.page-eyebrow{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--orange);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.page-eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--orange);animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.page-title{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-0.03em;line-height:1.1;}
.page-count{font-size:13px;color:var(--text-dim);margin-top:6px;}

/* TOOLBAR */
.toolbar{max-width:1280px;margin:24px auto 0;padding:0 32px;display:flex;flex-direction:column;gap:14px;}
.search-bar{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 16px;height:46px;transition:border-color 0.15s;}
.search-bar:focus-within{border-color:var(--orange-glow);}
.search-icon{color:var(--text-faint);font-size:18px;flex-shrink:0;}
.search-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--sans);font-size:14px;}
.search-input::placeholder{color:var(--text-faint);}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;}
.filter-chip{font-size:12px;font-weight:600;padding:6px 14px;border-radius:100px;cursor:pointer;border:1px solid var(--border);background:none;color:var(--text-dim);font-family:var(--sans);transition:all 0.15s;white-space:nowrap;}
.filter-chip:hover{border-color:var(--border-mid);color:var(--text);}
.filter-chip.active{background:var(--orange);border-color:var(--orange);color:#fff;}

/* SORT ROW */
.sort-row{max-width:1280px;margin:16px auto 0;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.results-label{font-size:12px;color:var(--text-dim);font-family:var(--mono);}
.sort-select{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 12px;color:var(--text);font-family:var(--sans);font-size:12px;outline:none;cursor:pointer;}

/* LIST BANNER */
.list-banner{max-width:1280px;margin:20px auto 0;padding:0 32px;}
.list-banner-inner{background:linear-gradient(135deg,rgba(255,107,53,0.08),rgba(255,107,53,0.03));border:1px solid var(--orange-glow);border-radius:14px;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.list-banner-text{font-size:14px;font-weight:600;color:var(--text);}
.list-banner-text span{color:var(--orange);}
.list-banner-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.list-banner-btn{font-size:12px;font-weight:700;color:var(--orange);padding:7px 16px;border-radius:8px;border:1px solid var(--orange-glow);background:var(--orange-soft);white-space:nowrap;transition:all 0.15s;}
.list-banner-btn:hover{background:var(--orange);color:#fff;border-color:var(--orange);}

/* GRID */
.marketplace-grid{max-width:1280px;margin:24px auto 80px;padding:0 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}

/* VENDOR CARD */
.vendor-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:border-color 0.18s,transform 0.18s,box-shadow 0.18s;display:flex;flex-direction:column;animation:cardIn 0.35s ease both;}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.vendor-card:hover{border-color:rgba(255,107,53,0.3);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,0.4);background:var(--card-hover);}

.card-cover{height:140px;position:relative;overflow:hidden;background:linear-gradient(135deg,#0f0f22,#1a0e08);flex-shrink:0;}
.card-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.card-cover-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;opacity:0.35;}
.card-cover-gradient{position:absolute;inset:0;background:linear-gradient(to top,rgba(15,15,30,0.85) 0%,transparent 60%);}


.card-avatar-wrap{padding:0 20px;margin-top:-24px;margin-bottom:10px;position:relative;z-index:2;}
.card-avatar{width:48px;height:48px;border-radius:12px;border:2px solid var(--card);background:linear-gradient(135deg,var(--orange-soft),rgba(255,107,53,0.04));display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;}
.card-avatar img{width:100%;height:100%;object-fit:cover;}

.card-body{padding:0 20px 20px;flex:1;display:flex;flex-direction:column;gap:8px;}
.card-cat{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--orange);}
.card-name{font-size:15px;font-weight:700;letter-spacing:-0.02em;color:var(--text);line-height:1.3;}
.card-bio{font-size:12px;color:var(--text-dim);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;}
.card-tag{font-size:11px;padding:3px 9px;border-radius:100px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-dim);}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px;border-top:1px solid var(--border);}
.card-location{font-size:11px;color:var(--text-faint);}
.card-cta{font-size:11px;font-weight:700;color:var(--orange);padding:5px 12px;border-radius:6px;border:1px solid var(--orange-glow);background:var(--orange-soft);transition:all 0.15s;}
.vendor-card:hover .card-cta{background:var(--orange);color:#fff;border-color:var(--orange);}

/* STATES */
.grid-loading{grid-column:1/-1;display:flex;align-items:center;justify-content:center;padding:80px;gap:12px;color:var(--text-dim);font-size:13px;}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin 0.75s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.grid-empty{grid-column:1/-1;text-align:center;padding:80px 20px;}
.grid-empty-icon{font-size:40px;margin-bottom:14px;opacity:0.4;}
.grid-empty-title{font-size:16px;font-weight:700;margin-bottom:6px;}
.grid-empty-sub{font-size:13px;color:var(--text-dim);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);animation:fadeIn 0.15s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border:1px solid var(--border-mid);border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;animation:slideUp 0.2s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.modal-cover{height:180px;position:relative;overflow:hidden;background:linear-gradient(135deg,#0f0f22,#1a0e08);}
.modal-cover img{width:100%;height:100%;object-fit:cover;}
.modal-cover-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:60px;opacity:0.25;}
.modal-close{position:absolute;top:14px;right:14px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.1);color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;line-height:1;}
.modal-body{padding:24px;}
.modal-avatar-row{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;}
.modal-avatar{width:56px;height:56px;border-radius:14px;border:2px solid var(--border-mid);background:var(--orange-soft);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;flex-shrink:0;}
.modal-avatar img{width:100%;height:100%;object-fit:cover;}
.modal-cat{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--orange);margin-bottom:3px;}
.modal-name{font-size:20px;font-weight:800;letter-spacing:-0.03em;margin-bottom:4px;}
.modal-bio{font-size:13px;color:var(--text-dim);line-height:1.65;margin-bottom:18px;}
.modal-section-label{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;}
.modal-services{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
.modal-service{font-size:12px;padding:4px 11px;border-radius:100px;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text-dim);}
.modal-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.modal-social{font-size:12px;font-weight:600;color:var(--text-dim);padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,0.03);transition:all 0.15s;}
.modal-social:hover{color:var(--text);border-color:var(--border-mid);}
.modal-cta{display:block;text-align:center;padding:13px;background:var(--orange);color:#fff;font-weight:700;font-size:14px;border-radius:10px;border:none;cursor:pointer;font-family:var(--sans);transition:opacity 0.15s;width:100%;}
.modal-cta:hover{opacity:0.88;}
.modal-cta-sub{text-align:center;font-size:11px;color:var(--text-faint);margin-top:10px;}

/* RESPONSIVE */
@media(max-width:860px){
  nav{padding:0 20px;}
  .nav-center{display:none;}
  .page-head,.toolbar,.sort-row,.marketplace-grid,.list-banner{padding-left:20px;padding-right:20px;}
  .marketplace-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}
}
@media(max-width:560px){
  .marketplace-grid{grid-template-columns:1fr;}
  .page-head{flex-direction:column;align-items:flex-start;}
}

/* ── STANDARD NAV ── */
nav.site-nav{display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:62px;border-bottom:1px solid rgba(255,255,255,0.07);position:sticky;top:0;background:rgba(8,8,16,0.96);backdrop-filter:blur(14px);z-index:200;}
.site-nav .nav-logo{font-family:'DM Sans',sans-serif;font-size:19px;font-weight:900;text-decoration:none;color:#f0f0fa;letter-spacing:-0.05em;text-transform:uppercase;}
.site-nav .nav-logo span{color:#FF6B35;}
.site-nav .nav-links{display:flex;gap:4px;align-items:center;}
.site-nav .nav-link{background:none;border:none;color:#7070a0;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;padding:7px 13px;border-radius:7px;transition:color 0.15s,background 0.15s;}
.site-nav .nav-link:hover{color:#f0f0fa;background:rgba(255,255,255,0.05);}
.site-nav .nav-link.active{color:#f0f0fa;}
.site-nav .nav-right{display:flex;gap:8px;align-items:center;}
.site-nav .nav-btn-ghost{font-size:12px;font-weight:600;color:#7070a0;padding:7px 14px;border-radius:7px;border:1px solid rgba(255,255,255,0.1);background:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;text-decoration:none;display:inline-flex;align-items:center;}
.site-nav .nav-btn-ghost:hover{color:#f0f0fa;border-color:rgba(255,255,255,0.2);}
.site-nav .nav-btn-primary{font-size:12px;font-weight:700;color:#fff;padding:7px 16px;border-radius:7px;background:#FF6B35;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity 0.15s;text-decoration:none;display:inline-flex;align-items:center;}
.site-nav .nav-btn-primary:hover{opacity:0.88;}
/* Hamburger */
.site-nav .nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px;background:none;border:none;z-index:210;}
.site-nav .nav-hamburger span{display:block;width:22px;height:2px;background:#f0f0fa;border-radius:2px;transition:all 0.3s ease;}
.site-nav .nav-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.site-nav .nav-hamburger.open span:nth-child(2){opacity:0;}
.site-nav .nav-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
/* Mobile overlay */
.site-mobile-menu{display:none;position:fixed;inset:0;background:rgba(8,8,16,0.99);backdrop-filter:blur(20px);z-index:205;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:80px 24px 40px;}
.site-mobile-menu.open{display:flex;}
.site-mobile-menu .nav-mobile-link{font-family:'DM Sans',sans-serif;font-size:26px;font-weight:800;color:#f0f0fa;text-decoration:none;padding:12px 24px;border-radius:12px;transition:color 0.2s;text-align:center;width:100%;cursor:pointer;border:none;background:none;letter-spacing:-0.03em;}
.site-mobile-menu .nav-mobile-link:hover,.site-mobile-menu .nav-mobile-link.active{color:#FF6B35;}
.site-mobile-menu .nav-mobile-divider{width:40px;height:1px;background:rgba(255,255,255,0.1);margin:6px 0;}
.site-mobile-menu .nav-mobile-cta{margin-top:8px;background:#FF6B35 !important;color:#fff !important;border-radius:12px;padding:14px 32px !important;font-size:16px !important;}
@media(max-width:700px){
  nav.site-nav{padding:0 18px;}
  .site-nav .nav-hamburger{display:flex;}
  .site-nav .nav-links,.site-nav .nav-right{display:none !important;}
  html,body{overflow-x:hidden;}
}

/* ── FEATURED SECTION ── */
.featured-section{max-width:1280px;margin:0 auto;padding:32px 32px 0;}
.featured-label{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--orange);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.featured-label::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--orange);animation:blink 2s ease-in-out infinite;}
.featured-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-bottom:32px;}
.featured-card{background:var(--card);border:1px solid rgba(255,107,53,0.2);border-radius:20px;overflow:hidden;cursor:pointer;transition:all 0.2s;position:relative;}
.featured-card:hover{border-color:rgba(255,107,53,0.5);transform:translateY(-4px);box-shadow:0 16px 48px rgba(0,0,0,0.5);}
.featured-badge{position:absolute;top:12px;left:12px;background:rgba(255,107,53,0.9);color:#fff;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;border-radius:100px;backdrop-filter:blur(8px);}
@media(max-width:560px){
  .featured-section{padding:20px 20px 0;}
  .featured-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="site-mobile-menu" id="siteMobileMenu">

  </div>
</div>

  <div class="featured-grid" id="featuredGrid"></div>

<script>

const SVC = {
  photography:'Photography',videography:'Videography',dj:'DJ Services',
  live_music:'Live Music',catering:'Catering',bartending:'Bartending',
  event_staffing:'Event Staffing',security:'Security',florist:'Florals & Decor',

  planning:'Event Planning',rentals:'Rentals',printing:'Printing & Signage',merch:'Merch & Apparel',

const ICONS = {
  photography:'📸',videography:'🎥',dj:'🎵',live_music:'🎸',catering:'🍽',
  bartending:'🍹',event_staffing:'👥',security:'🛡',florist:'🌸',hair_makeup:'💄',

const tRank = v => v.is_featured?-1:0;

let all=[], activeFilter='all', searchQuery='', sortMode='tier';

function filtered(){
  return all.filter(v=>{
    if(searchQuery){
      const q=searchQuery.toLowerCase();
      const haystack=[v.business_name,v.name,v.description,...(v.services||[]),v.category].join(' ').toLowerCase();
      if(!haystack.includes(q))return false;
    }
    if(activeFilter!=='all'){
      const svcs=(v.services||[]).map(s=>s.toLowerCase());
      const cat=(v.category||'').toLowerCase();
      if(!svcs.includes(activeFilter)&&!cat.includes(activeFilter)&&!svcs.some(s=>s.includes(activeFilter)))return false;
    }
    return true;
  }).sort((a,b)=>{
    if(sortMode==='tier')return tRank(a)-tRank(b)||new Date(b.created_at||0)-new Date(a.created_at||0);
    if(sortMode==='name')return(a.business_name||a.name||'').localeCompare(b.business_name||b.name||'');
    return new Date(b.created_at||0)-new Date(a.created_at||0);
  });
}

function render(){
  const list=filtered();
  document.getElementById('resultCount').textContent=`${all.length} vendors on the platform`;
  document.getElementById('sortLabel').textContent=`${list.length} result${list.length!==1?'s':''}`;

  // Featured section
  const featuredSection=document.getElementById('featuredSection');
  const featuredGrid=document.getElementById('featuredGrid');
  const showFeatured=activeFilter==='all'&&!searchQuery;
  const featured=all.filter(v=>v.is_featured);
  if(showFeatured&&featured.length){
    featuredSection.style.display='';
    featuredGrid.innerHTML=featured.map((v,i)=>card(v,i,true)).join('');
  } else {
    featuredSection.style.display='none';
  }

  const grid=document.getElementById('vendorGrid');
  if(!list.length){
    grid.innerHTML=`<div class="grid-empty"><div class="grid-empty-icon">🔍</div><div class="grid-empty-title">No vendors found</div><div class="grid-empty-sub">Try a different search or category</div></div>`;
    return;
  }
  grid.innerHTML=list.map((v,i)=>card(v,i)).join('');
}

function card(v,i,isFeaturedSection=false){
  const rawName=v.business_name||v.name||v.email||'Columbus Vendor';
  const name=rawName.includes('@')?rawName.split('@')[0]:rawName;
  const svcs=(v.services||[]).slice(0,3);
  const icon=ICONS[svcs[0]]||ICONS[v.category]||'⭐';
  const cat=v.category||SVC[svcs[0]]||'Vendor';
  const delay=Math.min(i*35,400);
  const featuredBadge=isFeaturedSection&&v.is_featured?`<div class="featured-badge">⭐ Featured</div>`:'';
  const cardClass=isFeaturedSection?'featured-card':'vendor-card';
  const cover=v.cover_image_url?`<img src="${v.cover_image_url}" alt="${name}" loading="lazy">`:`<div class="card-cover-placeholder">${icon}</div>`;
  const avatar=v.profile_image_url?`<img src="${v.profile_image_url}" alt="${name}">`:`${icon}`;
  const tags=svcs.length?`<div class="card-tags">${svcs.map(s=>`<span class="card-tag">${SVC[s]||s}</span>`).join('')}</div>`:'';
  return `<div class="${cardClass}" style="animation-delay:${delay}ms" onclick="openModal('${v.id}')">
    <div class="card-cover">${cover}<div class="card-cover-gradient"></div>${featuredBadge}</div>
    <div class="card-avatar-wrap"><div class="card-avatar">${avatar}</div></div>
    <div class="card-body">
      <div class="card-cat">${cat}</div>
      <div class="card-name">${name}</div>
      ${v.description?`<div class="card-bio">${v.description}</div>`:''}
      ${tags}
      <div class="card-footer"><div class="card-location">📍 Columbus, OH</div><div class="card-cta">View Profile</div></div>
    </div>
  </div>`;
}

      const {data:{session}}=await sb.auth.getSession();
      await sb.from('vendor_profile_views').insert({
        vendor_id:id,
        viewer_id:session?.user?.id||null,
        viewer_role:session?.user?.id?(await sb.from('user_roles').select('role').eq('user_id',session.user.id).limit(1).maybeSingle()).data?.role||'customer':null,
        source: document.referrer.includes('search')?'search':'vendors_page',

  const rawName=v.business_name||v.name||v.email||'Columbus Vendor';

  const svcs=v.services||[];
  const icon=ICONS[svcs[0]]||ICONS[v.category]||'⭐';
  const cat=v.category||SVC[svcs[0]]||'Vendor';
  const cover=v.cover_image_url?`<img src="${v.cover_image_url}" alt="${name}">`:`<div class="modal-cover-placeholder">${icon}</div>`;
  const avatar=v.profile_image_url?`<img src="${v.profile_image_url}" alt="${name}">`:`${icon}`;
  const socials=[v.instagram&&`<a class="modal-social" href="https://instagram.com/${v.instagram.replace('@','')}" target="_blank">Instagram</a>`,v.tiktok&&`<a class="modal-social" href="https://tiktok.com/@${v.tiktok.replace('@','')}" target="_blank">TikTok</a>`,v.website&&`<a class="modal-social" href="${v.website}" target="_blank">Website</a>`].filter(Boolean).join('');
  document.getElementById('modalContainer').innerHTML=`
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-cover">${cover}<button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="modal-avatar-row">
          <div class="modal-avatar">${avatar}</div>
          <div>
            <div class="modal-cat">${cat}</div>
            <div class="modal-name">${name}</div>
            ${v.years_in_business?`<div style="font-size:11px;color:var(--text-dim);margin-top:2px">${v.years_in_business} year${v.years_in_business>1?'s':''} in business</div>`:''}
          </div>
        </div>
        ${v.description?`<p class="modal-bio">${v.description}</p>`:''}
        ${svcs.length?`<div class="modal-section-label">Services</div><div class="modal-services">${svcs.map(s=>`<span class="modal-service">${SVC[s]||s}</span>`).join('')}</div>`:''}
        ${socials?`<div class="modal-section-label">Links</div><div class="modal-links">${socials}</div>`:''}
        <button class="modal-cta" onclick="goToInquiry('${v.id}')">Send Inquiry</button>
        <div class="modal-cta-sub">Sign in or create a free account to send an inquiry</div>
      </div>
    </div>
  </div>`;
}

async function submitVendorBooking(vendorId){
  const date=document.getElementById('bkDate')?.value;
  const status=document.getElementById('bkStatus');
  if(!date){if(status){status.textContent='Please select an event date.';status.style.color='#f87171';}return;}
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  const btn=document.querySelector('#bookingForm button');
  if(btn){btn.textContent='Sending...';btn.disabled=true;}
  const {error}=await sb.from('vendor_booking_requests').insert({
    vendor_id:vendorId,
    organizer_id:session.user.id,
    organizer_name:session.user.user_metadata?.full_name||session.user.email.split('@')[0],
    organizer_email:session.user.email,
    event_date:date,
    event_type:document.getElementById('bkType')?.value||null,
    guest_count:parseInt(document.getElementById('bkGuests')?.value)||null,
    location:document.getElementById('bkLocation')?.value||null,
    budget_range:document.getElementById('bkBudget')?.value||null,
    message:document.getElementById('bkMsg')?.value||null,
  });
  if(error){
    if(status){status.textContent='Error sending request. Please try again.';status.style.color='#f87171';}
    if(btn){btn.textContent='Send Booking Request →';btn.disabled=false;}
    return;
  }
  document.getElementById('bookingForm').innerHTML=`
  <div style="text-align:center;padding:24px 0">
    <div style="font-size:32px;margin-bottom:12px">✓</div>
    <div style="font-weight:800;font-size:16px;margin-bottom:6px">Request Sent!</div>
    <div style="font-size:13px;color:var(--text-dim)">The vendor will review your request and respond soon.</div>
  </div>`;
}
function setFilter(cat,btn){activeFilter=cat;document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function handleSearch(val){searchQuery=val.trim();render();}
function handleSort(val){sortMode=val;render();}

window.setFilter=setFilter;window.handleSearch=handleSearch;window.handleSort=handleSort;window.openModal=openModal;window.closeModal=closeModal;window.goToInquiry=goToInquiry;

(async()=>{
  const{data,error}=await sb.from('vendors').select('id,business_name,name,category,services,description,cover_image_url,profile_image_url,instagram,tiktok,website,years_in_business,created_at,is_featured').limit(100);
  if(error){
    console.error('Vendor load error:',error);
    // Try simpler query as fallback - RLS may be restricting columns
    const{data:d2,error:e2}=await sb.from('vendors').select('*').limit(100);
    if(e2||!d2?.length){
      document.getElementById('vendorGrid').innerHTML=`<div class="grid-empty"><div class="grid-empty-title">No vendors listed yet</div><div class="grid-empty-sub">Be the first - <a href="https://cbusevents.com/signup.html?role=vendor" style="color:var(--orange)">list your business →</a></div></div>`;
      document.getElementById('resultCount').textContent='0 vendors on the platform';
      return;
    }
    all=(d2||[]).filter(v=>v.business_name||v.name);
    render();return;
  }
  all=(data||[]);
  render();
})();
</script>

<script>
(function(){
  var btn=document.getElementById('siteNavHamburger');
  var menu=document.getElementById('siteMobileMenu');
  if(!btn||!menu)return;
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    btn.classList.toggle('open');
    menu.classList.toggle('open');
    document.body.style.overflow=menu.classList.contains('open')?'hidden':'';
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){btn.classList.remove('open');menu.classList.remove('open');document.body.style.overflow='';}
  });
  menu.querySelectorAll('.nav-mobile-link,.nav-mobile-cta').forEach(function(a){
    a.addEventListener('click',function(){
      btn.classList.remove('open');menu.classList.remove('open');document.body.style.overflow='';
    });
  });
})();
</script>
