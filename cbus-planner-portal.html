<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CBUSEVENTS — Planner Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#080810;--surface:#0f0f1a;--card:#141420;--card-hover:#18182a;
  --border:#1e1e2e;--border-sub:#191928;
  --text:#f0f0fa;--sub:#7070a0;--muted:#40405a;
  --orange:#FF6B35;--green:#34d399;--red:#f87171;--blue:#818cf8;--gold:#fbbf24;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;font-family:'DM Sans',sans-serif;border:none;}
input,textarea,select{font-family:'DM Sans',sans-serif;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(11,11,15,0.95);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:60px;}
.nav-logo{font-family:'DM Sans',sans-serif;font-weight:800;font-size:18px;cursor:pointer;}
.nav-logo span{color:var(--orange);}
.nav-logo-sub{font-size:10px;color:var(--muted);font-weight:400;margin-left:6px;letter-spacing:1px;text-transform:uppercase;}
.nav-links{display:flex;gap:4px;}
.nav-btn{background:none;border:none;color:var(--sub);font-size:13px;padding:7px 14px;border-radius:8px;font-weight:500;transition:all 0.15s;}
.nav-btn:hover,.nav-btn.active{background:var(--card);color:var(--text);}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-user{font-size:13px;color:var(--sub);}
.nav-cta{background:var(--orange);color:#fff;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:700;transition:opacity 0.15s;}
.nav-cta:hover{opacity:0.85;}
.nav-outline{background:transparent;color:var(--text);border:1.5px solid var(--border);padding:7px 16px;border-radius:8px;font-size:13px;font-weight:500;transition:all 0.15s;}
.nav-outline:hover{border-color:var(--muted);}

/* HERO */
.planner-hero{background:linear-gradient(135deg,#130800 0%,#1a1000 40%,#0b0b0f 100%);border-bottom:1px solid var(--border);padding:56px 40px;text-align:center;}
.planner-hero h1{font-family:'DM Sans',sans-serif;font-size:clamp(28px,4vw,48px);font-weight:800;margin-bottom:12px;}
.planner-hero h1 span{color:var(--orange);}
.planner-hero p{color:var(--sub);font-size:16px;max-width:500px;margin:0 auto 28px;line-height:1.65;}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

/* LAYOUT */
.page{padding:36px 40px;animation:fadeUp 0.3s ease;max-width:1100px;margin:0 auto;}
.section-title{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:800;margin-bottom:6px;}
.section-sub{color:var(--sub);font-size:13px;margin-bottom:24px;}

/* STAT CARDS */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.stat-num{font-family:'DM Sans',sans-serif;font-size:26px;font-weight:800;margin-bottom:3px;}
.stat-label{font-size:12px;color:var(--sub);}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;}
.card-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.card-title{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;}
.card-body{padding:20px;}

/* VENUE GRID */
.venue-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.venue-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all 0.2s;}
.venue-card:hover{border-color:var(--orange);transform:translateY(-2px);}
.venue-card-img{width:100%;height:150px;object-fit:cover;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:36px;}
.venue-card-img img{width:100%;height:100%;object-fit:cover;}
.venue-card-body{padding:14px 16px;}
.venue-card-type{font-size:11px;color:var(--orange);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
.venue-card-name{font-family:'DM Sans',sans-serif;font-weight:700;font-size:16px;margin-bottom:6px;}
.venue-card-desc{color:var(--sub);font-size:12px;line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.venue-card-footer{display:flex;justify-content:space-between;align-items:center;}
.venue-card-loc{font-size:11px;color:var(--muted);}

/* INQUIRY ITEMS */
.inquiry-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer;transition:border-color 0.2s;}
.inquiry-item:hover{border-color:var(--muted);}
.inq-venue{font-weight:600;font-size:14px;margin-bottom:3px;}
.inq-meta{font-size:12px;color:var(--sub);}

/* EVENT ITEMS */
.event-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:16px;}
.event-title{font-weight:600;font-size:14px;margin-bottom:3px;}
.event-meta{font-size:12px;color:var(--sub);}

/* BADGES */
.badge{display:inline-flex;align-items:center;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;}
.badge-green{background:#22c55e20;color:var(--green);border:1px solid #22c55e30;}
.badge-orange{background:#FF6B3520;color:var(--orange);border:1px solid #FF6B3530;}
.badge-blue{background:#60a5fa20;color:var(--blue);border:1px solid #60a5fa30;}
.badge-muted{background:var(--surface);color:var(--muted);border:1px solid var(--border);}

/* BUTTONS */
.btn{border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:'DM Sans',sans-serif;}
.btn-primary{background:var(--orange);color:#fff;}
.btn-primary:hover{opacity:0.85;}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--muted);}
.btn-ghost{background:var(--surface);color:var(--sub);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);}
.btn-sm{padding:5px 12px;font-size:12px;}

/* FORM */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--sub);font-weight:500;margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 13px;color:var(--text);font-size:14px;outline:none;transition:border-color 0.2s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);}
.field textarea{min-height:90px;resize:vertical;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* SEARCH */
.search-bar{display:flex;gap:10px;margin-bottom:20px;}
.search-wrap{flex:1;position:relative;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);}
.search-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 14px 11px 38px;color:var(--text);font-size:14px;outline:none;transition:border-color 0.2s;}
.search-input:focus{border-color:var(--orange);}
.filter-select{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:13px;outline:none;min-width:140px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:580px;animation:fadeUp 0.3s ease;}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border);}
.modal-title{font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700;}
.modal-body{padding:24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

/* AUTH */
.auth-wrap{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:40px;width:100%;max-width:420px;}
.auth-logo{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:800;margin-bottom:4px;}
.auth-logo span{color:var(--orange);}
.auth-tabs{display:flex;gap:4px;background:var(--surface);border-radius:10px;padding:4px;margin-bottom:24px;}
.auth-tab{flex:1;padding:8px;border-radius:7px;font-size:13px;font-weight:600;color:var(--sub);background:none;border:none;cursor:pointer;transition:all 0.15s;}
.auth-tab.active{background:var(--card);color:var(--text);}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--sub);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty h3{font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700;margin-bottom:6px;color:var(--text);}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;z-index:999;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;font-weight:500;animation:fadeUp 0.3s ease;box-shadow:0 8px 32px rgba(0,0,0,0.4);display:none;}
.toast.success{border-color:#22c55e40;color:var(--green);}
.toast.error{border-color:#ef444440;color:#ef4444;}

@media(max-width:700px){
 nav{padding:0 16px;}
 .page{padding:24px 16px;}
 .planner-hero{padding:36px 16px;}
 .stat-row{grid-template-columns:1fr 1fr;}
 .venue-grid{grid-template-columns:1fr;}
 .field-row{grid-template-columns:1fr;}
}

/* ── MOBILE PORTAL ── */
@media(max-width:680px){
  html,body{overflow-x:hidden;}
  .portal-nav{padding:0 16px !important;height:54px !important;}
  .portal-sidebar{display:none !important;}
  .portal-main{margin-left:0 !important;padding:16px !important;}
  .portal-content{padding:16px !important;}
  .stats-grid{grid-template-columns:1fr 1fr !important;gap:10px !important;}
  .modal-inner,.modal-box{width:calc(100vw - 32px) !important;max-width:100% !important;margin:16px !important;}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .form-row{grid-template-columns:1fr !important;}
  .grid-2,.grid-3{grid-template-columns:1fr !important;}
  .card-grid{grid-template-columns:1fr !important;}
  .btn-row{flex-direction:column !important;}
  input,select,textarea{font-size:16px !important;}
  .page-header{padding:16px !important;}
  .section-pad{padding:16px !important;}
}
@media(max-width:900px){
  .portal-sidebar{width:200px !important;}
}


/* ── ADA COMPLIANCE ── */
.skip-link{position:absolute;top:-100px;left:8px;background:#FF6B35;color:#fff;padding:8px 16px;border-radius:0 0 8px 8px;font-weight:700;font-size:14px;z-index:99999;text-decoration:none;transition:top 0.2s;}
.skip-link:focus{top:0;}
*:focus-visible{outline:2px solid #FF6B35;outline-offset:3px;border-radius:4px;}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}}
</style>
<style>
*{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
body{font-family:'DM Sans',sans-serif;}
h1,h2,h3,h4,h5,h6{font-family:'DM Sans',sans-serif;letter-spacing:-0.02em;}
.nav-logo,.auth-logo,.login-logo,.sidebar-logo-text{font-family:'DM Sans',sans-serif!important;font-weight:800!important;letter-spacing:-0.04em!important;text-transform:uppercase;}
.nav-logo span,.auth-logo span,.login-logo span,.sidebar-logo-text span{color:#FF6B35;}

/* ── CBUSEVENTS DESIGN SYSTEM UPGRADE ─────────────────────── */
:root{
  --bg:#080810 !important;
  --surface:#0f0f1a !important;
  --card:#141420 !important;
  --card-hover:#18182a !important;
  --border:#1e1e2e !important;
  --border-sub:#191928 !important;
  --text:#f0f0fa !important;
  --sub:#7070a0 !important;
  --muted:#40405a !important;
  --orange:#FF6B35 !important;
  --green:#34d399 !important;
  --red:#f87171 !important;
  --blue:#818cf8 !important;
  --gold:#fbbf24 !important;
  --font:'DM Sans',sans-serif !important;
  --mono:'DM Mono',monospace !important;
}
*{ -webkit-font-smoothing:antialiased; }
body{ font-family:'DM Sans',sans-serif !important; background:var(--bg) !important; color:var(--text) !important; }
h1,h2,h3,h4,h5,h6{ font-family:'DM Sans',sans-serif !important; letter-spacing:-0.02em; }

/* Stat cards — monospace numbers, hover lift, accent bar */
.stat-card{
  background:var(--card) !important; border:1px solid var(--border) !important;
  border-radius:16px !important; padding:22px 24px 20px !important;
  position:relative; overflow:hidden; transition:all 0.2s !important;
}
.stat-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,transparent,var(--orange),transparent);
  opacity:0; transition:opacity 0.2s;
}
.stat-card:hover{ background:var(--card-hover) !important; transform:translateY(-1px) !important; border-color:rgba(255,255,255,0.08) !important; }
.stat-card:hover::before{ opacity:1; }
.stat-num,.stat-card-num,.stat-value{
  font-family:'DM Mono',monospace !important;
  font-size:32px !important; font-weight:500 !important;
  line-height:1 !important; letter-spacing:-0.02em !important; margin-bottom:6px !important;
}
.stat-label,.stat-card-label{ font-size:13px !important; color:var(--sub) !important; font-weight:500 !important; }
.stat-sub,.stat-card-sub,.stat-meta{ font-size:11px !important; color:var(--muted) !important; margin-top:8px !important; }

/* Sidebar nav — orange left-border active indicator */
.sidebar,.portal-sidebar{ background:var(--surface) !important; border-right:1px solid var(--border) !important; }
.nav-item{
  border-left:2px solid transparent !important;
  border-radius:10px !important; transition:all 0.18s !important;
  padding:8px 14px 8px 18px !important; margin:1px 8px !important;
  font-size:13px !important; font-weight:500 !important; color:var(--sub) !important;
}
.nav-item:hover{ background:rgba(255,255,255,0.04) !important; color:var(--text) !important; border-left-color:var(--muted) !important; }
.nav-item.active{
  background:linear-gradient(135deg,rgba(255,107,53,0.1),rgba(255,107,53,0.04)) !important;
  color:var(--text) !important; border-left-color:var(--orange) !important; font-weight:600 !important;
}

/* Topbar / nav */
.portal-nav,.nav-bar,.topbar{
  background:rgba(8,8,16,0.88) !important;
  -webkit-backdrop-filter:blur(20px) !important; backdrop-filter:blur(20px) !important;
  border-bottom:1px solid var(--border) !important;
}

/* Cards / panels */
.card,.panel,.card-section{
  background:var(--card) !important; border:1px solid var(--border) !important;
  border-radius:16px !important;
}
.card-header,.panel-header{ border-bottom:1px solid var(--border-sub) !important; }
.card-title,.panel-title{ font-size:15px !important; font-weight:700 !important; letter-spacing:-0.02em !important; }

/* Buttons */
.btn,.btn-primary,.btn-orange{
  font-family:'DM Sans',sans-serif !important; font-weight:700 !important;
  letter-spacing:0.02em !important; border-radius:9px !important; border:none !important;
  transition:all 0.18s !important; cursor:pointer !important;
}
.btn-primary,.btn-orange{ background:var(--orange) !important; color:#fff !important; }
.btn-primary:hover,.btn-orange:hover{ opacity:0.9 !important; box-shadow:0 4px 20px rgba(255,107,53,0.3) !important; }
.btn-ghost{ background:rgba(255,255,255,0.04) !important; color:var(--sub) !important; border:1px solid var(--border) !important; }
.btn-ghost:hover{ color:var(--text) !important; background:rgba(255,255,255,0.07) !important; }
.btn-outline{ background:transparent !important; border:1.5px solid var(--border) !important; color:var(--text) !important; }
.btn-outline:hover{ border-color:var(--muted) !important; }

/* Badges */
.badge{ border-radius:20px !important; padding:3px 10px !important; font-size:10px !important; font-weight:700 !important; letter-spacing:0.04em !important; }
.badge-green{ background:rgba(52,211,153,0.1) !important; color:var(--green) !important; border:1px solid rgba(52,211,153,0.2) !important; }
.badge-orange{ background:rgba(255,107,53,0.12) !important; color:var(--orange) !important; border:1px solid rgba(255,107,53,0.2) !important; }
.badge-blue{ background:rgba(129,140,248,0.1) !important; color:var(--blue) !important; border:1px solid rgba(129,140,248,0.2) !important; }
.badge-gold{ background:rgba(251,191,36,0.1) !important; color:var(--gold) !important; border:1px solid rgba(251,191,36,0.2) !important; }
.badge-muted{ background:rgba(255,255,255,0.04) !important; color:var(--muted) !important; border:1px solid var(--border) !important; }

/* Forms */
input,textarea,select{
  background:rgba(255,255,255,0.04) !important; border:1px solid var(--border) !important;
  border-radius:9px !important; color:var(--text) !important;
  font-family:'DM Sans',sans-serif !important;
}
input:focus,textarea:focus,select:focus{
  border-color:rgba(255,107,53,0.5) !important;
  background:rgba(255,255,255,0.06) !important;
  box-shadow:0 0 0 3px rgba(255,107,53,0.08) !important;
  outline:none !important;
}

/* Auth / Login */
.auth-card,.login-card,.auth-wrap > div{
  background:var(--card) !important; border:1px solid var(--border) !important;
  border-radius:20px !important; box-shadow:0 32px 80px rgba(0,0,0,0.5) !important;
}
.auth-tabs{ border-bottom:1px solid var(--border-sub) !important; background:transparent !important; }
.auth-tab{ font-family:'DM Sans',sans-serif !important; font-weight:600 !important; color:var(--muted) !important; border-bottom:2px solid transparent !important; }
.auth-tab.active{ color:var(--orange) !important; border-bottom-color:var(--orange) !important; }
.auth-logo,.login-logo,.nav-logo{
  font-family:'DM Sans',sans-serif !important; font-weight:900 !important;
  letter-spacing:-0.05em !important; text-transform:uppercase !important;
}

/* Tables */
th{ font-size:10px !important; color:var(--muted) !important; font-weight:700 !important; text-transform:uppercase !important; letter-spacing:0.1em !important; border-bottom:1px solid var(--border-sub) !important; }
td{ border-bottom:1px solid rgba(255,255,255,0.03) !important; font-size:13px !important; }
tr:hover td{ background:rgba(255,255,255,0.02) !important; }

/* Modals */
.modal,.modal-box,.modal-inner{
  background:var(--card) !important; border:1px solid var(--border) !important;
  border-radius:20px !important; box-shadow:0 24px 80px rgba(0,0,0,0.6) !important;
}
.modal-overlay{ -webkit-backdrop-filter:blur(8px) !important; backdrop-filter:blur(8px) !important; }

/* Toast */
.toast{ background:var(--card) !important; border:1px solid var(--border) !important; border-radius:12px !important; font-family:'DM Sans',sans-serif !important; }
.toast-success,.toast.success{ border-color:rgba(52,211,153,0.3) !important; color:var(--green) !important; }
.toast-error,.toast.error{ border-color:rgba(248,113,113,0.3) !important; color:var(--red) !important; }

/* Logo accent bar in sidebar */
.sidebar-logo,.logo-wrap{ position:relative !important; }
.sidebar-logo::after,.logo-wrap::after{
  content:'' !important; position:absolute !important; bottom:0 !important; left:22px !important; right:22px !important;
  height:1px !important; background:linear-gradient(90deg,var(--orange),transparent) !important; opacity:0.4 !important;
}
/* ── END DESIGN SYSTEM ─────────────────────────────────────── */

/* ── PORTAL MOBILE BOTTOM NAV ── */
.portal-mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:300;padding-bottom:env(safe-area-inset-bottom);}
.portal-mobile-nav-inner{display:flex;align-items:stretch;height:58px;padding:0 4px;}
.pmn-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--sub);font-size:9px;font-weight:600;transition:color 0.15s;padding:4px 2px;font-family:'DM Sans',sans-serif;letter-spacing:0.02em;text-transform:uppercase;}
.pmn-btn.active{color:#FF6B35;}

async function handleBoostReturn(){
 const p=new URLSearchParams(window.location.search);
 const ref=p.get('client_reference_id')||'';
 if(!ref.startsWith('boost_'))return;
 window.history.replaceState({},'',window.location.pathname);
 const parts=ref.split('_'); // boost_EVENTID_TIER
 const eventId=parts[1];
 const tier=parts[2]; // '7' or '30'
 if(!eventId||!tier)return;
 const days=parseInt(tier);
 const until=new Date();
 until.setDate(until.getDate()+days);
 const{error}=await sb.from('events').update({
 promoted_until:until.toISOString(),
 boost_tier:tier
 }).eq('id',eventId);
 if(!error) toast(` Event boosted for ${days} days!`);
}

async function submitPendingVenueBooking(venueId){
  const date=document.getElementById('pbDate')?.value;
  const status=document.getElementById('pbStatus');
  if(!date){if(status){status.textContent='Please select a date.';status.style.color='var(--red)';}return;}
  const btn=document.querySelector('.card .btn-primary');
  if(btn){btn.textContent='Sending...';btn.disabled=true;}
  const {error}=await sb.from('booking_requests').insert({
    venue_id:venueId,
    planner_id:currentUser.id,
    planner_name:currentUser.user_metadata?.full_name||currentUser.email.split('@')[0],
    planner_email:currentUser.email,
    event_date:date,
    event_type:document.getElementById('pbType')?.value||null,
    guest_count:parseInt(document.getElementById('pbGuests')?.value)||null,
    message:document.getElementById('pbMsg')?.value||null,
  });
  if(error){
    if(status){status.textContent='Error sending. Please try again.';status.style.color='var(--red)';}
    if(btn){btn.textContent='Send Booking Request →';btn.disabled=false;}
    return;
  }
  if(status){status.textContent='Request sent! The venue will respond soon.';status.style.color='var(--green)';}
  setTimeout(()=>nav('dashboard'),2000);
}

async function startConnectOnboard(){
  toast('Redirecting to Stripe setup...');
  try{

      headers:{'Content-Type':'application/json','Authorization':'Bearer '+await getAuthToken()},
      body:JSON.stringify({action:'onboard'})

    const data=await res.json();
    if(data.url) window.location.href=data.url;
    else toast('Error: '+data.error);
  }catch(e){toast('Error connecting to Stripe');}

async function loadInboxConversations(uid){
  const {data:convos}=await sb.from('conversations').select('*')
    .or('participant_a.eq.'+uid+',participant_b.eq.'+uid)
    .eq('status','active').order('last_message_at',{ascending:false});
  _inboxConvos=convos||[];
  const {data:reqs}=await sb.from('message_requests').select('*,conversations(*)')
    .eq('recipient_id',uid).eq('status','pending');
  _inboxRequests=reqs||[];
  let unread=0;
  for(const c of _inboxConvos){
    const {count}=await sb.from('messages').select('id',{count:'exact',head:true})
      .eq('conversation_id',c.id).neq('sender_id',uid).is('read_at',null);
    unread+=count||0;
  }
  ['inboxUnreadBadge','inboxNavBadge'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.textContent=unread;el.style.display=unread>0?'inline':'none';}
  });
  renderInboxList();
}

function renderInboxList(){
  const el=document.getElementById('inboxList');if(!el)return;
  const uid=currentUser?.id;
  if(_inboxTab==='messages'){
    if(_inboxConvos.length===0){el.innerHTML='<div style="padding:24px;color:var(--sub);font-size:13px;text-align:center">No active conversations yet.</div>';return;}
    el.innerHTML=_inboxConvos.map(c=>{
      const role=c.participant_a===uid?c.participant_b_role:c.participant_a_role;
      const active=_activeConvo?.id===c.id;
      return `<div onclick="openInboxConvo('${c.id}')" style="padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;background:${active?'rgba(255,107,53,0.06)':'transparent'};border-left:${active?'2px solid #FF6B35':'2px solid transparent'}">

          <span style="font-weight:700;font-size:13px;text-transform:capitalize">${role}</span>

    el.innerHTML=_inboxRequests.map(r=>`

      </div>`).join('');
  }
}

  renderMsgFeed(msgs||[],uid);
  if(_inboxChannel)sb.removeChannel(_inboxChannel);
  _inboxChannel=sb.channel('inbox-planner-'+convoId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+convoId},
      payload=>{
        const feed=document.getElementById('msgFeed');
        if(feed){feed.innerHTML+=renderMsgBubble(payload.new,uid);document.getElementById('msgFeedBottom')?.scrollIntoView({behavior:'smooth'});}
      }).subscribe();
}

function renderMsgBubble(m,uid){
  const mine=m.sender_id===uid;
  const d=new Date(m.created_at);
  const ts=d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  return `<div style="display:flex;flex-direction:column;align-items:${mine?'flex-end':'flex-start'}">
    <div style="max-width:70%;background:${mine?'#FF6B35':'var(--bg)'};color:${mine?'#fff':'var(--text)'};border-radius:${mine?'16px 16px 4px 16px':'16px 16px 16px 4px'};padding:10px 14px;font-size:14px;line-height:1.5">
      ${m.body?`<div>${m.body}</div>`:''}
      ${m.attachment_url&&m.attachment_type==='image'?`<img src="${m.attachment_url}" style="max-width:100%;border-radius:8px;margin-top:${m.body?'8px':'0'}">`:''}
      ${m.attachment_url&&m.attachment_type==='file'?`<a href="${m.attachment_url}" target="_blank" style="color:${mine?'rgba(255,255,255,0.85)':'#FF6B35'};font-size:13px;display:block">Download attachment</a>`:''}
    </div>
    <div style="font-size:10px;color:var(--muted);margin-top:4px">${ts}</div>
  </div>`;
}

function renderMsgFeed(msgs,uid){
  const feed=document.getElementById('msgFeed');if(!feed)return;
  feed.innerHTML=msgs.map(m=>renderMsgBubble(m,uid)).join('')+'<div id="msgFeedBottom"></div>';
  document.getElementById('msgFeedBottom')?.scrollIntoView();
}

function previewInboxAttachment(e){
  const file=e.target.files[0];if(!file)return;
  _inboxAttachment=file;
  const prev=document.getElementById('attachPreview');
  if(prev){prev.style.display='flex';prev.innerHTML=`<span>${file.name}</span><button onclick="clearInboxAttachment()" style="background:none;border:none;color:var(--sub);cursor:pointer;font-size:14px">×</button>`;}
}
function clearInboxAttachment(){_inboxAttachment=null;const p=document.getElementById('attachPreview');if(p)p.style.display='none';}

async function sendInboxMessage(){
  const uid=currentUser?.id;
  const input=document.getElementById('msgInput');
  const body=input?.value.trim();
  if(!body&&!_inboxAttachment)return;
  let attachment_url=null,attachment_type=null;
  if(_inboxAttachment){
    const ext=_inboxAttachment.name.split('.').pop();
    const path='inbox/'+_activeConvo.id+'/'+Date.now()+'.'+ext;
    const {error}=await sb.storage.from('attachments').upload(path,_inboxAttachment,{upsert:true});
    if(!error){const {data:u}=sb.storage.from('attachments').getPublicUrl(path);attachment_url=u.publicUrl;attachment_type=_inboxAttachment.type.startsWith('image/')?'image':'file';}
    clearInboxAttachment();
  }
  await sb.from('messages').insert({conversation_id:_activeConvo.id,sender_id:uid,sender_role:'planner',body:body||null,attachment_url,attachment_type});
  if(input)input.value='';
  const {data:msgs}=await sb.from('messages').select('*').eq('conversation_id',_activeConvo.id).order('created_at',{ascending:true});
  renderMsgFeed(msgs||[],uid);
}

async function acceptInboxRequest(reqId,convoId){
  await sb.from('message_requests').update({status:'accepted'}).eq('id',reqId);
  await sb.from('conversations').update({status:'active'}).eq('id',convoId);
  switchInboxTab('messages');
  loadInboxConversations(currentUser?.id);
}

async function declineInboxRequest(reqId,convoId){
  await sb.from('message_requests').update({status:'declined'}).eq('id',reqId);
  await sb.from('conversations').update({status:'archived'}).eq('id',convoId);
  loadInboxConversations(currentUser?.id);
}

function addTierRow(){
 var list=document.getElementById('tiersList');
 var noTiers=document.getElementById('noTiers');
 if(noTiers)noTiers.remove();
 var div=document.createElement('div');
 div.innerHTML=buildTierRow(Date.now(),null);
 list.appendChild(div.firstElementChild);
}

async function submitEvent(editId){
 const title=document.getElementById('evTitle')?.value.trim();
 const date=document.getElementById('evDate')?.value;
 const time=document.getElementById('evTime')?.value||'19:00';
 const errEl=document.getElementById('evErr');
 if(!title||!date){if(errEl){errEl.textContent='Please fill in event title and date.';errEl.style.display='block';}return;}
 const startTime=new Date(date+'T'+time+':00');
 const endDate=document.getElementById('evEndDate')?.value;
 const endTime=document.getElementById('evEndTime')?.value;
 const endDateTime=(endDate&&endTime)?new Date(endDate+'T'+endTime+':00').toISOString():null;
 const venueId=document.getElementById('evVenue')?.value||null;
 const cover=document.getElementById('evCover')?.value||null;

 // Collect tiers
 const tierRows=document.querySelectorAll('.tier-row');
 const tiers=[];
 tierRows.forEach(function(row){
   const name=row.querySelector('.tier-name')?.value.trim();
   const price=row.querySelector('.tier-price')?.value;
   const qty=row.querySelector('.tier-qty')?.value;
   const desc=row.querySelector('.tier-desc')?.value.trim();
   const link=row.querySelector('.tier-link')?.value.trim();
   if(name)tiers.push({name,price:parseFloat(price)||0,quantity:qty?parseInt(qty):null,quantity_remaining:qty?parseInt(qty):null,description:desc||null,payment_link:link||null});
 });

 const priceVals=tiers.map(function(t){return t.price;}).filter(function(p){return p>0;});
 const isFree=priceVals.length===0;

 const payload={
   title,
   start_time:startTime.toISOString(),
   end_time:endDateTime,
   category:document.getElementById('evCat')?.value||'Other',
   venue_id:venueId||null,
   description:document.getElementById('evDesc')?.value||null,
   cover_image_url:cover,
   price_min:isFree?null:(priceVals.length?Math.min.apply(null,priceVals):null),
   price_max:isFree?null:(priceVals.length?Math.max.apply(null,priceVals):null),
   is_free:isFree,
   status:'published',
   owner_id:currentUser.id,
   planner_email:currentUser.email,
 };

 let eventId=editId||null;
 let error;
 if(editId){
   const res=await sb.from('events').update(payload).eq('id',editId);
   error=res.error;
 } else {
   const res=await sb.from('events').insert(payload).select().single();
   error=res.error;
   if(!error)eventId=res.data.id;
 }
 if(error){if(errEl){errEl.textContent=error.message;errEl.style.display='block';}return;}

 // Save ticket tiers
 if(eventId&&tiers.length>0){
   await sb.from('ticket_tiers').delete().eq('event_id',eventId);
   const tierRows=tiers.map(function(t){return Object.assign({},t,{event_id:eventId});});
   await sb.from('ticket_tiers').insert(tierRows);
 }

 closeModal();
 await loadData();
 toast(editId?'Event updated!':'\uD83C\uDF89 Event published to CBUSEVENTS!');
 nav('events');
}

// ── DELEGATED EVENT ACTIONS ──────────────────────────────────
document.addEventListener('click', function(e){
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  if(action==='edit') editEvent(id);
  else if(action==='share') openShareModal(id);
  else if(action==='boost') openBoostModal(id);
  else if(action==='delete') deleteEvent(id);
});

// ── START ─────────────────────────────────────────────────────
init();
</script>
