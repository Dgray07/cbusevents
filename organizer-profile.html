<!DOCTYPE html>
<html lang="en" data-default="dark">
<head>
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Organizer Profile | CBUSEVENTS</title>
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  :root{
    --bg:#050508;--surface:#0f0f1c;--card:#1c1c30;--card-hover:#222238;
    --border:rgba(255,255,255,0.09);--border-mid:rgba(255,255,255,0.15);
    --text:#f4f4ff;--sub:#8888b0;--muted:#44445a;
    --orange:#FF6B35;--orange-dim:rgba(255,107,53,0.12);--orange-glow:rgba(255,107,53,0.28);
    --green:#30d693;--red:#f47171;--blue:#7c8cf8;--gold:#f5bc30;
    --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
    --shadow-sm:0 4px 20px rgba(0,0,0,0.8),0 0 0 1px rgba(255,255,255,0.08);
    --shadow-md:0 8px 32px rgba(0,0,0,0.85),0 0 0 1px rgba(255,255,255,0.1);
    --radius-sm:10px;--radius-md:14px;--radius-lg:18px;
  }
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

  /* NAV */
  nav{position:sticky;top:0;z-index:100;background:rgba(20,20,36,0.96);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:58px;}
  .nav-logo{font-weight:800;font-size:17px;cursor:pointer;letter-spacing:-0.04em;text-transform:uppercase;text-decoration:none;color:var(--text);}
  .nav-logo span{color:var(--orange);}
  .nav-right{display:flex;align-items:center;gap:10px;}
  .btn{border:none;border-radius:var(--radius-sm);padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.16s;font-family:var(--font);}
  .btn-primary{background:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(255,107,53,0.3);}
  .btn-primary:hover{opacity:0.9;box-shadow:0 4px 20px rgba(255,107,53,0.4);}
  .btn-outline{background:transparent;border:1px solid var(--border-mid);color:var(--text);}
  .btn-outline:hover{border-color:rgba(255,255,255,0.2);}
  .btn-ghost{background:rgba(255,255,255,0.04);color:var(--sub);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);background:rgba(255,255,255,0.07);}
  .btn-sm{padding:5px 14px;font-size:12px;border-radius:8px;}
  .btn-follow{min-width:100px;}

  /* HERO */
  .profile-hero{background:linear-gradient(180deg,#1a0e00 0%,#1c1030 50%,var(--bg) 100%);padding:48px 0 0;border-bottom:1px solid var(--border);}
  .profile-hero-inner{max-width:860px;margin:0 auto;padding:0 32px;}
  .profile-avatar{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff;border:3px solid var(--orange-glow);box-shadow:var(--shadow-md);flex-shrink:0;}
  .profile-name{font-size:28px;font-weight:800;letter-spacing:-0.03em;margin-bottom:4px;}
  .profile-handle{font-size:13px;color:var(--sub);font-family:var(--mono);margin-bottom:10px;}
  .profile-bio{font-size:14px;color:var(--sub);line-height:1.65;max-width:480px;margin-bottom:16px;}
  .profile-stats{display:flex;gap:24px;padding:20px 0;border-top:1px solid var(--border);margin-top:4px;}
  .profile-stat{text-align:center;}
  .profile-stat-num{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-0.02em;line-height:1;}
  .profile-stat-lbl{font-size:11px;color:var(--sub);margin-top:3px;}

  /* CONTENT */
  .profile-body{max-width:860px;margin:0 auto;padding:28px 32px;animation:fadeUp 0.3s ease;}
  .section-label{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}

  /* EVENTS GRID */
  .events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:28px;}
  .event-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);overflow:hidden;cursor:pointer;transition:box-shadow 0.2s,transform 0.2s;}
  .event-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .event-card-cover{width:100%;height:120px;object-fit:cover;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:28px;}
  .event-card-cover img{width:100%;height:100%;object-fit:cover;}
  .event-card-body{padding:12px 14px;}
  .event-card-date{font-size:10px;font-weight:700;color:var(--orange);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;}
  .event-card-title{font-size:14px;font-weight:700;letter-spacing:-0.01em;margin-bottom:4px;}
  .event-card-meta{font-size:12px;color:var(--sub);}

  /* POSTS */
  .post-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:18px 20px;margin-bottom:10px;}
  .post-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .post-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;}
  .post-name{font-size:13px;font-weight:700;}
  .post-time{font-size:11px;color:var(--muted);}
  .post-body{font-size:14px;color:var(--text);line-height:1.65;}
  .post-likes{font-size:12px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}

  /* FOLLOW BADGE */
  .role-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:0.04em;text-transform:uppercase;}
  .role-organizer{background:var(--orange-dim);color:var(--orange);border:1px solid var(--orange-glow);}

  /* EMPTY */
  .empty{text-align:center;padding:40px;color:var(--sub);font-size:13px;}

  /* TOAST */
  .toast{position:fixed;bottom:24px;right:24px;z-index:999;background:var(--card);border:1px solid var(--border-mid);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);padding:12px 18px;font-size:13px;font-weight:500;display:none;}
  .toast.success{border-color:rgba(48,214,147,0.3);color:var(--green);}
  .toast.error{border-color:rgba(244,113,113,0.3);color:var(--red);}

  @media(max-width:600px){
    nav{padding:0 16px;}
    .profile-hero-inner,.profile-body{padding-left:16px;padding-right:16px;}
    .events-grid{grid-template-columns:1fr;}
    .profile-stats{gap:16px;}
  }
  </style>
</head>
<body>
<nav>
  <a href="https://cbusevents.com" class="nav-logo">CBUS<span>EVENTS</span></a>
  <div class="nav-right" id="navRight">
    <a href="https://cbusevents.com" class="btn btn-ghost btn-sm">← Back</a>
  </div>
</nav>

<div id="profileContent">
  <div style="display:flex;align-items:center;justify-content:center;min-height:60vh">
    <div style="text-align:center">
      <div style="width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px"></div>
      <div style="color:var(--sub);font-size:13px">Loading profile...</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>@keyframes spin{to{transform:rotate(360deg);}}</style>
<script>
const SB_URL="https://toblgvatvsjljbqogzsv.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvYmxndmF0dnNqbGpicW9nenN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMDgwNTAsImV4cCI6MjA4NzY4NDA1MH0._WJEQPizNDiQfDXQB_DHPaQhixPGpMdmYQSmyWmm_FQ";
const sb=supabase.createClient(SB_URL,SB_KEY);

let profileUserId=null,currentUser=null,isFollowing=false;

function toast(msg,type='success'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast '+type;el.style.display='block';
  setTimeout(()=>el.style.display='none',3000);
}

function timeAgo(dt){
  if(!dt)return'';
  const s=Math.floor((Date.now()-new Date(dt))/1000);
  if(s<60)return'just now';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<604800)return Math.floor(s/86400)+'d ago';
  return new Date(dt).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

async function init(){
  const params=new URLSearchParams(window.location.search);
  profileUserId=params.get('id');
  if(!profileUserId){
    document.getElementById('profileContent').innerHTML='<div class="empty" style="padding:80px">Profile not found.</div>';
    return;
  }

  // Check current session
  const{data:{session}}=await sb.auth.getSession();
  currentUser=session?.user||null;

  // Load all data in parallel
  const[profileRes,eventsRes,postsRes,followerRes,followingRes]=await Promise.all([
    sb.from('organizer_profiles').select('*').eq('user_id',profileUserId).maybeSingle().catch(()=>({data:null})),
    sb.from('events').select('*').or('owner_id.eq.'+profileUserId+',organizer_id.eq.'+profileUserId).eq('status','published').order('start_time',{ascending:false}).limit(6).catch(()=>({data:[]})),
    sb.from('collab_posts').select('*').eq('user_id',profileUserId).order('created_at',{ascending:false}).limit(5).catch(()=>({data:[]})),
    sb.from('profile_follows').select('id',{count:'exact',head:true}).eq('following_id',profileUserId).catch(()=>({count:0})),
    currentUser?sb.from('profile_follows').select('id').eq('follower_id',currentUser.id).eq('following_id',profileUserId).maybeSingle().catch(()=>({data:null})):{data:null},
  ]);

  const profile=profileRes.data;
  const events=eventsRes.data||[];
  const posts=postsRes.data||[];
  const followerCount=followerRes.count||0;
  isFollowing=!!(followingRes?.data);

  // Get display name - fall back to user metadata via RPC or email
  let displayName=profile?.display_name||profile?.full_name||'Organizer';
  let bio=profile?.bio||'Event organizer based in Columbus, Ohio.';
  let avatarUrl=profile?.avatar_url||null;
  const initial=displayName[0].toUpperCase();
  const avatarBg='linear-gradient(135deg,var(--orange),#c84000)';

  // Page title
  document.title=displayName+' | CBUSEVENTS';

  // Update nav with sign in or user
  if(currentUser&&currentUser.id!==profileUserId){
    const uName=currentUser.user_metadata?.full_name||currentUser.email.split('@')[0];
    document.getElementById('navRight').innerHTML=`
      <span style="font-size:13px;color:var(--sub)">${uName}</span>
      <a href="/cbus-organizer-portal.html" class="btn btn-ghost btn-sm">My Portal</a>
    `;
  }

  const isOwnProfile=currentUser&&currentUser.id===profileUserId;

  document.getElementById('profileContent').innerHTML=`
  <div class="profile-hero">
    <div class="profile-hero-inner">
      <div style="display:flex;align-items:flex-start;gap:20px;margin-bottom:16px;flex-wrap:wrap">
        <div class="profile-avatar" style="background:${avatarBg}">
          ${avatarUrl?`<img src="${avatarUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:initial}
        </div>
        <div style="flex:1;min-width:200px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap">
            <div class="profile-name">${displayName}</div>
            <span class="role-badge role-organizer">Organizer</span>
          </div>
          <div class="profile-bio">${bio}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${isOwnProfile
              ?'<a href="/cbus-organizer-portal.html" class="btn btn-outline btn-sm">← Back to portal</a>'
              :`<button class="btn ${isFollowing?'btn-ghost':'btn-primary'} btn-sm btn-follow" id="followBtn" onclick="toggleFollow()">${isFollowing?'Following':'Follow'}</button>`
            }
            ${profile?.instagram?`<a href="https://instagram.com/${profile.instagram.replace('@','')}" target="_blank" class="btn btn-ghost btn-sm">Instagram →</a>`:''}
          </div>
        </div>
      </div>
      <div class="profile-stats">
        <div class="profile-stat"><div class="profile-stat-num">${followerCount}</div><div class="profile-stat-lbl">Followers</div></div>
        <div class="profile-stat"><div class="profile-stat-num">${events.length}</div><div class="profile-stat-lbl">Events</div></div>
        <div class="profile-stat"><div class="profile-stat-num">${posts.length}</div><div class="profile-stat-lbl">Posts</div></div>
      </div>
    </div>
  </div>

  <div class="profile-body">
    ${events.length?`
    <div class="section-label">Events</div>
    <div class="events-grid">
      ${events.map(e=>`
      <div class="event-card" onclick="window.location.href='https://cbusevents.com/event.html?id=${e.id}'">
        <div class="event-card-cover">
          ${e.cover_image_url?`<img src="${e.cover_image_url}" alt="${e.title}">`:'📅'}
        </div>
        <div class="event-card-body">
          <div class="event-card-date">${e.start_time?new Date(e.start_time).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):''}</div>
          <div class="event-card-title">${e.title||'Untitled'}</div>
          <div class="event-card-meta">${e.venue_name_override||e.venues?.name||'Columbus'}</div>
        </div>
      </div>`).join('')}
    </div>`:''}

    ${posts.length?`
    <div class="section-label" style="margin-top:8px">Community posts</div>
    ${posts.map(p=>`
    <div class="post-card">
      <div class="post-header">
        <div class="post-avatar" style="background:${avatarBg}">${initial}</div>
        <div>
          <div class="post-name">${displayName}</div>
          <div class="post-time">${timeAgo(p.created_at)}</div>
        </div>
      </div>
      <div class="post-body">${p.body}</div>
      ${p.image_url?`<img src="${p.image_url}" style="width:100%;border-radius:10px;margin-top:12px;object-fit:cover;max-height:300px">`:''}
      <div class="post-likes">♥ ${p.likes||0} likes</div>
    </div>`).join('')}
    `:''}

    ${!events.length&&!posts.length?`<div class="empty">Nothing posted yet.</div>`:''}
  </div>`;
}

async function toggleFollow(){
  if(!currentUser){
    toast('Sign in to follow organizers','error');
    setTimeout(()=>window.location.href='/cbus-organizer-portal.html',1500);
    return;
  }
  const btn=document.getElementById('followBtn');
  if(!btn)return;
  if(isFollowing){
    await sb.from('profile_follows').delete().eq('follower_id',currentUser.id).eq('following_id',profileUserId);
    isFollowing=false;
    btn.textContent='Follow';
    btn.className='btn btn-primary btn-sm btn-follow';
    toast('Unfollowed');
  } else {
    await sb.from('profile_follows').insert({follower_id:currentUser.id,following_id:profileUserId}).catch(()=>{});
    isFollowing=true;
    btn.textContent='Following';
    btn.className='btn btn-ghost btn-sm btn-follow';
    toast('Following!');
  }
  // Refresh follower count
  const{count}=await sb.from('profile_follows').select('id',{count:'exact',head:true}).eq('following_id',profileUserId).catch(()=>({count:0}));
  const statEl=document.querySelector('.profile-stat-num');
  if(statEl)statEl.textContent=count||0;
}

init();
</script>
</body>
</html>
