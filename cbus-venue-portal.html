*{ -webkit-font-smoothing:antialiased; }
body{ font-family:'DM Sans',sans-serif !important; background:var(--bg) !important; color:var(--text) !important; }
h1,h2,h3,h4,h5,h6{ font-family:'DM Sans',sans-serif !important; letter-spacing:-0.02em; }

/* Stat cards — monospace numbers, hover lift, accent bar */
.stat-card{
  background:var(--card) !important; border:1px solid var(--border) !important;
  border-radius:16px !important; padding:22px 24px 20px !important;
  position:relative; overflow:hidden; transition:all 0.2s !important;
}
.stat-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:2px;

.stat-num,.stat-card-num,.stat-value{

.stat-sub,.stat-card-sub,.stat-meta{ font-size:11px !important; color:var(--muted) !important; margin-top:8px !important; }

/* ── END DESIGN SYSTEM ─────────────────────────────────────── */

// ── GEOCODING ────────────────────────────────────────────────
const MAPBOX_TOKEN='pk.eyJ1IjoiY2J1c2V2ZW50cyIsImEiOiJjbW1oNWJhaDYwYnVrMnJxN3hxdGJlZmhkIn0.RtF51b0qghUlJAjHgNRdFQ';
async function geocodeAddress(address){
  if(!address||address.trim().length<5)return null;
  try{
    const query=address.toLowerCase().includes('columbus')?address:address+', Columbus, OH';
    const encoded=encodeURIComponent(query);
    const url=`https://api.mapbox.com/geocoding/v5/mapbox.places/${encoded}.json?access_token=${MAPBOX_TOKEN}&country=US&proximity=-82.9988,39.9612&types=address,poi&limit=1`;
    const res=await fetch(url);
    if(!res.ok)return null;
    const data=await res.json();
    if(!data.features||data.features.length===0)return null;
    const[lng,lat]=data.features[0].center;
    return{lat,lng};
  }catch(err){console.warn('Geocode failed:',err);return null;}
}

 const [busy,setBusy]=useState(false);
 const [toast,setToast]=useState({msg:"",type:"success"});
 const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));

 const compressImage=(file,maxWidth=1200,quality=0.82)=>new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onload=e=>{
     const img=new Image();
     img.onload=()=>{
       try{
         const canvas=document.createElement('canvas');
         let w=img.width,h=img.height;
         if(w>maxWidth){h=Math.round(h*(maxWidth/w));w=maxWidth;}
         canvas.width=w;canvas.height=h;
         canvas.getContext('2d').drawImage(img,0,0,w,h);
         resolve(canvas.toDataURL('image/jpeg',quality));
       }catch(e){reject(e);}
     };
     img.onerror=reject;
     img.src=e.target.result;
   };
   reader.onerror=reject;
   reader.readAsDataURL(file);
 });

 const handleCoverPhoto=async(e)=>{
   const file=e.target.files[0];
   if(!file)return;
   try{
     setToast({msg:'Compressing photo...',type:'success'});
     const dataUrl=await compressImage(file);
     setF(p=>({...p,cover_image_url:dataUrl}));
     setToast({msg:'Photo ready — click Save to apply',type:'success'});
     setTimeout(()=>setToast({msg:''}),3000);
   }catch(err){
     setToast({msg:'Photo failed: '+err.message,type:'error'});
   }
   e.target.value='';
 };

 setBusy(true);

 setBusy(false);
 if(error){setToast({msg:"Error: "+error.message,type:"error"});}
 else{setToast({msg:"Venue saved! We'll review it within 24 hours.",type:"success"});onSave?.();}
 setTimeout(()=>setToast({msg:""}),5000);
 };
 return (

</Field>}
 </Card> </div> <Card style={{gridColumn:"1/-1"}}>

 <input type="file" id="spacePhotoInput" accept="image/*" multiple style={{display:"none"}} onChange={async(e)=>{

         let w=img.width,h=img.height;
         if(w>1200){h=Math.round(h*(1200/w));w=1200;}
         canvas.width=w;canvas.height=h;
         canvas.getContext('2d').drawImage(img,0,0,w,h);
         res(canvas.toDataURL('image/jpeg',0.82));
       };
       img.src=ev.target.result;

     reader.readAsDataURL(file);

 }}/>
 {(f.photos||[]).length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginTop:4}}>

          </div>
          <div style={{display:"flex",gap:10,alignItems:"flex-end"}}>
            <div style={{flex:1}}><label style={{fontSize:11,color:"var(--sub)",display:"block",marginBottom:4}}>Perks (optional)</label><input value={tier.description} onChange={e=>update(i,"description",e.target.value)} placeholder="Front row access, 1 drink included..." style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:6,padding:"7px 10px",color:"var(--text)",fontSize:13,width:"100%",fontFamily:"'DM Sans',sans-serif"}}/></div>
            <button type="button" onClick={()=>remove(i)} style={{background:"rgba(248,113,113,0.08)",color:"#ef4444",border:"1px solid #4a1010",borderRadius:6,padding:"7px 10px",fontSize:12,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",flexShrink:0}}>Remove</button>

function EventModal({event,venueId,venueTier,currentEventCount,onClose,onSave}) {
 const {user}=useAuth();
 const blank={title:"",description:"",category:"Other",start_time:"",end_time:"",is_free:false,price_min:"",price_max:"",cover_image_url:"",status:"draft"};
 const [f,setF]=useState(event?{...event,start_time:event.start_time?new Date(event.start_time).toISOString().slice(0,16):"",end_time:event.end_time?new Date(event.end_time).toISOString().slice(0,16):""}:blank);
 const [tiers,setTiers]=useState([]);
 const [busy,setBusy]=useState(false);
 const [err,setErr]=useState("");
 const set=k=>e=>setF(p=>({...p,[k]:e.target.type==="checkbox"?e.target.checked:e.target.value}));

 // Load existing tiers when editing
 useEffect(()=>{
   if(event?.id){
     sb.from("ticket_tiers").select("*").eq("event_id",event.id).order("price",{ascending:true})
       .then(({data})=>setTiers((data||[]).map(t=>({...t,price:String(t.price||""),quantity:String(t.quantity||"")}))))
   }
 },[event?.id]);

 const save=async()=>{
 if(!f.title.trim()){setErr("Title required.");return;}
 if(!f.start_time){setErr("Start time required.");return;}
 if(!f.is_free&&tiers.some(t=>!t.name||t.price==="")){setErr("Each ticket tier needs a name and price.");return;}

 ];

         if(data) setVenue(data);
       });

 }
 },[venue?.id]);

 const upgraded=new URLSearchParams(window.location.search).get("upgrade")==="success";

 return (

 </div> <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:22}}> {p.perks.map(k=><div key={k} style={{display:"flex",gap:8,fontSize:13,color:"var(--sub)"}}><span style={{color:"var(--green)"}}></span>{k}</div>)}

// Portal Shell
function Portal() {
 const {user,profile}=useAuth();
 // If arriving from pricing page with ?upgrade=standard or ?upgrade=premium, go straight to plan tab
 const initPage = ['standard','premium'].includes(new URLSearchParams(window.location.search).get('upgrade')) ? 'plan' : 'dashboard';
 const [page,setPage]=useState(initPage);
 const [venue,setVenue]=useState(null);
 const [events,setEvents]=useState([]);
 const [busy,setBusy]=useState(true);
 const load=async(retry=0)=>{
 setBusy(true);
 const {data:v}=await sb.from("venues").select("*").eq("owner_id",user.id).maybeSingle();
 if(!v && retry < 2){
   // Venue write may still be in-flight after email confirmation — retry after short delay
   setTimeout(()=>load(retry+1), 1200);
   return;
 }
 setVenue(v||null);
 if(v?.id){const {data:ev}=await sb.from("events").select("*").eq("venue_id",v.id).order("start_time",{ascending:true});setEvents(ev||[]);}
 else setEvents([]);
 setBusy(false);
 };
 useEffect(()=>{load();},[]);
 return (
 <div style={{display:"flex",minHeight:"100vh"}}> <Sidebar active={page} setActive={setPage} profile={profile}/> <main style={{flex:1,padding:36,overflowY:"auto",background:"var(--bg)",minHeight:"100vh"}}> {busy?<Spin/>:<> {page==="dashboard"&&<Dashboard venue={venue} events={events}/>}
 {page==="venue" &&<VenueForm venue={venue} onSave={load}/>}
 {page==="events" &&<EventsManager venue={venue} events={events} onRefresh={load}/>}
 {page==="inquiries"&&<Inquiries venue={venue}/>}
 {page==="plan" &&<PlanBilling venue={venue}/>}
 </>}
 </main> </div> );
}

function App() {

 return user?<Portal/>:<AuthPage/>;
}

function Root() {
