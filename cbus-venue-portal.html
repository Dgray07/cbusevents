/* ── CBUSEVENTS DESIGN SYSTEM UPGRADE ─────────────────────── */

  --bg:#080810;--surface:#0f0f1a;--card:#141420;--card-hover:#18182a;

  --text:#f0f0fa;--sub:#7070a0;--muted:#40405a;
  --orange:#FF6B35;--green:#34d399;--red:#f87171;--blue:#818cf8;--gold:#fbbf24;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
*{ -webkit-font-smoothing:antialiased; }
body{ font-family:'DM Sans',sans-serif !important; background:var(--bg) !important; color:var(--text) !important; }
h1,h2,h3,h4,h5,h6{ font-family:'DM Sans',sans-serif !important; letter-spacing:-0.02em; }

/* Stat cards — monospace numbers, hover lift, accent bar */
.stat-card{
  background:var(--card) !important; border:1px solid var(--border) !important;
  border-radius:16px !important; padding:22px 24px 20px !important;
  position:relative; overflow:hidden; transition:all 0.2s !important;
}
.stat-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,transparent,var(--orange),transparent);
  opacity:0; transition:opacity 0.2s;
}
.stat-card:hover{ background:var(--card-hover) !important; transform:translateY(-1px) !important; border-color:rgba(255,255,255,0.08) !important; }
.stat-card:hover::before{ opacity:1; }
.stat-num,.stat-card-num,.stat-value{
  font-family:'DM Mono',monospace !important;
  font-size:32px !important; font-weight:500 !important;
  line-height:1 !important; letter-spacing:-0.02em !important; margin-bottom:6px !important;
}
.stat-label,.stat-card-label{ font-size:13px !important; color:var(--sub) !important; font-weight:500 !important; }
.stat-sub,.stat-card-sub,.stat-meta{ font-size:11px !important; color:var(--muted) !important; margin-top:8px !important; }

/* Sidebar nav — orange left-border active indicator */
.sidebar,.portal-sidebar{ background:var(--surface) !important; border-right:1px solid var(--border) !important; }
.nav-item{
  border-left:2px solid transparent !important;
  border-radius:10px !important; transition:all 0.18s !important;

.nav-item:hover{ background:rgba(255,255,255,0.04) !important; color:var(--text) !important; border-left-color:var(--muted) !important; }
.nav-item.active{

  -webkit-backdrop-filter:blur(20px) !important; backdrop-filter:blur(20px) !important;
  border-bottom:1px solid var(--border) !important;
}

/* Cards / panels */
.card,.panel,.card-section{
  background:var(--card) !important; border:1px solid var(--border) !important;
  border-radius:16px !important;
}
.card-header,.panel-header{ border-bottom:1px solid var(--border-sub) !important; }
.card-title,.panel-title{ font-size:15px !important; font-weight:700 !important; letter-spacing:-0.02em !important; }

.btn,.btn-primary,.btn-orange{

th{ font-size:10px !important; color:var(--muted) !important; font-weight:700 !important; text-transform:uppercase !important; letter-spacing:0.1em !important; border-bottom:1px solid var(--border-sub) !important; }

.modal,.modal-box,.modal-inner{

.sidebar-logo,.logo-wrap{ position:relative !important; }
.sidebar-logo::after,.logo-wrap::after{

const MAPBOX_TOKEN='pk.eyJ1IjoiY2J1c2V2ZW50cyIsImEiOiJjbW1oNWJhaDYwYnVrMnJxN3hxdGJlZmhkIn0.RtF51b0qghUlJAjHgNRdFQ';
async function geocodeAddress(address){
  if(!address||address.trim().length<5)return null;
  try{
    const query=address.toLowerCase().includes('columbus')?address:address+', Columbus, OH';
    const encoded=encodeURIComponent(query);
    const url=`https://api.mapbox.com/geocoding/v5/mapbox.places/${encoded}.json?access_token=${MAPBOX_TOKEN}&country=US&proximity=-82.9988,39.9612&types=address,poi&limit=1`;
    const res=await fetch(url);
    if(!res.ok)return null;
    const data=await res.json();
    if(!data.features||data.features.length===0)return null;
    const[lng,lat]=data.features[0].center;
    return{lat,lng};
  }catch(err){console.warn('Geocode failed:',err);return null;}
}

const uploadImageToStorage = async (file, bucket, path) => {
   // Use createImageBitmap for HEIC/HEIF support on iOS
   let blob = file;
   try {
     const bitmap = await createImageBitmap(file);
     const canvas = document.createElement('canvas');
     let w = bitmap.width, h = bitmap.height;
     const maxW = 1400;
     if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
     canvas.width = w; canvas.height = h;
     canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
     blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
     bitmap.close();
   } catch(e) {
     console.warn('createImageBitmap failed, using original file:', e);
   }
   const { data, error } = await sb.storage.from(bucket).upload(path, blob, {
     upsert: true, contentType: 'image/jpeg'
   });
   if (error) throw error;
   const { data: urlData } = sb.storage.from(bucket).getPublicUrl(path);
   return urlData.publicUrl;
 };

 const handleCoverPhoto=async(e)=>{
   const file=e.target.files[0];

   try{
     setToast({msg:'Uploading photo...',type:'success'});

 const handleSpacePhotos=async(e)=>{
   const files=Array.from(e.target.files).slice(0,6-(f.photos||[]).length);
   const compressed=await Promise.all(files.map(async(file)=>{
     try {
       const bitmap=await createImageBitmap(file);
       const canvas=document.createElement('canvas');
       let w=bitmap.width,h=bitmap.height;
       if(w>1200){h=Math.round(h*(1200/w));w=1200;}
       canvas.width=w;canvas.height=h;
       canvas.getContext('2d').drawImage(bitmap,0,0,w,h);
       const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.82));
       bitmap.close();
       const path=`venues/${user.id}/photo_${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
       const {error:upErr}=await sb.storage.from('venue-photos').upload(path,blob,{upsert:true,contentType:'image/jpeg'});
       if(upErr)throw upErr;
       const {data:urlData}=sb.storage.from('venue-photos').getPublicUrl(path);
       return urlData.publicUrl;
     } catch(e){
       return new Promise(res=>{
         const reader=new FileReader();
         reader.onload=ev=>res(ev.target.result);
         reader.readAsDataURL(file);
       });
     }
   }));
   setF(p=>({...p,photos:[...(p.photos||[]),...compressed].slice(0,6)}));

 };

function TicketTierBuilder({tiers,setTiers,isFree}){
  if(isFree)return null;
  const add=()=>setTiers(t=>[...t,blankTier()]);
  const remove=i=>setTiers(t=>t.filter((_,idx)=>idx!==i));
  const update=(i,k,v)=>setTiers(t=>t.map((tier,idx)=>idx===i?{...tier,[k]:v}:tier));
  return(
    <div style={{marginBottom:18}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <label style={{marginBottom:0,fontSize:13,color:"var(--sub)",fontWeight:500}}>Ticket Tiers</label>
        <button type="button" onClick={add} style={{background:"#FF6B3520",color:"#FF6B35",border:"1px solid #FF6B3540",borderRadius:6,padding:"4px 12px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>+ Add Tier</button>
      </div>
      {tiers.length===0&&<div style={{background:"var(--surface)",border:"1px dashed #25252f",borderRadius:10,padding:"14px",textAlign:"center",color:"var(--muted)",fontSize:13}}>No ticket tiers yet — add GA, VIP, etc.</div>}
      {tiers.map((tier,i)=>(
        <div key={i} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"14px",marginBottom:10}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 100px 100px",gap:10,marginBottom:8}}>
            <div><label style={{fontSize:11,color:"var(--sub)",display:"block",marginBottom:4}}>Tier Name</label><input value={tier.name} onChange={e=>update(i,"name",e.target.value)} placeholder="General Admission" style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:6,padding:"7px 10px",color:"var(--text)",fontSize:13,width:"100%",fontFamily:"'DM Sans',sans-serif"}}/></div>
            <div><label style={{fontSize:11,color:"var(--sub)",display:"block",marginBottom:4}}>Price ($)</label><input type="number" min="0" value={tier.price} onChange={e=>update(i,"price",e.target.value)} placeholder="25" style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:6,padding:"7px 10px",color:"var(--text)",fontSize:13,width:"100%",fontFamily:"'DM Sans',sans-serif"}}/></div>
            <div><label style={{fontSize:11,color:"var(--sub)",display:"block",marginBottom:4}}>Qty</label><input type="number" min="1" value={tier.quantity} onChange={e=>update(i,"quantity",e.target.value)} placeholder="100" style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:6,padding:"7px 10px",color:"var(--text)",fontSize:13,width:"100%",fontFamily:"'DM Sans',sans-serif"}}/></div>
          </div>
          <div style={{display:"flex",gap:10,alignItems:"flex-end"}}>
            <div style={{flex:1}}><label style={{fontSize:11,color:"var(--sub)",display:"block",marginBottom:4}}>Perks (optional)</label><input value={tier.description} onChange={e=>update(i,"description",e.target.value)} placeholder="Front row access, 1 drink included..." style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:6,padding:"7px 10px",color:"var(--text)",fontSize:13,width:"100%",fontFamily:"'DM Sans',sans-serif"}}/></div>
            <button type="button" onClick={()=>remove(i)} style={{background:"rgba(248,113,113,0.08)",color:"#ef4444",border:"1px solid #4a1010",borderRadius:6,padding:"7px 10px",fontSize:12,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",flexShrink:0}}>Remove</button>
          </div>
        </div>
      ))}
    </div>
  );
}

function EventModal({event,venueId,venueTier,currentEventCount,onClose,onSave}) {
 const {user}=useAuth();
 const blank={title:"",description:"",category:"Other",start_time:"",end_time:"",is_free:false,price_min:"",price_max:"",cover_image_url:"",status:"draft"};
 const [f,setF]=useState(event?{...event,start_time:event.start_time?new Date(event.start_time).toISOString().slice(0,16):"",end_time:event.end_time?new Date(event.end_time).toISOString().slice(0,16):""}:blank);
 const [tiers,setTiers]=useState([]);
 const [busy,setBusy]=useState(false);
 const [err,setErr]=useState("");
 const [coverUploading,setCoverUploading]=useState(false);
 const set=k=>e=>setF(p=>({...p,[k]:e.target.type==="checkbox"?e.target.checked:e.target.value}));
 const handleEventCover=async(e)=>{
   const file=e.target.files[0];
   if(!file)return;
   setCoverUploading(true);
   try{
     const path=`event-covers/${user.id}/cover_${Date.now()}.jpg`;
     const url=await uploadImageToStorage(file,'event-covers',path);
     setF(p=>({...p,cover_image_url:url}));
   }catch(ex){
     setErr('Cover upload failed: '+ex.message);
   }finally{
     setCoverUploading(false);
     e.target.value='';
   }
 };

 // Load existing tiers when editing
 useEffect(()=>{
   if(event?.id){
     sb.from("ticket_tiers").select("*").eq("event_id",event.id).order("price",{ascending:true})
       .then(({data})=>setTiers((data||[]).map(t=>({...t,price:String(t.price||""),quantity:String(t.quantity||"")}))))
   }
 },[event?.id]);

 const save=async()=>{
 if(!f.title.trim()){setErr("Title required.");return;}
 if(!f.start_time){setErr("Start time required.");return;}
 if(!f.is_free&&tiers.some(t=>!t.name||t.price==="")){setErr("Each ticket tier needs a name and price.");return;}
 if(!event?.id){
   const tier=venueTier||"free";
   const limit=tier==="premium"?null:tier==="standard"?20:4;
   if(limit!==null&&currentEventCount>=limit){setErr(`Your ${tier} plan is limited to ${limit} events. Upgrade to add more.`);return;}
 }
 setBusy(true);setErr("");
 const priceValues=tiers.filter(t=>t.price!=="").map(t=>parseFloat(t.price));
 const payload={
   ...f,
   venue_id:venueId,
   owner_id:user.id,
   price_min:f.is_free?0:(priceValues.length?Math.min(...priceValues):null),
   price_max:f.is_free?0:(priceValues.length?Math.max(...priceValues):null),
   start_time:f.start_time||null,
   end_time:f.end_time&&f.end_time.trim()!==''?f.end_time:null,
 };
 // Remove ticket_url from payload (no longer used)
 delete payload.ticket_url;
 const {data:evData,error}=event?.id
   ?await sb.from("events").update(payload).eq("id",event.id).select().single()
   :await sb.from("events").insert(payload).select().single();
 if(error){setBusy(false);setErr(error.message);return;}
 const eventId=evData.id;
 // Save ticket tiers
 if(!f.is_free&&tiers.length>0){
   // Delete old tiers then reinsert
   await sb.from("ticket_tiers").delete().eq("event_id",eventId);
   const tierRows=tiers.map(t=>({event_id:eventId,venue_id:venueId,name:t.name,price:parseFloat(t.price)||0,quantity:parseInt(t.quantity)||null,quantity_remaining:parseInt(t.quantity)||null,description:t.description||null}));
   const {error:tierErr}=await sb.from("ticket_tiers").insert(tierRows);
   if(tierErr){setBusy(false);setErr("Event saved but tiers failed: "+tierErr.message);return;}
 }
 setBusy(false);onSave();onClose();
 };
 return (
 <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={onClose}> <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:28,width:"100%",maxWidth:580,maxHeight:"92vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}> <h3 style={{fontFamily:"'DM Sans',sans-serif",fontWeight:800,fontSize:18,marginBottom:20}}>{event?"Edit Event":"New Event"}</h3> {err&&<div style={{background:"rgba(248,113,113,0.08)",color:"#ef4444",border:"1px solid #4a1010",borderRadius:10,padding:"10px",marginBottom:14,fontSize:14}}>{err}</div>}
 <Field label="Title *"><input value={f.title} onChange={set("title")} placeholder="Comedy Night Live"/></Field>
 <Field label="Description"><textarea value={f.description} onChange={set("description")} placeholder="What should attendees expect?"/></Field>
 <Grid2>
   <Field label="Category"><select value={f.category} onChange={set("category")}>{ECATS.map(c=><option key={c}>{c}</option>)}</select></Field>
   <Field label="Status"><select value={f.status} onChange={set("status")}><option value="draft">Draft</option><option value="published">Published</option><option value="cancelled">Cancelled</option></select></Field>
 </Grid2>
 <Grid2>
   <Field label="Start *"><input type="datetime-local" value={f.start_time} onChange={set("start_time")}/></Field>
   <Field label="End"><input type="datetime-local" value={f.end_time} onChange={set("end_time")}/></Field>
 </Grid2>
 <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:18}}>
   <input type="checkbox" id="fc" checked={f.is_free} onChange={set("is_free")} style={{width:"auto",cursor:"pointer"}}/>
   <label htmlFor="fc" style={{marginBottom:0,cursor:"pointer"}}>Free event (no tickets needed)</label>
 </div>
 <TicketTierBuilder tiers={tiers} setTiers={setTiers} isFree={f.is_free}/>
 <Field label="Cover Image">
   {f.cover_image_url&&<img src={f.cover_image_url} alt="" style={{width:"100%",height:140,objectFit:"cover",borderRadius:8,marginBottom:10,border:"1px solid var(--border)"}} onError={e=>e.target.style.display="none"}/>}
   <label style={{display:"flex",alignItems:"center",gap:8,cursor:coverUploading?"default":"pointer",background:"var(--surface)",border:"1px dashed var(--border)",borderRadius:8,padding:"10px 14px",fontSize:13,color:"var(--sub)"}}>
     <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
     <span>{coverUploading?"Uploading...":f.cover_image_url?"Replace cover image":"Upload cover image"}</span>
     <input type="file" accept="image/*" style={{display:"none"}} onChange={handleEventCover} disabled={coverUploading}/>
   </label>
 </Field>
 <div style={{display:"flex",gap:10,marginTop:8}}>
   <Btn onClick={save} disabled={busy}>{busy?"Saving...":event?"Save Changes":"Create Event"}</Btn>
   <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
 </div>
 </div></div>);
}

 return (
 <div> <h2 style={{fontFamily:"'DM Sans',sans-serif",fontSize:22,fontWeight:800,marginBottom:6}}>Inquiries</h2> <p style={{color:"var(--sub)",fontSize:14,marginBottom:24}}>{items.filter(i=>i.status==="new").length} unread</p> {items.length===0&&<Card style={{textAlign:"center",padding:48}}><div style={{fontSize:40,marginBottom:12}}></div><h3 style={{fontFamily:"'DM Sans',sans-serif",fontWeight:700,marginBottom:8}}>No inquiries yet</h3><p style={{color:"var(--sub)",fontSize:14}}>Booking requests will show up here.</p></Card>}
 <div style={{display:"flex",flexDirection:"column",gap:12}}> {items.map(i=>(
 <Card key={i.id} style={{borderColor:i.status==="new"?"#FF6B35":"var(--border)",padding:18}}> <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}> <div><strong>{i.name}</strong><span style={{color:"var(--sub)",fontSize:13,marginLeft:10}}>{i.email}</span></div> <div style={{display:"flex",gap:8,alignItems:"center"}}><Badge color={i.status==="new"?"#FF6B35":"var(--muted)"}>{i.status}</Badge>{i.status==="new"&&<Btn size="sm" variant="secondary" onClick={()=>markRead(i.id)}>Mark Read</Btn>}{i.planner_id&&<Btn size="sm" variant="ghost" onClick={()=>window.startVenueConversation(i.planner_id,'planner',i.name||'Planner','Re: '+i.event_name)}>💬 Reply</Btn>}</div> </div> {i.event_date&&<div style={{fontSize:13,color:"var(--sub)",marginBottom:8}}> {i.event_date} · {i.guest_count} guests</div>}
 <p style={{fontSize:14,lineHeight:1.7}}>{i.message}</p> </Card> ))}
 </div> </div> );
}

// Booking Calendar
function BookingCalendar({venue, events}) {
 const [selected, setSelected] = React.useState(null);
 const [month, setMonth] = React.useState(new Date());
 const [availability, setAvailability] = React.useState([]);
 const [bookingRequests, setBookingRequests] = React.useState([]);
 const [panel, setPanel] = React.useState('calendar'); // 'calendar' | 'requests'
 const [blockModal, setBlockModal] = React.useState(null); // {date, existing}
 const [blockNote, setBlockNote] = React.useState('');
 const [blockStatus, setBlockStatus] = React.useState('blocked');
 const [responseModal, setResponseModal] = React.useState(null);
 const [responseNote, setResponseNote] = React.useState('');
 const [saving, setSaving] = React.useState(false);

 React.useEffect(()=>{ if(venue?.id){ loadData(); } },[venue?.id]);

 async function loadData() {
   const [avail, reqs] = await Promise.all([
     sb.from('venue_availability').select('*').eq('venue_id', venue.id),
     sb.from('booking_requests').select('*').eq('venue_id', venue.id).order('created_at', {ascending:false})
   ]);
   setAvailability(avail.data||[]);
   setBookingRequests(reqs.data||[]);
 }

 const year = month.getFullYear();
 const mon = month.getMonth();
 const firstDay = new Date(year, mon, 1).getDay();
 const daysInMonth = new Date(year, mon+1, 0).getDate();
 const monthName = month.toLocaleDateString('en-US',{month:'long',year:'numeric'});
 const prevMonth = ()=>setMonth(new Date(year, mon-1, 1));
 const nextMonth = ()=>setMonth(new Date(year, mon+1, 1));
 const today = new Date();

 // Build date maps
 const availByDate = {};
 availability.forEach(a=>{ availByDate[a.date] = a; });

 const eventsByDate = {};
 events.forEach(e=>{
   if(!e.start_time) return;
   const d = new Date(e.start_time);
   if(d.getFullYear()===year && d.getMonth()===mon){
     const key = d.getDate();
     if(!eventsByDate[key]) eventsByDate[key]=[];
     eventsByDate[key].push({...e, _type:'event'});
   }
 });
 bookingRequests.forEach(r=>{
   if(!r.event_date) return;
   const d = new Date(r.event_date+'T00:00:00');
   if(d.getFullYear()===year && d.getMonth()===mon){
     const key = d.getDate();
     if(!eventsByDate[key]) eventsByDate[key]=[];
     eventsByDate[key].push({...r, _type:'booking_request'});
   }
 });

 const cells = [];
 for(let i=0;i<firstDay;i++) cells.push(null);
 for(let d=1;d<=daysInMonth;d++) cells.push(d);

 function dateKey(d) {
   const y = year;
   const m = String(mon+1).padStart(2,'0');
   const day = String(d).padStart(2,'0');
   return `${y}-${m}-${day}`;
 }

 function getDayBg(day) {
   const key = dateKey(day);
   const avail = availByDate[key];
   if(avail?.status==='blocked') return 'rgba(248,113,113,0.12)';
   if(avail?.status==='tentative') return 'rgba(251,191,36,0.1)';
   if(avail?.status==='available') return 'rgba(52,211,153,0.08)';
   return 'transparent';
 }

 function getDayBorder(day) {
   const key = dateKey(day);
   const avail = availByDate[key];
   if(avail?.status==='blocked') return '1px solid rgba(248,113,113,0.3)';
   if(avail?.status==='tentative') return '1px solid rgba(251,191,36,0.25)';
   if(avail?.status==='available') return '1px solid rgba(52,211,153,0.2)';
   return '1px solid var(--border-sub)';
 }

 function openBlockModal(day) {
   const key = dateKey(day);
   const existing = availByDate[key];
   setBlockNote(existing?.note||'');
   setBlockStatus(existing?.status||'blocked');
   setBlockModal({day, key, existing});
   setSelected(null);
 }

 async function saveAvailability() {
   if(!blockModal) return;
   setSaving(true);
   const {key, existing} = blockModal;
   if(existing) {
     await sb.from('venue_availability').update({status:blockStatus, note:blockNote}).eq('id', existing.id);
   } else {
     await sb.from('venue_availability').insert({venue_id:venue.id, date:key, status:blockStatus, note:blockNote});
   }
   await loadData();
   setSaving(false);
   setBlockModal(null);
 }

 async function clearAvailability() {
   if(!blockModal?.existing) return;
   setSaving(true);
   await sb.from('venue_availability').delete().eq('id', blockModal.existing.id);
   await loadData();
   setSaving(false);
   setBlockModal(null);
 }

 async function respondToRequest(req, status) {
   setSaving(true);
   await sb.from('booking_requests').update({
     status, response_note: responseNote, responded_at: new Date().toISOString()
   }).eq('id', req.id);
   await loadData();
   setSaving(false);
   setResponseModal(null);
   setResponseNote('');
 }

 const pending = bookingRequests.filter(r=>r.status==='pending');
 const selectedItems = selected ? (eventsByDate[selected]||[]) : [];
 const selectedKey = selected ? dateKey(selected) : null;
 const selectedAvail = selectedKey ? availByDate[selectedKey] : null;

 const STATUS_COLOR = {
   published:'var(--green)', draft:'var(--muted)', cancelled:'#f87171',
   new:'#FF6B35', read:'var(--muted)', confirmed:'var(--green)',
   pending:'#FF6B35', approved:'var(--green)', declined:'#f87171'
 };

 if(!venue) return (
   <div>
     <h2 style={{fontFamily:"'DM Sans',sans-serif",fontSize:22,fontWeight:800,marginBottom:6}}>Booking Calendar</h2>
     <div style={{background:'var(--card)',borderRadius:12,border:'1px solid var(--border)',padding:48,textAlign:'center'}}><p style={{color:'var(--sub)'}}>Set up your venue first.</p></div>
   </div>
 );

 return (
 <div>
   {/* Header */}
   <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24,flexWrap:'wrap',gap:12}}>
     <div>
       <h1 style={{fontFamily:"'DM Sans',sans-serif",fontSize:24,fontWeight:800,letterSpacing:'-0.03em',marginBottom:4}}>Booking Calendar</h1>
       <p style={{color:'var(--sub)',fontSize:14}}>Manage your availability and respond to booking requests.</p>
     </div>
     <div style={{display:'flex',gap:8}}>
       <button onClick={()=>setPanel('calendar')} style={{padding:'8px 16px',borderRadius:8,border:'1px solid var(--border)',background:panel==='calendar'?'#FF6B35':'transparent',color:panel==='calendar'?'#fff':'var(--sub)',fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>Calendar</button>
       <button onClick={()=>setPanel('requests')} style={{padding:'8px 16px',borderRadius:8,border:'1px solid var(--border)',background:panel==='requests'?'#FF6B35':'transparent',color:panel==='requests'?'#fff':'var(--sub)',fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:"'DM Sans',sans-serif",position:'relative'}}>
         Requests {pending.length>0&&<span style={{background:'#f87171',color:'#fff',borderRadius:99,fontSize:10,fontWeight:800,padding:'1px 6px',marginLeft:6}}>{pending.length}</span>}
       </button>
     </div>
   </div>

   {panel==='calendar' && <>
     {/* Legend */}
     <div style={{display:'flex',gap:16,marginBottom:16,flexWrap:'wrap'}}>
       {[
         {color:'#f87171',label:'Blocked'},
         {color:'#fbbf24',label:'Tentative'},
         {color:'#34d399',label:'Available'},
         {color:'#FF6B35',label:'Booking Request'},
         {color:'var(--blue)',label:'Your Event'},
       ].map(l=>(
         <div key={l.label} style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--sub)'}}>
           <div style={{width:8,height:8,borderRadius:'50%',background:l.color}}/>
           {l.label}
         </div>
       ))}
     </div>

     {/* Calendar */}
     <div style={{background:'var(--card)',borderRadius:14,border:'1px solid var(--border)',overflow:'hidden',marginBottom:16}}>
       {/* Month nav */}
       <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 20px',borderBottom:'1px solid var(--border-sub)'}}>
         <button onClick={prevMonth} style={{background:'none',border:'none',color:'var(--sub)',cursor:'pointer',fontSize:20,padding:'2px 8px',borderRadius:6}}>‹</button>
         <div style={{fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:15}}>{monthName}</div>
         <button onClick={nextMonth} style={{background:'none',border:'none',color:'var(--sub)',cursor:'pointer',fontSize:20,padding:'2px 8px',borderRadius:6}}>›</button>
       </div>
       {/* Day labels */}
       <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',borderBottom:'1px solid var(--border-sub)'}}>
         {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>(
           <div key={d} style={{padding:'8px 4px',textAlign:'center',fontFamily:"'DM Mono',monospace",fontSize:9,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)'}}>{d}</div>
         ))}
       </div>
       {/* Grid */}
       <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}}>
         {cells.map((day,i)=>{
           if(!day) return <div key={'e'+i} style={{minHeight:80,borderRight:'1px solid var(--border-sub)',borderBottom:'1px solid var(--border-sub)'}}/>;
           const items = eventsByDate[day]||[];
           const isToday = today.getDate()===day && today.getMonth()===mon && today.getFullYear()===year;
           const isSelected = selected===day;
           const isPast = new Date(year,mon,day) < new Date(today.getFullYear(),today.getMonth(),today.getDate());
           return (
             <div key={day}
               style={{minHeight:80,padding:'6px 4px',borderRight:'1px solid var(--border-sub)',borderBottom:getDayBorder(day),cursor:'pointer',background:isSelected?'rgba(255,107,53,0.08)':getDayBg(day),transition:'background 0.15s',opacity:isPast?0.5:1}}
               onClick={()=>setSelected(isSelected?null:day)}>
               <div style={{fontFamily:"'DM Mono',monospace",fontSize:11,fontWeight:500,color:isToday?'#FF6B35':'var(--sub)',background:isToday?'rgba(255,107,53,0.1)':'transparent',borderRadius:'50%',width:22,height:22,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:4}}>{day}</div>
               <div style={{display:'flex',flexDirection:'column',gap:2}}>
                 {items.slice(0,2).map((item,idx)=>(
                   <div key={idx} style={{fontSize:9,fontWeight:600,color:item._type==='booking_request'?'#FF6B35':item._type==='event'?'var(--blue)':'var(--muted)',background:'rgba(255,255,255,0.04)',borderRadius:3,padding:'1px 4px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                     {item._type==='booking_request'?'⬤ req':item.title||'Event'}
                   </div>
                 ))}
                 {items.length>2&&<div style={{fontSize:9,color:'var(--muted)'}}>+{items.length-2} more</div>}
               </div>
             </div>
           );
         })}
       </div>
     </div>

     {/* Selected day detail */}
     {selected && (
       <div style={{background:'var(--card)',borderRadius:14,border:'1px solid var(--border)',padding:20,marginBottom:16}}>
         <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
           <div style={{fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:15}}>
             {month.toLocaleDateString('en-US',{month:'long'})} {selected}
             {selectedAvail && <span style={{marginLeft:10,fontFamily:"'DM Mono',monospace",fontSize:9,textTransform:'uppercase',letterSpacing:'0.1em',padding:'3px 8px',borderRadius:20,background:selectedAvail.status==='blocked'?'rgba(248,113,113,0.15)':selectedAvail.status==='tentative'?'rgba(251,191,36,0.15)':'rgba(52,211,153,0.15)',color:selectedAvail.status==='blocked'?'#f87171':selectedAvail.status==='tentative'?'#fbbf24':'#34d399'}}>{selectedAvail.status}</span>}
           </div>
           <button onClick={()=>openBlockModal(selected)} style={{padding:'7px 14px',borderRadius:8,background:'var(--surface)',border:'1px solid var(--border)',color:'var(--text)',fontWeight:600,fontSize:12,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>
             {selectedAvail ? 'Edit Availability' : 'Set Availability'}
           </button>
         </div>
         {selectedAvail?.note && <p style={{fontSize:12,color:'var(--sub)',marginBottom:12,fontStyle:'italic'}}>Note: {selectedAvail.note}</p>}
         {selectedItems.length===0
           ? <p style={{color:'var(--sub)',fontSize:13}}>No events or requests on this date.</p>
           : <div style={{display:'flex',flexDirection:'column',gap:10}}>
               {selectedItems.map((item,i)=>(
                 <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'var(--surface)',borderRadius:10,border:'1px solid var(--border-sub)'}}>
                   <div style={{width:8,height:8,borderRadius:'50%',flexShrink:0,background:STATUS_COLOR[item.status]||'var(--muted)'}}/>
                   <div style={{flex:1}}>
                     <div style={{fontWeight:600,fontSize:13}}>{item._type==='booking_request'?`Booking Request · ${item.planner_name||item.planner_email||'Planner'}`:item.title||'Event'}</div>
                     <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>
                       {item._type==='booking_request'?`${item.event_type||''} · ${item.guest_count||'?'} guests · ${item.status}`:`${item.category||''} · ${item.status}`}
                     </div>
                   </div>
                   {item._type==='booking_request' && item.status==='pending' && (
                     <button onClick={()=>{setResponseModal(item);setResponseNote('');}} style={{padding:'5px 12px',borderRadius:7,background:'#FF6B35',color:'#fff',border:'none',fontWeight:700,fontSize:11,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>Respond</button>
                   )}
                   <span style={{fontFamily:"'DM Mono',monospace",fontSize:9,letterSpacing:'0.1em',textTransform:'uppercase',padding:'3px 8px',borderRadius:20,background:'rgba(255,255,255,0.04)',color:STATUS_COLOR[item.status]||'var(--muted)',border:'1px solid var(--border)',flexShrink:0}}>{item.status}</span>
                 </div>
               ))}
             </div>
         }
       </div>
     )}
   </>}

   {/* Requests Panel */}
   {panel==='requests' && (
     <div style={{background:'var(--card)',borderRadius:14,border:'1px solid var(--border)',overflow:'hidden'}}>
       <div style={{padding:'16px 20px',borderBottom:'1px solid var(--border-sub)'}}>
         <div style={{fontWeight:700,fontSize:15}}>Booking Requests</div>
         <div style={{fontSize:12,color:'var(--sub)',marginTop:2}}>{bookingRequests.length} total · {pending.length} pending</div>
       </div>
       {bookingRequests.length===0
         ? <div style={{padding:48,textAlign:'center',color:'var(--sub)',fontSize:13}}>No booking requests yet. Share your venue profile to start receiving requests.</div>
         : <div style={{display:'flex',flexDirection:'column'}}>
             {bookingRequests.map(req=>(
               <div key={req.id} style={{padding:'16px 20px',borderBottom:'1px solid var(--border-sub)',display:'flex',alignItems:'flex-start',gap:16,flexWrap:'wrap'}}>
                 <div style={{flex:1,minWidth:200}}>
                   <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                     <span style={{fontWeight:700,fontSize:14}}>{req.planner_name||req.planner_email||'Planner'}</span>
                     <span style={{fontFamily:"'DM Mono',monospace",fontSize:9,textTransform:'uppercase',letterSpacing:'0.1em',padding:'2px 8px',borderRadius:20,background:req.status==='pending'?'rgba(255,107,53,0.12)':req.status==='approved'?'rgba(52,211,153,0.12)':'rgba(248,113,113,0.12)',color:STATUS_COLOR[req.status]||'var(--muted)'}}>{req.status}</span>
                   </div>
                   <div style={{fontSize:12,color:'var(--sub)',display:'flex',flexWrap:'wrap',gap:12,marginBottom:req.message?8:0}}>
                     <span>📅 {new Date(req.event_date+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</span>
                     {req.event_type&&<span>🎉 {req.event_type}</span>}
                     {req.guest_count&&<span>👥 {req.guest_count} guests</span>}
                   </div>
                   {req.message&&<div style={{fontSize:12,color:'var(--text)',background:'var(--surface)',borderRadius:8,padding:'8px 12px',marginTop:8,lineHeight:1.5}}>{req.message}</div>}
                   {req.response_note&&<div style={{fontSize:12,color:'var(--sub)',marginTop:8,fontStyle:'italic'}}>Your response: {req.response_note}</div>}
                 </div>
                 {req.status==='pending' && (
                   <div style={{display:'flex',gap:8,flexShrink:0}}>
                     <button onClick={()=>{setResponseModal(req);setResponseNote('');}} style={{padding:'7px 14px',borderRadius:8,background:'#FF6B35',color:'#fff',border:'none',fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>Respond</button>
                   </div>
                 )}
               </div>
             ))}
           </div>
       }
     </div>
   )}

// Plan & Billing
function Inbox({ userId }) {
  const [tab, setTab] = React.useState('messages');
  const [conversations, setConversations] = React.useState([]);
  const [requests, setRequests] = React.useState([]);
  const [activeConvo, setActiveConvo] = React.useState(null);
  const [messages, setMessages] = React.useState([]);
  const [newMessage, setNewMessage] = React.useState('');
  const [attachment, setAttachment] = React.useState(null);
  const [sending, setSending] = React.useState(false);
  const [unreadCount, setUnreadCount] = React.useState(0);
  const bottomRef = React.useRef(null);
  const fileRef = React.useRef(null);

  React.useEffect(() => { if (userId) { fetchConversations(); fetchRequests(); } }, [userId]);
  React.useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

  React.useEffect(() => {
    if (!activeConvo) return;
    const sub = sb.channel('inbox-venue-' + activeConvo.id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'conversation_id=eq.' + activeConvo.id },
        payload => { setMessages(prev => [...prev, payload.new]); markRead(activeConvo.id); })
      .subscribe();
    return () => sb.removeChannel(sub);
  }, [activeConvo]);

  async function fetchConversations() {
    const { data } = await sb.from('conversations').select('*')
      .or('participant_a.eq.' + userId + ',participant_b.eq.' + userId)
      .eq('status', 'active').order('last_message_at', { ascending: false });
    if (data) { setConversations(data); let u = 0;
      for (const c of data) { const { count } = await sb.from('messages').select('id', { count: 'exact', head: true }).eq('conversation_id', c.id).neq('sender_id', userId).is('read_at', null); u += count || 0; }
      setUnreadCount(u); }
  }

  async function fetchRequests() {
    const { data } = await sb.from('message_requests').select('*, conversations(*)').eq('recipient_id', userId).eq('status', 'pending');
    if (data) setRequests(data);
  }

  async function openConversation(convo) {
    setActiveConvo(convo);
    const { data } = await sb.from('messages').select('*').eq('conversation_id', convo.id).order('created_at', { ascending: true });
    if (data) setMessages(data);
    await markRead(convo.id); fetchConversations();
  }

  async function markRead(convoId) {
    await sb.from('messages').update({ read_at: new Date().toISOString() }).eq('conversation_id', convoId).neq('sender_id', userId).is('read_at', null);
  }

  async function handleAccept(req) {
    await sb.from('message_requests').update({ status: 'accepted' }).eq('id', req.id);
    await sb.from('conversations').update({ status: 'active' }).eq('id', req.conversation_id);
    fetchRequests(); fetchConversations(); setTab('messages');
  }

  async function handleDecline(req) {
    await sb.from('message_requests').update({ status: 'declined' }).eq('id', req.id);
    await sb.from('conversations').update({ status: 'archived' }).eq('id', req.conversation_id);
    fetchRequests();
  }

  async function sendMessage() {
    if ((!newMessage.trim() && !attachment) || !activeConvo) return;
    setSending(true);
    let attachment_url = null, attachment_type = null;
    if (attachment) {
      const ext = attachment.name.split('.').pop();
      const path = 'inbox/' + activeConvo.id + '/' + Date.now() + '.' + ext;
      const { error } = await sb.storage.from('attachments').upload(path, attachment, { upsert: true });
      if (!error) { const { data: urlData } = sb.storage.from('attachments').getPublicUrl(path); attachment_url = urlData.publicUrl; attachment_type = attachment.type.startsWith('image/') ? 'image' : 'file'; }
    }
    await sb.from('messages').insert({ conversation_id: activeConvo.id, sender_id: userId, sender_role: 'venue', body: newMessage.trim() || null, attachment_url, attachment_type });
    setNewMessage(''); setAttachment(null); setSending(false);
    const { data } = await sb.from('messages').select('*').eq('conversation_id', activeConvo.id).order('created_at', { ascending: true });
    if (data) setMessages(data);
  }

  function fmt(ts) { const d = new Date(ts); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' · ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
  function otherRole(c) { if (!c) return ''; return c.participant_a === userId ? c.participant_b_role : c.participant_a_role; }

  return (
    <div>
      <h1 style={{fontFamily:"'DM Sans',sans-serif",fontSize:24,fontWeight:800,marginBottom:6,letterSpacing:"-0.03em"}}>Inbox {unreadCount > 0 && <span style={{background:"#FF6B35",color:"#fff",borderRadius:99,fontSize:12,fontWeight:700,padding:"2px 8px",marginLeft:8}}>{unreadCount}</span>}</h1>
      <p style={{color:"var(--sub)",marginBottom:24,fontSize:14}}>Messages from planners and vendors.</p>

                </div>
              ))

            {tab==='requests'&&(requests.length===0
              ?<div style={{padding:24,color:"var(--sub)",fontSize:13,textAlign:"center"}}>No pending requests.</div>
              :requests.map(r=>(
                <div key={r.id} style={{padding:"16px",borderBottom:"1px solid var(--border-sub)"}}>
                  <div style={{fontWeight:700,fontSize:13,marginBottom:4,textTransform:"capitalize"}}>{r.conversations?.participant_a_role} wants to connect</div>
                  <div style={{fontSize:12,color:"var(--sub)",marginBottom:12}}>{new Date(r.created_at).toLocaleDateString()}</div>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={()=>handleAccept(r)} style={{flex:1,padding:"7px 0",borderRadius:8,background:"#FF6B35",color:"#fff",border:"none",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"DM Sans,sans-serif"}}>Accept</button>
                    <button onClick={()=>handleDecline(r)} style={{flex:1,padding:"7px 0",borderRadius:8,background:"transparent",color:"var(--sub)",border:"1px solid var(--border)",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"DM Sans,sans-serif"}}>Decline</button>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
        <div style={{flex:1,display:"flex",flexDirection:"column"}}>
          {!activeConvo
            ?<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--sub)",fontSize:14}}>Select a conversation to start messaging</div>
            :<>
              <div style={{padding:"14px 20px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:12}}>
                <div style={{width:34,height:34,borderRadius:"50%",background:"rgba(255,107,53,0.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:"#FF6B35"}}>{otherRole(activeConvo)?.[0]?.toUpperCase()}</div>
                <div><div style={{fontWeight:700,fontSize:14,textTransform:"capitalize"}}>{otherRole(activeConvo)}</div><div style={{fontSize:10,color:"var(--sub)",fontFamily:"DM Mono,monospace",letterSpacing:"0.08em",textTransform:"uppercase"}}>Active</div></div>
              </div>
              <div style={{flex:1,overflowY:"auto",padding:"16px 20px",display:"flex",flexDirection:"column",gap:10}}>
                {messages.map(m=>{
                  const mine=m.sender_id===userId;
                  return <div key={m.id} style={{display:"flex",flexDirection:"column",alignItems:mine?"flex-end":"flex-start"}}>
                    <div style={{maxWidth:"70%",background:mine?"#FF6B35":"var(--card)",color:mine?"#fff":"var(--text)",borderRadius:mine?"16px 16px 4px 16px":"16px 16px 16px 4px",padding:"10px 14px",fontSize:14,lineHeight:1.5}}>
                      {m.body&&<div>{m.body}</div>}
                      {m.attachment_url&&m.attachment_type==='image'&&<img src={m.attachment_url} alt="attachment" style={{maxWidth:"100%",borderRadius:8,marginTop:m.body?8:0}}/>}
                      {m.attachment_url&&m.attachment_type==='file'&&<a href={m.attachment_url} target="_blank" rel="noreferrer" style={{color:mine?"rgba(255,255,255,0.85)":"#FF6B35",fontSize:13,display:"block",marginTop:m.body?6:0}}>Download attachment</a>}
                    </div>
                    <div style={{fontSize:10,color:"var(--muted)",marginTop:4,fontFamily:"DM Mono,monospace"}}>{fmt(m.created_at)}</div>
                  </div>;
                })}
                <div ref={bottomRef}/>
              </div>
              <div style={{padding:"12px 20px",borderTop:"1px solid var(--border)"}}>
                {attachment&&<div style={{marginBottom:8,padding:"6px 12px",background:"var(--card)",borderRadius:8,fontSize:12,color:"var(--sub)",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span>{attachment.name}</span><button onClick={()=>setAttachment(null)} style={{background:"none",border:"none",color:"var(--sub)",cursor:"pointer",fontSize:14}}>×</button></div>}
                <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
                  <textarea value={newMessage} onChange={e=>setNewMessage(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}} placeholder="Type a message... (Enter to send)" rows={2} style={{flex:1,resize:"none",borderRadius:10,padding:"10px 14px",fontSize:14,background:"var(--card)",border:"1px solid var(--border)",color:"var(--text)",fontFamily:"DM Sans,sans-serif"}}/>
                  <div style={{display:"flex",flexDirection:"column",gap:6}}>
                    <button onClick={()=>fileRef.current?.click()} style={{width:38,height:38,borderRadius:10,background:"var(--card)",border:"1px solid var(--border)",color:"var(--sub)",cursor:"pointer",fontSize:15,display:"flex",alignItems:"center",justifyContent:"center"}}>📎</button>
                    <button onClick={sendMessage} disabled={sending} style={{width:38,height:38,borderRadius:10,background:"#FF6B35",border:"none",color:"#fff",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",opacity:sending?0.6:1}}>{sending?"...":"↑"}</button>
                  </div>
                  <input ref={fileRef} type="file" style={{display:"none"}} onChange={e=>setAttachment(e.target.files[0])} accept="image/*,.pdf,.doc,.docx"/>
                </div>
              </div>
            </>
          }
        </div>
      </div>
    </div>
  );
}

// ── STAFF MANAGEMENT ─────────────────────────────────────────
function StaffManagement({venue, userId}) {
 const [staff, setStaff] = React.useState([]);
 const [busy, setBusy] = React.useState(true);
 const [inviteEmail, setInviteEmail] = React.useState('');
 const [inviteRole, setInviteRole] = React.useState('staff');
 const [inviting, setInviting] = React.useState(false);
 const [msg, setMsg] = React.useState({text:'',type:''});
 const isPremium = venue?.tier==='premium';
 const STAFF_LIMIT = 2;

 React.useEffect(()=>{
   if(venue?.id) loadStaff();
 },[venue?.id]);

 async function loadStaff(){
   setBusy(true);
   const {data}=await sb.from('venue_staff').select('*').eq('venue_id',venue.id).neq('status','removed').order('created_at',{ascending:true});
   setStaff(data||[]);
   setBusy(false);
 }

 async function inviteStaff(){
   if(!inviteEmail.trim()){setMsg({text:'Enter an email address.',type:'error'});return;}
   if(!isPremium){setMsg({text:'Staff accounts require a Premium plan.',type:'error'});return;}
   const activeStaff=staff.filter(s=>s.status!=='removed');
   if(activeStaff.length>=STAFF_LIMIT){setMsg({text:`You've reached the ${STAFF_LIMIT} staff limit on Premium. Contact us to add unlimited staff for $25/mo.`,type:'error'});return;}
   setInviting(true);
   // Check if user exists
   const {data:existing}=await sb.from('venue_staff').select('id').eq('venue_id',venue.id).eq('staff_email',inviteEmail.trim()).maybeSingle();
   if(existing){setMsg({text:'This person is already on your staff.',type:'error'});setInviting(false);return;}
   // Look up user by email
   const {data:userRecord}=await sb.rpc('get_planner_emails',{user_ids:[]}).catch(()=>({data:null}));
   // Insert invite - staff_user_id will be null until they accept
   const {error}=await sb.from('venue_staff').insert({
     venue_id:venue.id,
     owner_id:userId,
     staff_email:inviteEmail.trim(),
     role:inviteRole,
     status:'pending',
   });
   if(error){setMsg({text:'Error: '+error.message,type:'error'});}
   else{setMsg({text:`Invite sent to ${inviteEmail}. They'll need to sign in and accept.`,type:'success'});setInviteEmail('');}
   setInviting(false);
   loadStaff();
 }

 async function removeStaff(id){
   if(!confirm('Remove this staff member?'))return;
   await sb.from('venue_staff').update({status:'removed'}).eq('id',id);
   loadStaff();
 }

 async function updateRole(id, role){
   await sb.from('venue_staff').update({role}).eq('id',id);
   loadStaff();
 }

 const activeStaff=staff.filter(s=>s.status!=='removed');

 if(!isPremium) return (
   <div>
     <h1 style={{fontFamily:"'DM Sans',sans-serif",fontSize:24,fontWeight:800,letterSpacing:"-0.03em",marginBottom:6}}>Staff & Access</h1>
     <p style={{color:"var(--sub)",fontSize:14,marginBottom:24}}>Add team members to help manage your venue.</p>
     <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:48,textAlign:"center"}}>
       <div style={{fontSize:32,marginBottom:16}}>👥</div>
       <div style={{fontWeight:800,fontSize:18,marginBottom:8,letterSpacing:"-0.02em"}}>Staff Access is a Premium Feature</div>
       <div style={{color:"var(--sub)",fontSize:14,marginBottom:24,maxWidth:360,margin:"0 auto 24px",lineHeight:1.6}}>Upgrade to Premium to add up to 2 staff members who can manage events, bookings, and inquiries on your behalf.</div>
       <button onClick={()=>{}} style={{background:"#FF6B35",color:"#fff",border:"none",borderRadius:10,padding:"12px 28px",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>Upgrade to Premium →</button>
     </div>
   </div>
 );

 return (
 <div>
   <h1 style={{fontFamily:"'DM Sans',sans-serif",fontSize:24,fontWeight:800,letterSpacing:"-0.03em",marginBottom:6}}>Staff & Access</h1>
   <p style={{color:"var(--sub)",fontSize:14,marginBottom:24}}>Manage who can access your venue portal. Premium includes {STAFF_LIMIT} staff accounts.</p>

   {/* Invite form */}
   <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:14,padding:24,marginBottom:20}}>
     <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>Invite Staff Member</div>
     <div style={{fontSize:13,color:"var(--sub)",marginBottom:16}}>{activeStaff.length}/{STAFF_LIMIT} staff slots used{activeStaff.length>=STAFF_LIMIT?' · <a href="mailto:info@cbusevents.com" style="color:#FF6B35">Contact us for unlimited ($25/mo)</a>':''}</div>
     <div style={{display:"grid",gridTemplateColumns:"1fr auto auto",gap:10,alignItems:"flex-end"}}>
       <div>
         <label style={{fontSize:12,color:"var(--sub)",display:"block",marginBottom:6,fontWeight:600}}>Email Address</label>
         <input value={inviteEmail} onChange={e=>setInviteEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&inviteStaff()} placeholder="staff@email.com" style={{width:"100%",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,padding:"9px 12px",color:"var(--text)",fontSize:13,fontFamily:"'DM Sans',sans-serif"}}/>
       </div>
       <div>
         <label style={{fontSize:12,color:"var(--sub)",display:"block",marginBottom:6,fontWeight:600}}>Role</label>
         <select value={inviteRole} onChange={e=>setInviteRole(e.target.value)} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,padding:"9px 12px",color:"var(--text)",fontSize:13,fontFamily:"'DM Sans',sans-serif",height:38}}>
           <option value="staff">Staff</option>
           <option value="manager">Manager</option>
         </select>
       </div>
       <button onClick={inviteStaff} disabled={inviting||activeStaff.length>=STAFF_LIMIT} style={{background:"#FF6B35",color:"#fff",border:"none",borderRadius:8,padding:"9px 20px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",opacity:inviting||activeStaff.length>=STAFF_LIMIT?0.5:1,height:38}}>
         {inviting?'Inviting...':'Invite'}
       </button>
     </div>
     {msg.text&&<div style={{marginTop:10,fontSize:13,color:msg.type==='error'?'#f87171':'#34d399'}} dangerouslySetInnerHTML={{__html:msg.text}}/>}
   </div>

   {/* Role guide */}
   <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
     {[
       {role:'Manager',color:'#818cf8',perms:['All venue features','Events & bookings','Earnings & analytics','Inquiries & inbox','Venue profile']},
       {role:'Staff',color:'#34d399',perms:['Dashboard view','Events & bookings','Calendar','Inquiries & inbox','NOT earnings/billing']},
     ].map(r=>(
       <div key={r.role} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:16}}>
         <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
           <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,textTransform:"uppercase",letterSpacing:"0.1em",padding:"3px 8px",borderRadius:20,background:`${r.color}22`,color:r.color}}>{r.role}</span>
         </div>
         {r.perms.map(p=>(
           <div key={p} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,fontSize:12,color:p.startsWith('NOT')?'var(--muted)':'var(--sub)'}}>
             <span style={{color:p.startsWith('NOT')?'#f87171':r.color,fontSize:10}}>{p.startsWith('NOT')?'✕':'✓'}</span>
             {p.replace('NOT ','')}
           </div>
         ))}
       </div>
     ))}
   </div>

   {/* Staff list */}
   <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:14,overflow:"hidden"}}>
     <div style={{padding:"14px 20px",borderBottom:"1px solid var(--border-sub)",fontWeight:700,fontSize:14}}>
       Current Staff {busy?'':'('+activeStaff.length+')'}
     </div>
     {busy?<div style={{padding:32,textAlign:"center"}}><div className="spinner"/></div>
     :activeStaff.length===0
       ?<div style={{padding:32,textAlign:"center",color:"var(--sub)",fontSize:13}}>No staff members yet. Invite someone above.</div>
       :<table style={{width:"100%",borderCollapse:"collapse"}}>
         <thead><tr style={{borderBottom:"1px solid var(--border-sub)"}}>
           <th style={{padding:"10px 20px",textAlign:"left",fontSize:11,fontFamily:"'DM Mono',monospace",letterSpacing:"0.1em",textTransform:"uppercase",color:"var(--muted)"}}>Email</th>
           <th style={{padding:"10px 20px",textAlign:"left",fontSize:11,fontFamily:"'DM Mono',monospace",letterSpacing:"0.1em",textTransform:"uppercase",color:"var(--muted)"}}>Role</th>
           <th style={{padding:"10px 20px",textAlign:"left",fontSize:11,fontFamily:"'DM Mono',monospace",letterSpacing:"0.1em",textTransform:"uppercase",color:"var(--muted)"}}>Status</th>
           <th style={{padding:"10px 20px",textAlign:"right",fontSize:11,fontFamily:"'DM Mono',monospace",letterSpacing:"0.1em",textTransform:"uppercase",color:"var(--muted)"}}>Actions</th>
         </tr></thead>
         <tbody>
           {activeStaff.map(s=>(
             <tr key={s.id} style={{borderBottom:"1px solid var(--border-sub)"}}>
               <td style={{padding:"14px 20px",fontSize:13,fontWeight:500}}>{s.staff_email}</td>
               <td style={{padding:"14px 20px"}}>
                 <select value={s.role} onChange={e=>updateRole(s.id,e.target.value)} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:6,padding:"4px 8px",color:"var(--text)",fontSize:12,fontFamily:"'DM Sans',sans-serif",cursor:"pointer"}}>
                   <option value="staff">Staff</option>
                   <option value="manager">Manager</option>
                 </select>
               </td>
               <td style={{padding:"14px 20px"}}>
                 <span style={{fontFamily:"'DM Mono',monospace",fontSize:9,textTransform:"uppercase",letterSpacing:"0.1em",padding:"3px 8px",borderRadius:20,background:s.status==='active'?'rgba(52,211,153,0.12)':'rgba(251,191,36,0.12)',color:s.status==='active'?'#34d399':'#fbbf24'}}>{s.status}</span>
               </td>
               <td style={{padding:"14px 20px",textAlign:"right"}}>
                 <button onClick={()=>removeStaff(s.id)} style={{background:"transparent",border:"1px solid rgba(248,113,113,0.3)",color:"#f87171",borderRadius:6,padding:"5px 12px",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>Remove</button>
               </td>
             </tr>
           ))}
         </tbody>
       </table>
     }
   </div>

   {/* Accept invite info */}
   <div style={{background:"rgba(129,140,248,0.06)",border:"1px solid rgba(129,140,248,0.2)",borderRadius:12,padding:16,marginTop:16}}>
     <div style={{fontSize:13,color:"#818cf8",fontWeight:600,marginBottom:4}}>How staff invites work</div>
     <div style={{fontSize:12,color:"var(--sub)",lineHeight:1.6}}>
       After you invite someone, they need to sign up or sign in at <strong style={{color:"var(--text)"}}>cbusevents.com/cbus-venue-portal.html</strong> using the exact email you invited. Their account will automatically gain access to your venue portal. Status will update from Pending to Active once they log in.
     </div>
   </div>
 </div>
 );
}

function PlanBilling({venue}) {
 const cur=venue?.tier||"free";
 const [loading,setLoading]=React.useState(null);
 const [err,setErr]=React.useState(null);

 const plans=[
 {id:"free", name:"Free", price:0, priceId:null, perks:["1 venue listing","Up to 4 events/month","Basic search placement","Public venue page"]},
 {id:"standard",name:"Standard", price:39, priceId:"standard", perks:["Up to 20 events/month","Priority search placement","Inquiry inbox enabled","Email support","Analytics dashboard","Featured in venue directory"]},
 {id:"premium", name:"Premium", price:99, priceId:"premium", perks:["Unlimited events","Top of all search results","Homepage feature slot","Multi-account access","Staff management tools","Ticket revenue share (25% of platform fee)","Geolocation promotions","Dedicated support"]},
 ];

 const checkout=(plan)=>{
 if(!plan.priceId)return;
 const links={standard:PAYMENT_LINK_STANDARD,premium:PAYMENT_LINK_PREMIUM};
 const url=links[plan.id];
 if(!url)return;
 window.open(url,'_blank');
 };

 // Handle return from Stripe — auto-update tier
 React.useEffect(()=>{
 const p=new URLSearchParams(window.location.search);
 if(p.get("upgrade")==="success"&&venue?.id){
   // Get tier from param or hash fallback
   const hashTier=window.location.hash.replace('#tier=','');
   const newTier=p.get("tier")||hashTier||"standard";
   // Write tier to Supabase immediately
   sb.from("venues").update({
     tier:newTier,
     subscription_status:"active",
     subscription_tier:newTier.toUpperCase(),
   }).eq("id",venue.id).then(({error})=>{
     if(!error){
       // Reload venue data to reflect new tier
       sb.from("venues").select("*").eq("id",venue.id).single().then(({data})=>{
         if(data) setVenue(data);
       });
     }
   });
   window.history.replaceState({},"",window.location.pathname);
 }
 },[venue?.id]);

 const upgraded=new URLSearchParams(window.location.search).get("upgrade")==="success";

 return (
 <div> <h2 style={{fontFamily:"'DM Sans',sans-serif",fontSize:22,fontWeight:800,marginBottom:6}}>Plan & Billing</h2> <p style={{color:"var(--sub)",fontSize:14,marginBottom:upgraded?16:32}}>Current plan: <strong style={{color:"#f59e0b"}}>{cur[0].toUpperCase()+cur.slice(1)}</strong></p> {upgraded&&<div style={{background:"rgba(52,211,153,0.08)",border:"1px solid #1a4a24",borderRadius:10,padding:"14px 18px",marginBottom:28,display:"flex",alignItems:"center",gap:10,color:"var(--green)",fontSize:14,fontWeight:600}}> Upgrade successful! Your plan will be activated within a minute.
 </div>}

 {err&&<div style={{background:"rgba(248,113,113,0.08)",border:"1px solid #4a1a1a",borderRadius:10,padding:"12px 16px",marginBottom:20,color:"#ef4444",fontSize:13}}> {err}</div>}

 <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:20}}> {plans.map(p=>{const active=p.id===cur;const isLoading=loading===p.id;return(
 <div key={p.id} style={{background:active?"var(--card)":"var(--surface)",border:`1.5px solid ${active?"#FF6B35":"var(--border)"}`,borderRadius:14,padding:24,position:"relative",marginTop:16}}> {active&&<div style={{position:"absolute",top:-12,left:"50%",transform:"translateX(-50%)",background:"#FF6B35",color:"#fff",borderRadius:20,padding:"2px 14px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>CURRENT</div>}
 {p.id==="premium"&&!active&&<div style={{position:"absolute",top:-12,left:"50%",transform:"translateX(-50%)",background:"#f59e0b",color:"#000",borderRadius:20,padding:"2px 14px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>MOST POPULAR</div>}
 <h3 style={{fontFamily:"'DM Sans',sans-serif",fontWeight:800,fontSize:20,marginBottom:4}}>{p.name}</h3> <div style={{marginBottom:18}}> <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:32,fontWeight:800,color:p.price===0?"var(--text)":"#FF6B35"}}>{p.price===0?"Free":`$${p.price}`}</span> {p.price>0&&<span style={{color:"var(--sub)",fontSize:13}}>/mo</span>}
 </div> <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:22}}> {p.perks.map(k=><div key={k} style={{display:"flex",gap:8,fontSize:13,color:"var(--sub)"}}><span style={{color:"var(--green)"}}></span>{k}</div>)}
 </div> {active
 ?<Btn variant="ghost" style={{width:"100%"}} disabled>Current Plan</Btn> :p.price===0
 ?<Btn variant="ghost" style={{width:"100%",opacity:0.5}} disabled>Downgrade</Btn> :<Btn style={{width:"100%",opacity:isLoading?0.7:1}} variant={p.id==="premium"?"primary":"secondary"} onClick={()=>checkout(p)} disabled={!!loading}> {isLoading?"Redirecting to Stripe...":"Upgrade Now →"}

function Portal() {

 const [page,setPage]=useState(initPage);
 const [venue,setVenue]=useState(null);
 const [events,setEvents]=useState([]);
 const [busy,setBusy]=useState(true);
 const [staffRole,setStaffRole]=useState(null);

 const load=async(retry=0)=>{
   setBusy(true);
   const {data:v}=await sb.from("venues").select("*").eq("owner_id",user.id).maybeSingle();
   if(v){
     setVenue(v);
     if(v?.id){const {data:ev}=await sb.from("events").select("*").eq("venue_id",v.id).order("start_time",{ascending:true});setEvents(ev||[]);}
     setStaffRole(null);
     setBusy(false);
     return;
   }
   const {data:staffRecord}=await sb.from("venue_staff").select("*,venues(*)").eq("staff_user_id",user.id).eq("status","active").maybeSingle();
   if(staffRecord?.venues){
     setVenue(staffRecord.venues);
     setStaffRole(staffRecord.role);
     const {data:ev}=await sb.from("events").select("*").eq("venue_id",staffRecord.venues.id).order("start_time",{ascending:true});
     setEvents(ev||[]);
     setBusy(false);
     return;
   }
   if(!v && !staffRecord && retry < 2){setTimeout(()=>load(retry+1),1200);return;}
   setVenue(null);
   setBusy(false);
 };

 useEffect(()=>{load();},[]);

 const isOwner=staffRole===null;
 const isManager=staffRole==='manager';
 const filteredNav=NAV.filter(n=>{
   if(n.key==='staff') return isOwner;
   if(n.key==='plan') return isOwner;
   if(n.key==='payouts') return isOwner||isManager;
   if(n.key==='earnings') return isOwner||isManager;
   return true;
 });

 return (
 <div style={{display:"flex",minHeight:"100vh"}}>
   <Sidebar active={page} setActive={setPage} profile={profile} userId={user?.id} navItems={filteredNav} staffRole={staffRole}/>
   <main style={{flex:1,padding:36,overflowY:"auto",background:"var(--bg)",minHeight:"100vh"}}>

     {busy?<Spin/>:<>
       {page==="dashboard"&&<Dashboard venue={venue} events={events}/>}
       {page==="venue"&&<VenueForm venue={venue} onSave={load}/>}
       {page==="events"&&<EventsManager venue={venue} events={events} onRefresh={load}/>}
       {page==="calendar"&&<BookingCalendar venue={venue} events={events}/>}
       {page==="earnings"&&<Earnings venue={venue}/>}
       {page==="payouts"&&<VenuePayouts venue={venue}/>}
       {page==="inquiries"&&<Inquiries venue={venue}/>}
       {page==="inbox"&&<Inbox userId={user?.id}/>}
       {page==="staff"&&<StaffManagement venue={venue} userId={user?.id}/>}
       {page==="plan"&&<PlanBilling venue={venue}/>}
     </>}
   </main>
 </div>
 );
}

// ── GLOBAL START CONVERSATION (called from React components) ──
window.startVenueConversation = async function(recipientId, recipientRole, recipientName, subject){
  if(!recipientId){ alert('Cannot start conversation - recipient not found'); return; }
  const {data:{user}} = await sb.auth.getUser();
  if(!user){ alert('Please sign in'); return; }
  const uid = user.id;

  // Find existing conversation - two separate queries avoids PostgREST nested and() issues
  const {data:asA} = await sb.from('conversations')
    .select('id').eq('participant_a', uid).eq('participant_b', recipientId).neq('status','archived').maybeSingle();
  const {data:asB} = await sb.from('conversations')
    .select('id').eq('participant_a', recipientId).eq('participant_b', uid).neq('status','archived').maybeSingle();

  let convoId = asA?.id || asB?.id;

  if(!convoId){
    const {data:convo, error} = await sb.from('conversations').insert({
      participant_a:      uid,
      participant_b:      recipientId,
      participant_a_role: 'venue_owner',
      participant_b_role: recipientRole,
      status:             'active',
      last_message_at:    new Date().toISOString(),
    }).select().single();
    if(error){ alert('Could not start conversation'); return; }
    convoId = convo.id;
    await sb.from('message_requests').insert({
      conversation_id: convoId,
      recipient_id:    recipientId,
      status:          'pending',
    });
  }

  // Navigate to inbox - trigger React nav
  const navInbox = document.querySelector('[data-key="inbox"]') || document.getElementById('nav-inbox');
  if(navInbox) navInbox.click();
  else { window._pendingInboxConvo = convoId; }
};

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);

(function(){
  function syncVenueMobileNav(page){
    document.querySelectorAll('.pmn-btn').forEach(function(b){b.classList.remove('active');});

    if(btn)btn.classList.add('active');

  // Expose setter for React to call
  var _orig=null;
  Object.defineProperty(window,'_setVenuePage',{
    set:function(fn){_orig=fn;},
    get:function(){
      return function(p){
        if(_orig)_orig(p);
        syncVenueMobileNav(p);
      };
    }
  });
  // Poll for React page state changes via MutationObserver on nav
  var observer=new MutationObserver(function(){
    var active=document.querySelector('button[style*="FF6B35"][style*="borderLeft"]');
    // fallback: sync from sidebar active item
  });
  // Sync on button click directly
  document.addEventListener('click',function(e){
    var btn=e.target.closest('.pmn-btn');
    if(!btn)return;
    var id=btn.id.replace('pmn-','');
    syncVenueMobileNav(id);
  });
  // Initial active
  syncVenueMobileNav('dashboard');
})();
